["⏪ Past Simple",`<ul><li>(+) S + V2 → <i>She sent the email.</i></li><li>(−) S + <b>didn't + V1</b> → <i>She didn't send...</i></li><li>(?) <b>Did</b> + S + V1? → <i>Did you attend?</i></li><li>Wh: What/Where/When/Who/Why + <b>did</b> + S + V1? (V1, bukan V2!)</li><li>Regular: +ed (close→closed, study→studied, copy→copied)</li><li>Irregular: go→went, buy→bought, write→wrote, send→sent, lose→lost, meet→met, blow→blew, sink→sank, bend→bent, pay→paid, get→got</li><li>Salah umum: ❌ buyed, goed, quited → ✅ bought, went, quit</li></ul>`],
["🗣 Pelafalan -ed",`<ul><li><b>/id/</b> → verb berakhir bunyi <b>t / d</b>: wanted, needed, submitted, guided</li><li><b>/t/</b> → setelah bunyi tak bersuara (k, p, s, sh, ch, f, x): fixed, watched, packed (filed = /d/)</li><li><b>/d/</b> → sisanya: closed, played, called, opened, answered</li></ul>`],
["❓ Wh-Questions",`<table><tr><td>Who</td><td>orang</td></tr><tr><td>What</td><td>benda / kegiatan</td></tr><tr><td>When</td><td>waktu</td></tr><tr><td>Where</td><td>tempat</td></tr><tr><td>Why</td><td>alasan (jawab: Because...)</td></tr></table>Lihat <b>jawabannya</b> untuk menentukan kata tanya.`],
["📖 Recount Text",`<ul><li><b>Fungsi:</b> menceritakan pengalaman/kejadian masa lalu (Simple Past)</li><li><b>1. Orientation</b>: latar — Who, When, Where (<i>Last Monday, our team visited...</i>)</li><li><b>2. Series of Events</b>: kejadian berurutan — First, Next, After that, Finally</li><li><b>3. Re-orientation</b>: penutup/kesan/kesimpulan — <i>Overall, the trip was successful...</i></li></ul>`]
];
function cheat(){$.innerHTML='<div class="top"><a onclick="home()">← Kembali</a><span></span></div><h1>📝 Cheatsheet</h1><p class="s">Ringkasan rumus & aturan. Ketuk judul untuk membuka.</p>'+CS.map(c=>`<details><summary>${c[0]}</summary><div>${c[1]}</div></details>`).join("")+'<button class="btn" onclick="home()">Kembali ke menu</button>';scrollTo(0,0)}
function home(){const d=ld();let h=`<h1>📘 Latihan Ujian English</h1><button class="btn" style="margin:0 0 6px;background:#f59e0b" onclick="cheat()">📝 Buka Cheatsheet</button><p class="s">${Q.length} soal · modal verbs, telepon, email, grammar, past simple, recount. Tiap sesi campur semua materi.</p>`;
SES.forEach((s,n)=>{const b=d[s];h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="go(${n})"><span><b>${s}</b><br><small style="color:var(--m)">${N} soal${b!=null?" · terbaik "+b:""}</small></span><span class="bd">Mulai</span></div></div>`});
h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="go(-1)"><span><b>🎲 Acak 50 soal baru</b><small style="color:var(--m)">Berbeda tiap main</small></span><span class="bd">Mulai</span></div></div>`;
h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="go(-2)"><span><b>🏁 Simulasi semua soal</b><br><small style="color:var(--m)">${Q.length} soal diacak</small></span><span class="bd">Mulai</span></div></div>`;$.innerHTML=h}
function go(n){if(n>=0){key=SES[n];L=sh(sd(Q.map((_,k)=>k),n+1).slice(0,N).map(k=>Q[k]))}else if(n==-1){key="";L=sh(Q).slice(0,N)}else{key="";L=sh(Q)}i=0;sc=0;wr=[];show()}
function show(){const q=L[i];const o=sh(q[1].map((t,k)=>[t,k==q[2]]));
$.innerHTML=`<div class="top"><a onclick="if(confirm('Keluar dari latihan?'))home()">← Keluar</a><span>${i+1} / ${L.length} · Skor ${sc}</span></div><div class="bar"><i style="width:${i/L.length*100}%"></i></div><div class="card"><div class="q">${q[0].replace(/</g,"&lt;")}</div><div id="op">${o.map((x,k)=>`<button class="o" data-ok="${x[1]?1:0}" onclick="pk(this)">${"ABCD"[k]}. ${x[0]}</button>`).join("")}</div><div id="ex"></div></div><div id="nx"></div>`}
function pk(b){const q=L[i],ok=b.dataset.ok=="1";document.querySelectorAll(".o").forEach(e=>{e.disabled=true;if(e.dataset.ok=="1")e.classList.add("ok")});
if(ok)sc++;else{b.classList.add("no");wr.push([q[0],q[1][q[2]],q[3]])}
document.getElementById("ex").innerHTML=`<div class="fb ${ok?"g":"r"}"><b>${ok?"✅ Benar!":"❌ Salah"}</b>${ok?"":"<br>Jawaban benar: <b>"+q[1][q[2]]+"</b>"}<br>💡 ${q[3]}</div>`;
document.getElementById("nx").innerHTML=`<button class="btn" onclick="nx()">${i+1<L.length?"Lanjut →":"Lihat hasil"}</button>`}
function nx(){i++;i<L.length?show():fin()}
function fin(){const p=Math.round(sc/L.length*100);if(key)sv(key,sc);
$.innerHTML=`<h1>Hasil</h1><div class="card"><div class="sc">${sc}/${L.length}</div><p class="s" style="text-align:center">${p}% · ${p>=80?"Mantap! 🎉":p>=60?"Lumayan, terus latihan 💪":"Pelajari lagi pembahasannya 📖"}</p></div>`+(wr.length?`<h3>Perlu diulang (${wr.length})</h3>`+wr.map(w=>`<div class="card rv"><b style="white-space:pre-line">${w[0].replace(/</g,"&lt;")}</b><br>Jawaban: <span style="color:var(--ok)">${w[1]}</span><br><span style="color:var(--m)">${w[2]}</span></div>`).join(""):"")+`<button class="btn" style="background:#f59e0b" onclick="cheat()">📝 Buka Cheatsheet</button><button class="btn" onclick="home()">Kembali ke menu</button>`;scrollTo(0,0)}
home();
</script></body></html>
