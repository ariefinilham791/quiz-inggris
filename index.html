<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Soal Quiz 3 — Business English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f5f1;
  --card:#ffffff;
  --ink:#16222b;
  --ink-soft:#5b6b74;
  --line:#e2ded5;
  --accent:#0f6b5c;
  --accent-soft:#e3f0ec;
  --ok:#14684f;
  --ok-bg:#e4f2ec;
  --no:#a8322b;
  --no-bg:#fbe9e7;
  --note:#8a6a12;
  --note-bg:#fbf2dd;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10181d;
    --card:#172128;
    --ink:#e8eef0;
    --ink-soft:#9aabb3;
    --line:#26333b;
    --accent:#4fd1b5;
    --accent-soft:#16302c;
    --ok:#6fe0b6;
    --ok-bg:#12312a;
    --no:#ff9e94;
    --no-bg:#3a1e1c;
    --note:#f0cf80;
    --note-bg:#312917;
  }
}
:root[data-theme="dark"]{
  --paper:#10181d; --card:#172128; --ink:#e8eef0; --ink-soft:#9aabb3; --line:#26333b;
  --accent:#4fd1b5; --accent-soft:#16302c; --ok:#6fe0b6; --ok-bg:#12312a;
  --no:#ff9e94; --no-bg:#3a1e1c; --note:#f0cf80; --note-bg:#312917;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(96px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px;line-height:1.55;
}
.wrap{max-width:620px;margin:0 auto;padding:0 14px 90px}

header.top{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding-top:env(safe-area-inset-top,0px);
  border-bottom:1px solid var(--line);
}
.brand{max-width:620px;margin:0 auto;padding:12px 14px 6px;display:flex;align-items:center;gap:10px}
.brand h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
.brand p{margin:0;font-size:12.5px;color:var(--ink-soft)}
.theme-btn{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer}
nav.tabs{max-width:620px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  font:inherit;font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer;
}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}

.intro{margin:18px 0 6px}
.intro h2{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.intro p{margin:0;color:var(--ink-soft);font-size:14.5px}

.scorebar{
  position:sticky;top:calc(96px + env(safe-area-inset-top,0px));z-index:10;
  display:flex;align-items:center;gap:10px;margin:14px 0 18px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;
}
.scorebar .track{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.scorebar .fill{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.scorebar b{font-size:13.5px;font-weight:700;white-space:nowrap}
.scorebar span{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}

.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin-bottom:12px}
.q .num{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:6px}
.q .txt{white-space:pre-line;font-size:15.5px;margin-bottom:10px}
.opt{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  border:1px solid var(--line);background:transparent;color:var(--ink);
  font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;margin-bottom:7px;cursor:pointer;
}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .k{font-weight:700;color:var(--ink-soft);min-width:15px}
.opt.pick-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.pick-ok .k,.opt.pick-no .k{color:inherit}
.opt.pick-no{background:var(--no-bg);border-color:var(--no);color:var(--no);font-weight:600}
.opt.show-ok{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default;opacity:1}
.exp{display:none;margin-top:8px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.exp.on{display:block}
.exp b{color:var(--accent)}

.done{display:none;background:var(--card);border:1px solid var(--accent);border-radius:16px;padding:16px;text-align:center;margin-top:6px}
.done.on{display:block}
.done .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.rev{text-align:left;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.rev h4{margin:0 0 8px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--no-bg);color:var(--no);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.chip.good{background:var(--ok-bg);color:var(--ok)}
.miss{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.miss .tag{font-size:12px;font-weight:700;color:var(--no);margin-bottom:5px}
.miss .qt{white-space:pre-line;font-size:14.5px;margin-bottom:7px}
.miss .row{font-size:14px;margin-bottom:3px}
.miss .row .lbl{color:var(--ink-soft)}
.miss .you{color:var(--no);font-weight:600}
.miss .key{color:var(--ok);font-weight:600}
.miss .why{margin-top:7px;font-size:14px;background:var(--accent-soft);border-radius:10px;padding:9px 11px}
.actions{display:flex;gap:8px;margin:14px 0 4px}
.actions.three button{font-size:13.5px;padding:10px 6px}
.actions button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;padding:11px;border-radius:12px;cursor:pointer}
.actions button.main{background:var(--accent);border-color:var(--accent);color:var(--paper)}

/* cheatsheet */
.cs h3{font-size:16px;margin:0;padding:14px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700}
.cs h3::after{content:"+";margin-left:auto;font-weight:700;color:var(--ink-soft)}
.cs details[open] h3::after{content:"–"}
.cs details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.cs .body{padding:0 14px 14px;font-size:14.5px}
.cs summary{list-style:none}
.cs summary::-webkit-details-marker{display:none}
.cs ul{margin:8px 0;padding-left:18px}
.cs li{margin-bottom:5px}
.cs code{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:6px;font-size:13.5px;font-family:inherit;font-weight:600}
.tip{background:var(--note-bg);color:var(--note);border-radius:10px;padding:9px 11px;font-size:13.5px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--ink-soft);font-size:12px}
.scroll{overflow-x:auto}
footer{color:var(--ink-soft);font-size:12.5px;text-align:center;padding:24px 0 8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

</header>

<main class="wrap" id="main"></main>

<script>
const SESSIONS = [
{
  name:"Sesi 1",
  title:"Perintah, Urutan & Preposisi Waktu",
  desc:"Imperative, Let's, First/Next/Finally, by vs until, in/on/at, modal dasar.",
  items:[
    {q:`Manager: "The fire alarm is ringing!"\nStaff: "___ use the elevator. Take the stairs."`,o:["Don't","Not","Doesn't","No"],a:0,e:"Kalimat perintah larangan (negative imperative) selalu <b>Don't + Verb 1</b>, tanpa subjek. 'Doesn't' hanya untuk kalimat berita orang ketiga."},
    {q:`Team leader: "The deadline is tomorrow."\nMember: "___ finish it tonight then."`,o:["Let's","We","Please to","Lets us"],a:0,e:"<b>Let's</b> = let us, untuk mengajak melakukan sesuatu bersama. Rumus: Let's + Verb 1."},
    {q:`IT Support: "___, turn on the computer. ___, enter your password."`,o:["First / Next","Finally / First","Next / First","After that / First"],a:0,e:"Urutan instruksi: <b>First → Next / Then / After that → Finally</b>. 'First' selalu di langkah pertama."},
    {q:`Manager: "Please submit the proposal ___ Friday at the latest."`,o:["until","by","in","since"],a:1,e:"<b>by</b> = paling lambat / batas akhir suatu aksi sekali jadi. 'Until' dipakai untuk aksi yang berlangsung terus sampai waktu itu."},
    {q:`Notice: "The office will be closed ___ next Monday."`,o:["by","until","in","at"],a:1,e:"Kantor tutup terus-menerus sampai Senin depan → aksi berdurasi → <b>until</b>."},
    {q:`"The meeting starts ___ 8 AM ___ Monday."`,o:["on / at","at / on","in / on","at / in"],a:1,e:"<b>at</b> untuk jam, <b>on</b> untuk hari/tanggal, <b>in</b> untuk bulan/tahun."},
    {q:`"We will launch the new product ___ March."`,o:["on","at","in","by"],a:2,e:"Bulan, tahun, dan musim memakai <b>in</b>: in March, in 2026, in the morning."},
    {q:`Staff: "I have a terrible toothache."\nColleague: "You ___ see a dentist."`,o:["should","shouldn't","must not","don't have to"],a:0,e:"<b>should</b> = saran / nasihat yang baik dilakukan."},
    {q:`Security: "Visitors ___ enter the server room. It is restricted."`,o:["don't have to","mustn't","needn't","may"],a:1,e:"<b>mustn't</b> = larangan keras (dilarang). 'Don't have to' justru berarti tidak wajib."},
    {q:`Manager: "The system is automatic now. You ___ input the data manually."`,o:["mustn't","don't have to","shouldn't","can't"],a:1,e:"Bukan dilarang, tapi <b>tidak perlu / tidak wajib</b> → don't have to (= needn't)."},
    {q:`"All employees ___ wear an ID card. It is a company regulation."`,o:["might","have to","could","don't need to"],a:1,e:"Kewajiban dari aturan luar (perusahaan/hukum) → <b>have to</b>."},
    {q:`"You ___ to check the email before sending it."`,o:["should","must","ought","had"],a:2,e:"Hanya <b>ought</b> yang diikuti <b>to</b>: ought to + Verb 1. Should/must langsung Verb 1."},
    {q:`"It is raining heavily. You ___ take an umbrella."`,o:["should","mustn't","don't have to","aren't"],a:0,e:"Saran ringan untuk kebaikan lawan bicara → <b>should</b>."},
    {q:`Project Manager: "We are two weeks late." It means the project is ___.`,o:["ahead of schedule","behind schedule","on time","right on track"],a:1,e:"<b>behind schedule</b> = terlambat dari jadwal; ahead of schedule = lebih cepat."},
    {q:`"The payment was due last week and it is still unpaid. It is ___."`,o:["overdue","ahead of time","on schedule","upcoming"],a:0,e:"<b>overdue</b> = sudah lewat jatuh tempo dan belum dibayar/diselesaikan."},
    {q:`"The team finished three days earlier than planned. They are ___."`,o:["behind schedule","running late","ahead of schedule","overdue"],a:2,e:"Selesai lebih cepat dari rencana → <b>ahead of schedule</b>."},
    {q:`Receptionist: "Please wait here ___ the manager comes."`,o:["by","until","on","since"],a:1,e:"Menunggu berlangsung terus sampai manajer datang → <b>until</b>."},
    {q:`"___ close the door quietly." (permintaan sopan)`,o:["You","Please","Do you","Let"],a:1,e:"<b>Please + Verb 1</b> membuat perintah menjadi permintaan sopan."},
    {q:`"Don't forget ___ the light when you leave."`,o:["turn off","to turn off","turning","turned"],a:1,e:"Setelah <b>forget</b> yang bermakna tugas ke depan, dipakai <b>to + Verb 1</b>."},
    {q:`Manakah kalimat larangan (negative imperative) yang benar?`,o:["Don't to touch the wires.","Not touch the wires.","Don't touch the wires.","Doesn't touch the wires."],a:2,e:"Rumus tetap: <b>Don't + Verb 1</b>, tanpa 'to', tanpa subjek, tanpa -s."}
  ]
},
{
  name:"Sesi 2",
  title:"Past Simple: Rumus, Ejaan -ed & Pelafalan",
  desc:"Kalimat positif, negatif, tanya, ejaan -ed, dan bunyi /t/ /d/ /ɪd/.",
  items:[
    {q:`Colleague A: "Where is Mr. Doni?"\nColleague B: "He ___ to Bandung yesterday for a meeting."`,o:["go","went","gone","going"],a:1,e:"Kata waktu <b>yesterday</b> → Past Simple → Verb 2 dari go = <b>went</b>."},
    {q:`Supervisor: "Why didn't you reply?"\nStaff: "I didn't ___ the email yesterday."`,o:["received","receive","receives","receiving"],a:1,e:"Setelah <b>didn't</b> selalu Verb 1 (base verb), karena 'did' sudah menandai lampau."},
    {q:`"___ you finish the report yesterday?"`,o:["Do","Did","Does","Are"],a:1,e:"Pertanyaan Past Simple: <b>Did + subjek + Verb 1</b>."},
    {q:`Colleague A: "What ___ you ___ last night?"\nColleague B: "I wrote the weekly report."`,o:["do / did","did / did","did / do","do / do"],a:2,e:"Yang berubah ke bentuk lampau hanya auxiliary-nya: <b>did + do (Verb 1)</b>."},
    {q:`"She ___ the file to my desk an hour ago."`,o:["copy","copied","copyed","copys"],a:1,e:"Konsonan + y → y berubah jadi i lalu +ed: copy → <b>copied</b>, study → studied."},
    {q:`"We ___ the meeting because the client cancelled."`,o:["stoped","stopped","stopt","stopping"],a:1,e:"Satu suku kata berpola konsonan-vokal-konsonan → konsonan akhir digandakan: stop → <b>stopped</b>."},
    {q:`"They ___ the annual event last year."`,o:["plan","planed","planned","planing"],a:2,e:"Sama seperti stop: plan → <b>planned</b> (n digandakan)."},
    {q:`"He ___ very hard for the certification exam."`,o:["studyed","studied","studed","studyd"],a:1,e:"study → <b>studied</b>. Bandingkan play → played (karena sebelum y ada vokal)."},
    {q:`Manakah kalimat yang benar secara gramatikal?`,o:["Where did you went?","When did the CEO arrive?","What did he said?","Why you called me?"],a:1,e:"Setelah <b>did</b> harus Verb 1: arrive, bukan arrived/went/said."},
    {q:`Rumus kalimat negatif Past Simple yang benar adalah ___.`,o:["Subject + didn't + Verb 2","Subject + didn't + Verb-ing","Subject + didn't + Verb 1","Subject + wasn't + Verb 2"],a:2,e:"<b>S + didn't + Verb 1</b>. 'Wasn't' hanya dipakai jika tidak ada kata kerja aksi (to be)."},
    {q:`Colleague B: "Because our finance team ___ the payment invoice."`,o:["didn't paid","didn't pay","didn't paying","don't paid"],a:1,e:"didn't + Verb 1 → <b>didn't pay</b>."},
    {q:`Kalimat mana yang memuat bentuk lampau yang SALAH?`,o:["She brought the documents.","He teached the new staff.","They built a new warehouse.","We sent the package."],a:1,e:"teach adalah irregular verb: teach – <b>taught</b> – taught, bukan 'teached'."},
    {q:`Regular verb mana yang berakhir dengan bunyi /t/?`,o:["Played","Watched","Opened","Cleaned"],a:1,e:"Setelah bunyi tak bersuara (/k/, /p/, /s/, /ʃ/, /tʃ/, /f/) -ed dibaca <b>/t/</b>: watched = /wɒtʃt/."},
    {q:`Regular verb mana yang berakhir dengan bunyi /d/?`,o:["Stopped","Washed","Called","Wanted"],a:2,e:"Setelah bunyi bersuara (vokal, /l/, /n/, /m/, /b/, /g/, /v/) -ed dibaca <b>/d/</b>: called = /kɔːld/."},
    {q:`Kata mana yang bertambah satu suku kata (/ɪd/)?`,o:["Finished","Started","Moved","Helped"],a:1,e:"Hanya verba yang berakhir huruf <b>-t</b> atau <b>-d</b> yang dibaca /ɪd/: start → started."},
    {q:`Kata mana yang TIDAK berakhir dengan bunyi /ɪd/?`,o:["Needed","Decided","Visited","Fixed"],a:3,e:"fixed berakhir /ks/ → dibaca <b>/t/</b>. Yang lain berakhir -d/-t sehingga /ɪd/."},
    {q:`"Last month, our team ___ a new system and ___ all staff."`,o:["install / train","installed / trained","installed / train","installs / trained"],a:1,e:"Dua kata kerja sejajar dalam kalimat lampau, keduanya harus Verb 2."},
    {q:`"The client ___ at 9 AM and ___ until noon."`,o:["arrive / stay","arrived / stayed","arrived / staied","arrivd / stayed"],a:1,e:"Vokal + y tetap +ed: stay → <b>stayed</b> (bukan staied)."},
    {q:`Manager: "___ did you meet at the hotel lobby?"\nStaff: "I met our new investor."`,o:["When","Where","Who","What"],a:2,e:"Jawabannya orang → kata tanya <b>Who</b>."},
    {q:`Admin: "___ did the training end?"\nStaff: "It ended at 4 PM."`,o:["When","Where","Who","Why"],a:0,e:"Jawabannya waktu → <b>When</b>."}
  ]
},
{
  name:"Sesi 3",
  title:"Irregular Verbs & lay / lie",
  desc:"Bentuk V1–V2–V3 yang tidak beraturan, plus jebakan lay, laid, lain, lied.",
  items:[
    {q:`"The boat started taking in water and ___ to the bottom."`,o:["sinked","sank","sunk","sinks"],a:1,e:"sink – <b>sank</b> – sunk. 'Sunk' adalah V3, dipakai setelah have/was."},
    {q:`"The wind ___ the documents away."`,o:["blowed","blew","blown","blows"],a:1,e:"blow – <b>blew</b> – blown."},
    {q:`"He ___ his job last month because the salary was too low."`,o:["quited","quitted","quit","quiting"],a:2,e:"quit – <b>quit</b> – quit (bentuknya tidak berubah), seperti cut, put, shut, cost, hit."},
    {q:`"The strong waves ___ the metal frame of the boat severely."`,o:["bended","bent","binded","bend"],a:1,e:"bend – <b>bent</b> – bent."},
    {q:`"I ___ the report on your desk this morning." (meletakkan sesuatu)`,o:["lay","laid","lied","layed"],a:1,e:"lay (meletakkan objek) – <b>laid</b> – laid. Bentuk 'layed' tidak ada dalam bahasa Inggris baku."},
    {q:`"I felt sick, so I ___ down on the sofa for an hour." (berbaring)`,o:["laid","lay","lied","lain"],a:1,e:"lie (berbaring) – <b>lay</b> – lain. Jebakan klasik: V2 dari lie justru 'lay'."},
    {q:`"He ___ about his previous experience during the interview." (berbohong)`,o:["lay","laid","lied","lain"],a:2,e:"lie (berbohong) itu regular: lie – <b>lied</b> – lied."},
    {q:`Kalimat mana yang bentuk lampaunya SALAH?`,o:["He thinked about the offer.","She caught the early train.","They chose the cheapest vendor.","We paid the bill yesterday."],a:0,e:"think – <b>thought</b> – thought."},
    {q:`"The manager ___ us a bonus last December."`,o:["gived","gave","given","give"],a:1,e:"give – <b>gave</b> – given."},
    {q:`"She ___ the presentation slides last night."`,o:["maked","made","maden","make"],a:1,e:"make – <b>made</b> – made."},
    {q:`"The company ___ a new warehouse in 2019."`,o:["builded","built","build","building"],a:1,e:"build – <b>built</b> – built."},
    {q:`"I ___ him at the annual conference last year."`,o:["meeted","met","meet","meated"],a:1,e:"meet – <b>met</b> – met."},
    {q:`"The courier ___ the package to the office yesterday."`,o:["bringed","brought","broughted","bring"],a:1,e:"bring – <b>brought</b> – brought."},
    {q:`"We ___ the operational budget by 10% last quarter."`,o:["cutted","cut","cuted","cutting"],a:1,e:"cut – <b>cut</b> – cut, bentuknya sama di ketiga kolom."},
    {q:`"He ___ the server room door and went home."`,o:["shutted","shut","shuted","shutting"],a:1,e:"shut – <b>shut</b> – shut."},
    {q:`"She ___ a day off yesterday because she was sick."`,o:["taked","took","taken","take"],a:1,e:"take – <b>took</b> – taken."},
    {q:`"The price of raw materials ___ sharply last month." (naik sendiri)`,o:["rised","rose","risen","raised"],a:1,e:"rise (naik, tanpa objek) – <b>rose</b> – risen."},
    {q:`"He ___ his hand to ask a question." (mengangkat sesuatu)`,o:["rose","raised","risen","rised"],a:1,e:"raise (menaikkan sesuatu, ada objek) itu regular: raise – <b>raised</b> – raised."},
    {q:`Bentuk V1 – V2 – V3 dari "choose" yang benar adalah ___.`,o:["choose – chose – chosen","choose – choosed – chosen","choose – chose – chose","choose – chosen – chose"],a:0,e:"choose – <b>chose</b> – chosen."},
    {q:`Bentuk V1 – V2 – V3 dari "write" yang benar adalah ___.`,o:["write – wrote – writen","write – writed – written","write – wrote – written","write – written – wrote"],a:2,e:"write – <b>wrote</b> – written (dobel t)."}
  ]
},
{
  name:"Sesi 4",
  title:"Recount Text & Bahasa Email Kantor",
  desc:"Orientation, Series of Events, Re-orientation, plus frasa email profesional.",
  items:[
    {q:`Apa fungsi utama paragraf "Orientation" dalam Recount Text?`,o:["Menyusun kejadian secara kronologis dengan First, Next.","Memberi komentar atau perasaan pribadi tentang keseluruhan acara.","Mengeluhkan masalah yang terjadi saat kunjungan.","Menjelaskan latar belakang: siapa, kapan, dan di mana cerita dimulai."],a:3,e:"Orientation = pembuka yang memuat <b>Who, When, Where</b> (dan kadang Why)."},
    {q:`"Finally, we paid the vendor and returned to the office. Overall, the trip was very successful."\nBagian ini termasuk ___.`,o:["Orientation","Series of Events","Re-orientation","Introduction"],a:2,e:"Adanya kesimpulan/komentar pribadi ('Overall, ... successful') menandai <b>Re-orientation</b>."},
    {q:`Kalimat mana yang paling cocok sebagai Orientation?`,o:["Then we inspected the machine one by one.","Last Monday, our team visited the factory in Cikarang.","Overall, it was a tiring but useful day.","Finally, we returned to the head office."],a:1,e:"Memuat kapan (Last Monday), siapa (our team), di mana (Cikarang) → <b>Orientation</b>."},
    {q:`Tense utama yang dipakai dalam Recount Text adalah ___.`,o:["Simple Present","Past Simple","Present Perfect","Future"],a:1,e:"Recount menceritakan kejadian yang sudah lewat → <b>Past Simple</b>."},
    {q:`"___ we checked the machine. ___, we replaced the broken part."`,o:["Finally / First","First / After that","Next / First","Overall / Then"],a:1,e:"Urutan logis: First → After that/Then/Next → Finally."},
    {q:`"___, I would like to say that the site visit was very useful."`,o:["First","Overall","Next","After that"],a:1,e:"<b>Overall</b> menandai kesimpulan menyeluruh, khas kalimat Re-orientation."},
    {q:`Urutan struktur Recount Text yang benar adalah ___.`,o:["Orientation – Series of Events – Re-orientation","Series of Events – Orientation – Re-orientation","Orientation – Re-orientation – Series of Events","Thesis – Arguments – Conclusion"],a:0,e:"Tiga bagian berurutan: pembuka, rangkaian kejadian, penutup."},
    {q:`Bagian mana yang BUKAN termasuk struktur Recount Text?`,o:["Orientation","Thesis and Arguments","Series of Events","Re-orientation"],a:1,e:"Thesis and Arguments adalah struktur <b>Analytical Exposition</b>, bukan Recount."},
    {q:`Kalimat mana yang termasuk Series of Events?`,o:["Last week, I went to Surabaya with my supervisor.","After that, we met the client and discussed the contract.","In short, the meeting was worth the long trip.","It was a very memorable experience for me."],a:1,e:"Kejadian berurutan dengan konektor waktu → <b>Series of Events</b>."},
    {q:`"We are ___ schedule; the project will finish next week instead of this week."`,o:["ahead of","behind","on","in"],a:1,e:"Mundur dari rencana → <b>behind schedule</b>."},
    {q:`Pembuka email formal yang paling tepat kepada klien baru adalah ___.`,o:["Hi bro,","Dear Mr. Hasan,","Hello there!","Yo, Hasan!"],a:1,e:"Email profesional memakai <b>Dear + gelar + nama belakang</b>."},
    {q:`"I am writing to ___ about the delay of our order."`,o:["inquire","inquiry","inquiring","inquired"],a:0,e:"Setelah <b>to</b> (to-infinitive) dipakai Verb 1: to inquire. 'Inquiry' adalah kata benda."},
    {q:`"Please find ___ the invoice for last month."`,o:["attach","attached","attaching","attachment"],a:1,e:"Frasa baku email: <b>Please find attached ...</b>"},
    {q:`"We apologize ___ the inconvenience."`,o:["of","for","with","to"],a:1,e:"Pola baku: apologize <b>for</b> + hal yang disesali (apologize to + orang)."},
    {q:`"Thank you for your ___ to this matter."`,o:["attend","attention","attentive","attending"],a:1,e:"Setelah 'your' dipakai kata benda: <b>attention</b>."},
    {q:`"I look forward to ___ from you soon."`,o:["hear","hearing","heard","be hear"],a:1,e:"Di sini 'to' adalah preposisi, jadi diikuti <b>V-ing</b>: look forward to hearing."},
    {q:`"The meeting was postponed ___ next week."`,o:["until","by","in","at"],a:0,e:"Ditunda sampai minggu depan → <b>until</b>."},
    {q:`"Kindly confirm your attendance ___ Thursday."`,o:["until","by","in","since"],a:1,e:"Batas akhir konfirmasi → <b>by</b> Thursday."},
    {q:`Penutup email formal yang tepat adalah ___.`,o:["See ya,","Best regards,","Thx,","Later,"],a:1,e:"<b>Best regards / Sincerely / Kind regards</b> adalah penutup baku email bisnis."},
    {q:`"Could you please ___ me the updated file?"`,o:["sent","send","sending","to send"],a:1,e:"Setelah modal <b>could</b> selalu Verb 1: could you send."}
  ]
},
{
  name:"Sesi 5",
  title:"Simulasi Campuran",
  desc:"Semua materi diacak, plus satu soal modul My Chemical Romance.",
  items:[
    {q:`Menurut modul, lagu My Chemical Romance yang ditulis Gerard Way sebagai respons langsung terhadap tragedi 11 September 2001 adalah ___.`,o:["Helena","Skylines and Turnstiles","Teenagers","Famous Last Words"],a:1,e:"Gerard Way menyaksikan serangan 9/11 dan menulis <b>Skylines and Turnstiles</b>, lagu pertama MCR; band ini terbentuk tahun 2001 di New Jersey sebagai respons psikologis atas tragedi tersebut."},
    {q:`"You ___ to submit the form before 5 PM."`,o:["should","must","ought","have"],a:2,e:"Hanya <b>ought</b> yang butuh 'to'. (Catatan: 'have to' juga benar secara makna, tapi polanya have to + V1, bukan 'have to to'.)"},
    {q:`"___ panic. Everything is under control."`,o:["Don't","Not","No","Doesn't"],a:0,e:"Larangan langsung → <b>Don't + Verb 1</b>."},
    {q:`"Let's ___ a short break before the next session."`,o:["taking","take","took","to take"],a:1,e:"Let's + <b>Verb 1</b>."},
    {q:`"She didn't ___ the meeting notes to the team."`,o:["sent","send","sending","sends"],a:1,e:"didn't + Verb 1 → <b>send</b>."},
    {q:`"The technician ___ the printer yesterday afternoon."`,o:["fixed","fixt","fix","fixing"],a:0,e:"fix adalah regular verb → <b>fixed</b> (dibaca /fɪkst/)."},
    {q:`Kata "fixed" berakhir dengan bunyi ___.`,o:["/d/","/t/","/ɪd/","/s/"],a:1,e:"Berakhir bunyi tak bersuara /ks/ → -ed dibaca <b>/t/</b>."},
    {q:`Kata "needed" berakhir dengan bunyi ___.`,o:["/t/","/d/","/ɪd/","/n/"],a:2,e:"Berakhir huruf -d → -ed dibaca <b>/ɪd/</b> dan menambah satu suku kata."},
    {q:`"Where ___ the CEO ___ last night?"`,o:["did / stay","did / stayed","does / stayed","do / stay"],a:0,e:"did + Verb 1 → <b>did the CEO stay</b>."},
    {q:`"We ___ the project ahead of schedule, so the client was very happy."`,o:["finish","finished","finishing","finishes"],a:1,e:"Ditandai 'was' (lampau) → verba lain juga lampau: <b>finished</b>."},
    {q:`"Warehouse staff ___ wear safety shoes. It is mandatory."`,o:["might","have to","don't have to","could"],a:1,e:"Kewajiban dari peraturan → <b>have to</b>."},
    {q:`Manager: "The deadline was extended, so you ___ work this weekend."`,o:["mustn't","don't have to","shouldn't","can't"],a:1,e:"Tidak wajib (bukan dilarang) → <b>don't have to</b>."},
    {q:`"The old ship ___ near the harbour ten years ago."`,o:["sinked","sank","sunk","sinking"],a:1,e:"sink – <b>sank</b> – sunk."},
    {q:`"He was exhausted, so he ___ down for twenty minutes."`,o:["laid","lay","lied","lain"],a:1,e:"lie (berbaring) – <b>lay</b> – lain."},
    {q:`"I ___ the documents on the table an hour ago."`,o:["lay","laid","lied","layed"],a:1,e:"lay (meletakkan) – <b>laid</b> – laid."},
    {q:`Kalimat mana yang bentuk lampaunya SALAH?`,o:["She writed the minutes of meeting.","He spoke to the supervisor.","They sold the old printers.","We kept the receipts."],a:0,e:"write – <b>wrote</b> – written, bukan 'writed'."},
    {q:`Manager: "___ did the client arrive?"\nAdmin: "He arrived at 9 AM exactly."`,o:["When","Where","Who","Why"],a:0,e:"Jawabannya jam → <b>When</b>."},
    {q:`Manakah pertanyaan yang benar?`,o:["Did you saw the email?","Did you see the email?","Do you saw the email?","Did you seen the email?"],a:1,e:"Did + subjek + <b>Verb 1</b>."},
    {q:`"In short, the visit gave us many new ideas for next year."\nKalimat ini termasuk bagian ___.`,o:["Orientation","Series of Events","Re-orientation","Description"],a:2,e:"Kesimpulan dan kesan akhir → <b>Re-orientation</b>."},
    {q:`"The training session will last ___ 4 PM."`,o:["by","until","in","on"],a:1,e:"Berlangsung terus sampai pukul 4 → <b>until</b>."}
  ]
},
{
  name:"Sesi 6",
  title:"Modal & Preposisi Waktu: Drill Lanjutan",
  desc:"Latihan tambahan untuk dua materi yang paling sering menjebak.",
  items:[
    {q:`"You ___ park here. It is a fire exit."`,o:["don't have to","mustn't","needn't","may not"],a:1,e:"Larangan keras demi keselamatan → <b>mustn't</b>."},
    {q:`"The extra report is optional. You ___ finish it today."`,o:["mustn't","don't have to","shouldn't","can't"],a:1,e:"Optional = tidak wajib → <b>don't have to</b>."},
    {q:`"Employees ___ log in with their own account. It is the IT policy."`,o:["have to","might","could","don't need to"],a:0,e:"Aturan dari perusahaan → <b>have to</b>."},
    {q:`"You look exhausted. You ___ take a short rest."`,o:["should","mustn't","don't have to","shouldn't"],a:0,e:"Saran → <b>should</b>."},
    {q:`"That email looks suspicious. You ___ click the link."`,o:["should","shouldn't","have to","don't have to"],a:1,e:"Saran negatif (sebaiknya jangan) → <b>shouldn't</b>."},
    {q:`"Drivers ___ have a valid license. It is the law."`,o:["must","might","should","may"],a:0,e:"Kewajiban hukum → <b>must</b> (atau have to)."},
    {q:`"We ___ to inform the client before changing the schedule."`,o:["should","must","ought","can"],a:2,e:"Hanya <b>ought</b> yang diikuti to."},
    {q:`"Last year we ___ to work on Saturday, but now we don't."`,o:["must","had","should","mustn't"],a:1,e:"Bentuk lampau dari have to adalah <b>had to</b>. Modal 'must' tidak punya bentuk lampau."},
    {q:`"___ I use your printer for a moment?"`,o:["May","Must","Ought","Do"],a:0,e:"<b>May / Could / Can</b> untuk meminta izin secara sopan."},
    {q:`"Please send the draft ___ Wednesday morning."`,o:["until","by","since","for"],a:1,e:"Batas akhir pengiriman → <b>by</b>."},
    {q:`"She worked ___ 7 PM last night."`,o:["by","until","in","on"],a:1,e:"Bekerja terus sampai jam 7 → <b>until</b>."},
    {q:`"The workshop runs ___ 10 AM ___ 12 PM."`,o:["from / to","at / until","in / on","by / to"],a:0,e:"Rentang waktu dengan titik awal dan akhir → <b>from ... to ...</b>."},
    {q:`"The contract was signed ___ 12 May 2025."`,o:["in","at","on","by"],a:2,e:"Tanggal spesifik → <b>on</b>."},
    {q:`"I will finish the audit ___ two weeks."`,o:["on","in","at","until"],a:1,e:"<b>in + durasi</b> = dalam waktu sekian lama ke depan."},
    {q:`"He has worked in this company ___ 2019."`,o:["for","since","by","until"],a:1,e:"<b>since</b> + titik waktu mulai; <b>for</b> + lama waktu."},
    {q:`"We waited in the lobby ___ two hours."`,o:["since","for","until","by"],a:1,e:"<b>for</b> + durasi: for two hours."},
    {q:`"___ you leave the room, turn off the machine."`,o:["Before","Until","By","Since"],a:0,e:"<b>Before</b> menandai urutan aksi: matikan mesin sebelum keluar."},
    {q:`"The delivery is ___; it should have arrived last Monday."`,o:["ahead of time","overdue","on schedule","due"],a:1,e:"Sudah lewat waktu dan belum datang → <b>overdue</b>."},
    {q:`"Everything is ___ schedule. We will launch as planned."`,o:["behind","on","out of","off"],a:1,e:"<b>on schedule</b> = sesuai jadwal."},
    {q:`"We need to ___ the deadline because of the power outage."`,o:["extend","extent","expand","expend"],a:0,e:"<b>extend</b> = memperpanjang waktu. 'Extent' kata benda, 'expand' = memperluas ukuran."}
  ]
},
{
  name:"Sesi 7",
  title:"Past Simple Lanjutan & Kalimat Tanya",
  desc:"To be lampau, pertanyaan WH, dan kalimat negatif yang sering tertukar.",
  items:[
    {q:`"They ___ the new branch office last Friday."`,o:["open","opened","opens","opening"],a:1,e:"Ada 'last Friday' → Past Simple → <b>opened</b>."},
    {q:`"I ___ not able to join the call yesterday."`,o:["am","was","were","is"],a:1,e:"Subjek I → to be lampau <b>was</b>."},
    {q:`"The files ___ deleted by mistake last night."`,o:["was","were","are","is"],a:1,e:"Subjek jamak (files) → <b>were</b>."},
    {q:`"___ the vendor deliver the goods on time?"`,o:["Was","Did","Does","Is"],a:1,e:"Ada kata kerja aksi (deliver) → pakai <b>Did</b>, bukan was."},
    {q:`"How many staff ___ attend the training yesterday?"`,o:["did","do","does","were"],a:0,e:"<b>did + Verb 1</b> untuk pertanyaan lampau."},
    {q:`"Why ___ the system crash last night?"`,o:["does","did","was","do"],a:1,e:"Kata kerja aksi + lampau → <b>did</b>."},
    {q:`"How ___ you solve the problem so quickly?"`,o:["did","do","were","was"],a:0,e:"WH + <b>did</b> + subjek + Verb 1."},
    {q:`"He didn't ___ any answer from the supplier."`,o:["got","get","gets","getting"],a:1,e:"didn't + Verb 1 → <b>get</b>."},
    {q:`Manakah kalimat negatif yang benar?`,o:["She did not attended the meeting.","She did not attend the meeting.","She not attended the meeting.","She didn't attending the meeting."],a:1,e:"did not + <b>Verb 1</b>."},
    {q:`"We ___ very busy last week, so we ___ the deadline."`,o:["were / missed","was / missed","were / miss","are / missed"],a:0,e:"Subjek we → were; kata kerja kedua juga lampau → missed."},
    {q:`"The manager ___ angry when he ___ the mistake."`,o:["was / saw","were / saw","was / seen","is / saw"],a:0,e:"was (to be lampau) + saw (V2 dari see). 'Seen' adalah V3."},
    {q:`"___ there any problem during the installation?"`,o:["Was","Did","Do","Is"],a:0,e:"Tidak ada kata kerja aksi, hanya 'there is/are' → bentuk lampaunya <b>Was there ...?</b>"},
    {q:`"I ___ my laptop at the office yesterday."`,o:["leaved","left","leave","lefted"],a:1,e:"leave – <b>left</b> – left."},
    {q:`"She ___ the email at 8 and ___ a reply at 9."`,o:["send / receive","sent / received","sent / receive","sended / received"],a:1,e:"Dua aksi lampau berurutan, keduanya V2: sent, received."},
    {q:`"___ you ___ the invoice to the vendor last week?"`,o:["Did / send","Did / sent","Do / sent","Did / sending"],a:0,e:"Did + subjek + <b>Verb 1</b>."},
    {q:`"He was late because he ___ the bus."`,o:["miss","missed","misses","missing"],a:1,e:"Kalimat lampau → <b>missed</b> (regular verb)."},
    {q:`Manakah pertanyaan WH yang benar?`,o:["What time did the meeting start?","What time the meeting started?","What time did the meeting started?","What time does the meeting start yesterday?"],a:0,e:"Polanya WH + did + subjek + Verb 1."},
    {q:`"Our team ___ the sales target last quarter."`,o:["achieveed","achieved","achievd","achieve"],a:1,e:"Kata berakhir -e cukup ditambah <b>-d</b>: achieve → achieved."},
    {q:`"The technician ___ the cable because it was damaged."`,o:["replaceed","replaced","replaceid","replace"],a:1,e:"replace → <b>replaced</b> (berakhir -e, tambah -d saja)."},
    {q:`"The company ___ 20 new employees last year."`,o:["hireed","hired","hirred","hire"],a:1,e:"hire → <b>hired</b>."}
  ]
},

    {q:`Bentuk V1 – V2 – V3 dari "take" adalah ___.`,o:["take – took – taken","take – taked – taken","take – took – took","take – taken – took"],a:0,e:"take – took – taken."},
    {q:`Bentuk V1 – V2 – V3 dari "begin" adalah ___.`,o:["begin – begun – began","begin – began – begun","begin – beginned – begun","begin – began – began"],a:1,e:"Polanya i–a–u, sama seperti sing–sang–sung dan drink–drank–drunk."},
    {q:`Kalimat mana yang bentuk lampaunya SALAH?`,o:["He catched the error early.","She brought the samples.","They left before noon.","We bought new monitors."],a:0,e:"catch – <b>caught</b> – caught."},
    {q:`Kata mana yang berakhir dengan bunyi /ɪd/?`,o:["Worked","Completed","Called","Closed"],a:1,e:"complete berakhir huruf -t → -ed dibaca <b>/ɪd/</b>."},
    {q:`Kata mana yang berakhir dengan bunyi /t/?`,o:["Developed","Arrived","Managed","Delivered"],a:0,e:"develop berakhir bunyi /p/ (tak bersuara) → <b>/t/</b>."},

{t:"Imperative & ajakan", h:`
<ul>
<li>Perintah: <code>Verb 1 + ...</code> → <i>Open the file.</i></li>
<li>Larangan: <code>Don't + Verb 1</code> → <i>Don't touch it.</i></li>
<li>Sopan: <code>Please + Verb 1</code> / <i>Could you please send it?</i></li>
<li>Ajakan: <code>Let's + Verb 1</code> (= let us) → <i>Let's start.</i></li>
</ul>

<ul>
<li>Awal: <code>First</code>, First of all, To begin with</li>

<li>Akhir: <code>Finally</code>, Lastly, In the end</li>

</ul>`},

{t:"Preposisi waktu: by vs until", h:`
<table>
<tr><th>Kata</th><th>Makna</th><th>Contoh</th></tr>
<tr><td><b>by</b></td><td>paling lambat, aksi sekali jadi</td><td>Send it by 4 PM.</td></tr>
<tr><td><b>until</b></td><td>berlangsung terus sampai</td><td>The meeting lasts until 11 AM.</td></tr>
<tr><td><b>at</b></td><td>jam</td><td>at 8 AM, at noon</td></tr>

{t:"Modal verbs", h:`
<table>
<tr><th>Modal</th><th>Arti</th><th>Contoh</th></tr>
<tr><td>must / have to</td><td>wajib</td><td>You must wear an ID card.</td></tr>
<tr><td><b>mustn't</b></td><td>dilarang keras</td><td>You mustn't smoke here.</td></tr>
<tr><td><b>don't have to</b></td><td>tidak wajib (boleh tidak)</td><td>You don't have to come.</td></tr>
<tr><td>should / ought to</td><td>saran</td><td>You should rest.</td></tr>
<tr><td>shouldn't</td><td>sebaiknya jangan</td><td>You shouldn't skip it.</td></tr>
</table>
<ul>
<li>Semua modal diikuti <code>Verb 1</code>, tanpa to — <b>kecuali ought to dan have to</b>.</li>
<li><b>must</b> = aturan dari diri sendiri/pembicara; <b>have to</b> = aturan dari luar (kantor, hukum).</li>
</ul>
<div class="tip">Jebakan paling sering: mustn't (dilarang) ≠ don't have to (tidak perlu).</div>`},

{t:"Past Simple: tiga rumus", h:`
<ul>
<li>(+) <code>S + Verb 2</code> → She sent the report.</li>
<li>(–) <code>S + didn't + Verb 1</code> → She didn't send the report.</li>
<li>(?) <code>Did + S + Verb 1</code> → Did she send the report?</li>
<li>WH: <code>WH + did + S + Verb 1</code> → What did you do yesterday?</li>
</ul>
<div class="tip">Kalau sudah ada <b>did / didn't</b>, kata kerjanya kembali ke Verb 1. Ini soal yang paling sering muncul.</div>

const LET = ["A","B","C","D","E"];
const state = SESSIONS.map(s => ({answered:0, correct:0, picks:new Array(s.items.length).fill(null)}));
let view = 0;

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');

SESSIONS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.textContent=s.name; b.onclick=()=>go(i);
  tabsEl.appendChild(b);
});
const cb=document.createElement('button');
cb.textContent="Cheatsheet"; cb.onclick=()=>go('cs');
tabsEl.appendChild(cb);

function go(v){
  view=v;
  [...tabsEl.children].forEach((b,i)=>{
    const id = i<SESSIONS.length ? i : 'cs';
    b.setAttribute('aria-selected', id===v ? 'true':'false');
  });
  render();
  window.scrollTo({top:0});
}

function render(){
  if(view==='cs'){ renderCheat(); return; }
  const s=SESSIONS[view], st=state[view];
  mainEl.innerHTML='';
  const intro=document.createElement('div');
  intro.className='intro';
  intro.innerHTML=`<h2>${s.title}</h2><p>${s.desc}</p>`;
  mainEl.appendChild(intro);

  const bar=document.createElement('div');
  bar.className='scorebar';
  bar.innerHTML=`<b id="sc"></b><div class="track"><div class="fill" id="fl"></div></div><span id="pc"></span>`;
  mainEl.appendChild(bar);

  s.items.forEach((it,qi)=>{
    const card=document.createElement('div');
    card.className='q';
    const num=document.createElement('div');
    num.className='num'; num.textContent=`Soal ${qi+1} dari ${s.items.length}`;
    const txt=document.createElement('div');
    txt.className='txt'; txt.textContent=it.q;
    card.appendChild(num); card.appendChild(txt);

    const exp=document.createElement('div');
    exp.className='exp';

    it.o.forEach((op,oi)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.innerHTML=`<span class="k">${LET[oi]}</span><span>${op}</span>`;
      b.onclick=()=>pick(card,exp,qi,oi,it);
      card.appendChild(b);
    });
    card.appendChild(exp);
    mainEl.appendChild(card);

    if(st.picks[qi]!==null) replay(card,exp,qi,it);
  });

  const done=document.createElement('div');
  done.className='done'; done.id='done';
  mainEl.appendChild(done);

  const act=document.createElement('div');
  act.className='actions';
  act.innerHTML=`<button id="reset">Ulangi sesi</button><button class="main" id="next">${view<SESSIONS.length-1?'Sesi berikutnya':'Buka cheatsheet'}</button>`;
  mainEl.appendChild(act);
  document.getElementById('reset').onclick=()=>{ state[view]={answered:0,correct:0,picks:new Array(s.items.length).fill(null)}; render(); window.scrollTo({top:0}); };
  document.getElementById('next').onclick=()=> go(view<SESSIONS.length-1?view+1:'cs');

  updateBar();
}

function pick(card,exp,qi,oi,it){
  const st=state[view];
  if(st.picks[qi]!==null) return;
  st.picks[qi]=oi; st.answered++;
  if(oi===it.a) st.correct++;
  paint(card,exp,qi,oi,it);
  updateBar();
}

function replay(card,exp,qi,it){ paint(card,exp,qi,state[view].picks[qi],it); }

function paint(card,exp,qi,oi,it){
  const btns=[...card.querySelectorAll('.opt')];
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===it.a) b.classList.add(i===oi?'pick-ok':'show-ok');
    if(i===oi && i!==it.a) b.classList.add('pick-no');
  });
  exp.classList.add('on');
  exp.innerHTML = (oi===it.a ? '<b>Benar.</b> ' : `<b>Kurang tepat.</b> Jawaban: ${LET[it.a]}. `) + it.e;
}

function updateBar(){
  const s=SESSIONS[view], st=state[view];
  const sc=document.getElementById('sc'), fl=document.getElementById('fl'), pc=document.getElementById('pc');
  if(!sc) return;
  sc.textContent=`Benar ${st.correct}/${s.items.length}`;
  pc.textContent=`${st.answered} terjawab`;
  fl.style.width=(st.answered/s.items.length*100)+'%';
  const done=document.getElementById('done');
  if(st.answered===s.items.length){
    const pct=Math.round(st.correct/s.items.length*100);
    let msg = pct>=90?'Siap ujian. Pertahankan.':pct>=75?'Sudah bagus. Tinggal rapikan yang salah di bawah ini.':'Baca dulu review di bawah, lalu buka cheatsheet untuk materi yang paling sering meleset.';
    let html=`<div class="big">${st.correct}/${s.items.length}</div><p style="margin:4px 0 0">${pct}% benar. ${msg}</p>`;

    const wrong=[];
    st.picks.forEach((p,i)=>{ if(p!==null && p!==SESSIONS[view].items[i].a) wrong.push(i); });

    html+=`<div class="rev">`;
    if(wrong.length===0){
      html+=`<h4>Tidak ada kesalahan di sesi ini.</h4><p style="margin:0;font-size:14px">Lanjut ke sesi berikutnya atau ulangi besok pagi sebagai pemanasan.</p>`;
    } else {
      const count={};
      wrong.forEach(i=>{ const t=tagOf(view,i); count[t]=(count[t]||0)+1; });
      const sorted=Object.entries(count).sort((a,b)=>b[1]-a[1]);
      html+=`<h4>Materi yang perlu diulang</h4><div class="chips">`;
      sorted.forEach(([t,n])=>{ html+=`<span class="chip">${t} · ${n} salah</span>`; });
      html+=`</div><h4>Kenapa jawaban kamu salah</h4>`;
      wrong.forEach(i=>{
        const it=SESSIONS[view].items[i];
        html+=`<div class="miss">
          <div class="tag">Soal ${i+1} · ${tagOf(view,i)}</div>
          <div class="qt">${esc(it.q)}</div>
          <div class="row"><span class="lbl">Jawaban kamu:</span> <span class="you">${LET[st.picks[i]]}. ${esc(it.o[st.picks[i]])}</span></div>
          <div class="row"><span class="lbl">Seharusnya:</span> <span class="key">${LET[it.a]}. ${esc(it.o[it.a])}</span></div>
          <div class="why">${it.e}</div>
        </div>`;
      });
    }
    html+=`</div>`;
    done.innerHTML=html;
    done.classList.add('on');

    const act=document.querySelector('.actions');
    if(act && wrong.length && !document.getElementById('retry')){
      act.classList.add('three');
      const b=document.createElement('button');
      b.id='retry'; b.textContent='Ulangi yang salah';
      b.onclick=()=>{
        wrong.forEach(i=>{ st.picks[i]=null; st.answered--; });
        render(); window.scrollTo({top:0});
      };
      act.insertBefore(b, act.children[1]);
    }
  } else done.classList.remove('on');
}

function tagOf(s,i){ return (TAGS[s] && TAGS[s][i]) || SESSIONS[s].name; }
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

function renderCheat(){
  mainEl.innerHTML='';
  const intro=document.createElement('div');
  intro.className='intro';
  intro.innerHTML=`<h2>Cheatsheet</h2><p>Ringkasan semua aturan yang keluar di review. Ketuk judul untuk membuka.</p>`;
  mainEl.appendChild(intro);
  const box=document.createElement('div');
  box.className='cs';
  CHEATS.forEach((c,i)=>{
    const d=document.createElement('details');
    if(i===0) d.open=true;
    d.innerHTML=`<summary><h3>${c.t}</h3></summary><div class="body">${c.h}</div>`;
    box.appendChild(d);
  });
  mainEl.appendChild(box);
  const f=document.createElement('footer');
  f.textContent='Semoga lancar ujiannya besok.';
  mainEl.appendChild(f);
}

document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', isDark?'light':'dark');
};

go(0);
</script>
</body>
</html>
