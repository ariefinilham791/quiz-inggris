<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persiapan Ujian — Business English</title>
<style>
:root{
  --navy:#0f1b33;
  --navy2:#16233f;
  --amber:#e0a63a;
  --amber-soft:#f3d79a;
  --paper:#f6f3ea;
  --ink:#1c2333;
  --muted:#6b7280;
  --green:#2f8f5b;
  --red:#c1473b;
  --card:#ffffff;
  --border:#e4e0d3;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Georgia','Times New Roman',serif;
  background:var(--paper);
  color:var(--ink);
}
header{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff;
  padding:22px 16px 18px;
  text-align:center;
  border-bottom:4px solid var(--amber);
}
header h1{
  margin:0 0 4px;
  font-size:1.5rem;
  letter-spacing:0.5px;
}
header p{
  margin:0;
  font-family:Arial,sans-serif;
  font-size:0.85rem;
  color:var(--amber-soft);
}
nav{
  padding:14px 10px 10px;
  background:var(--navy2);
}
.nav-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}
.nav-row.part-row{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.15);
}
nav button{
  font-family:Arial,sans-serif;
  font-size:0.85rem;
  padding:8px 14px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.25);
  background:transparent;
  color:#fff;
  cursor:pointer;
  transition:all .15s;
}
nav button.active{
  background:var(--amber);
  color:var(--navy);
  border-color:var(--amber);
  font-weight:bold;
}
nav button:hover{ background:rgba(224,166,58,0.35); }
main{
  max-width:820px;
  margin:0 auto;
  padding:20px 14px 60px;
}
.section-title{
  font-size:1.2rem;
  margin:26px 0 12px;
  color:var(--navy);
  border-bottom:2px solid var(--amber);
  padding-bottom:6px;
}
.scoreboard{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 16px;
  margin-bottom:14px;
  font-family:Arial,sans-serif;
  font-size:0.9rem;
  flex-wrap:wrap;
  gap:8px;
}
.scoreboard b{ color:var(--navy); }
.badge{
  display:inline-block;
  font-family:Arial,sans-serif;
  font-size:0.7rem;
  font-weight:bold;
  padding:2px 9px;
  border-radius:12px;
  color:#fff;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.badge.easy{ background:var(--green); }
.badge.medium{ background:var(--amber); color:var(--navy);}
.badge.hard{ background:var(--red); }
.q-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:16px;
  box-shadow:0 2px 4px rgba(15,27,51,0.05);
}
.q-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.q-num{ font-family:Arial,sans-serif; font-size:0.8rem; color:var(--muted); }
.q-text{ font-size:1.02rem; margin:6px 0 12px; line-height:1.5; }
.opt{
  display:block;
  width:100%;
  text-align:left;
  font-family:Arial,sans-serif;
  font-size:0.92rem;
  padding:10px 12px;
  margin-bottom:8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#fbfaf6;
  cursor:pointer;
  transition:all .12s;
}
.opt:hover{ border-color:var(--amber); }
.opt.correct{ background:#e6f4ec; border-color:var(--green); color:#1c5c3a; font-weight:bold; }
.opt.wrong{ background:#fbe9e7; border-color:var(--red); color:#8c3126; font-weight:bold; }
.opt.disabled{ pointer-events:none; opacity:0.85; }
.explain{
  margin-top:10px;
  padding:10px 12px;
  border-radius:8px;
  font-family:Arial,sans-serif;
  font-size:0.88rem;
  line-height:1.5;
  display:none;
}
.explain.show{ display:block; }
.explain.ok{ background:#eefaf1; border:1px solid var(--green); color:#1c5c3a;}
.explain.no{ background:#fdefee; border:1px solid var(--red); color:#8c3126;}
.email-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:20px;
}
.email-draft{
  background:#fbfaf6;
  border:1px dashed #c9c2a8;
  border-radius:8px;
  padding:12px 14px;
  font-family:'Courier New',monospace;
  font-size:0.85rem;
  white-space:pre-wrap;
  margin:10px 0 14px;
  line-height:1.6;
}
.email-card textarea{
  width:100%;
  min-height:130px;
  font-family:Arial,sans-serif;
  font-size:0.9rem;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  resize:vertical;
}
.btn{
  font-family:Arial,sans-serif;
  font-size:0.85rem;
  padding:9px 16px;
  border-radius:8px;
  border:none;
  background:var(--navy);
  color:#fff;
  cursor:pointer;
  margin-top:10px;
  margin-right:8px;
}
.btn:hover{ background:var(--navy2); }
.btn.secondary{ background:var(--amber); color:var(--navy); }
.model-answer{
  display:none;
  margin-top:12px;
  background:#eefaf1;
  border:1px solid var(--green);
  border-radius:8px;
  padding:12px 14px;
  font-family:Arial,sans-serif;
  font-size:0.88rem;
  line-height:1.6;
  white-space:pre-wrap;
}
.model-answer.show{ display:block; }
.checklist{
  font-family:Arial,sans-serif;
  font-size:0.85rem;
  margin:10px 0 0;
  padding-left:18px;
  color:var(--muted);
}
.cheat-tabs{ display:flex; gap:8px; margin-bottom:14px; }
.cheat-tabs button{
  font-family:Arial,sans-serif;
  font-size:0.85rem;
  padding:8px 14px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card);
  cursor:pointer;
}
.cheat-tabs button.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
.cheat-panel{ display:none; }
.cheat-panel.show{ display:block; }
details{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:10px;
  padding:10px 14px;
}
details summary{
  cursor:pointer;
  font-weight:bold;
  color:var(--navy);
  font-family:Arial,sans-serif;
}
details p, details ul{
  font-family:Arial,sans-serif;
  font-size:0.9rem;
  line-height:1.6;
  color:#333;
}
.finish-box{
  background:var(--navy);
  color:#fff;
  border-radius:12px;
  padding:20px;
  text-align:center;
  margin-top:20px;
}
.finish-box h3{ margin:0 0 6px; color:var(--amber-soft); }
.hidden{ display:none; }
footer{
  text-align:center;
  font-family:Arial,sans-serif;
  font-size:0.75rem;
  color:var(--muted);
  padding:20px;
}
</style>
</head>

<script>
/* ============ DATA: MULTIPLE CHOICE QUESTION BANK ============ */
const QUESTION_BANK = {
1:[
 {q:"Receptionist: \"Could I ask you to ___ a moment while I check if he's available?\"",opts:["hold on","hold up","hold in","hold off"],c:0,d:"Easy",ok:"\"Hold on\" is the standard phrase for asking someone to wait briefly on the phone.",no:"\"Hold up\" means to delay/rob, and \"hold off\" means to postpone — neither fits waiting on a call. The correct phrase is \"hold on.\""},
 {q:"\"I'm sorry, he's not at his desk right now. Would you like to leave a ___?\"",opts:["message","massage","notice","note"],c:0,d:"Easy",ok:"\"Leave a message\" is the fixed phone expression for asking someone to relay information.",no:"\"Massage\" is a spelling trap, and \"notice/note\" aren't the natural collocation with \"leave\" in this phone context. The standard phrase is \"leave a message.\""},
 {q:"Caller: \"Sorry, you're ___. Could you repeat that?\" (bad phone signal)",opts:["breaking up","breaking down","breaking in","breaking off"],c:0,d:"Easy",ok:"\"Breaking up\" describes a call with poor, unclear signal.",no:"\"Breaking down\" means malfunctioning (for machines), \"breaking in\" means interrupting/burgling, and \"breaking off\" means ending abruptly. Poor signal is \"breaking up.\""},
 {q:"\"One moment, I'll ___ you through to the Accounting Department.\"",opts:["put","send","pass","bring"],c:0,d:"Easy",ok:"\"Put someone through\" is the standard phrase for connecting a caller to another line.",no:"\"Send/pass/bring through\" aren't natural collocations for phone transfers. The fixed phrase is \"put through.\""},
 {q:"Caller: \"Is this the Marketing Department?\" Receptionist: \"No, I'm afraid you have the ___ number.\"",opts:["wrong","bad","false","incorrect"],c:0,d:"Medium",ok:"\"Wrong number\" is the fixed expression used when a caller has dialed incorrectly.",no:"\"Bad/false/incorrect number\" are not natural English collocations — native speakers always say \"wrong number.\""},
 {q:"\"Mr. Joko is currently on ___ other line. Could you hold?\"",opts:["the","a","an","--"],c:0,d:"Medium",ok:"\"On the line\" is the fixed expression describing being engaged in a phone call.",no:"The definite article \"the\" is required in this fixed phrase — \"on the line\" — not \"a/an\" or no article."},
 {q:"\"The manager forgot his badge, so he asked the guard to open the door for ___.\"",opts:["he","him","his","himself"],c:1,d:"Medium",ok:"\"Him\" is correct because it is the object of the preposition \"for.\"",no:"After a preposition, English requires an object pronoun (him), not the subject (he), possessive (his), or reflexive (himself) form."},
 {q:"\"Everyone should bring ___ own laptop to the training session.\"",opts:["they","their","them","theirs"],c:1,d:"Medium",ok:"\"Their\" is a possessive adjective used directly before a noun (\"own laptop\").",no:"\"They\" is a subject pronoun, \"them\" is an object pronoun, and \"theirs\" stands alone without a noun — none of these can directly precede \"own laptop.\""},
 {q:"\"I broke my phone, so I had to borrow ___ from a colleague.\" (referring to \"a phone\")",opts:["their","theirs","them","they"],c:1,d:"Medium",ok:"\"Theirs\" is a possessive pronoun that stands alone, replacing \"their phone.\"",no:"\"Their\" needs a noun after it, and \"them/they\" are not possessive forms. Standing alone requires \"theirs.\""},
 {q:"\"The director signed the contract ___, without asking anyone for help.\"",opts:["him","his","himself","he"],c:2,d:"Medium",ok:"\"Himself\" is a reflexive pronoun used to emphasize that he did the action alone.",no:"\"Him/his/he\" cannot be used to add emphasis to the subject performing an action alone — that function belongs to the reflexive pronoun \"himself.\""},
 {q:"Caller: \"Hello, this is Maya from Delta Corp. Could I speak to Mr. Andi?\" — Which is the best receptionist response?",opts:["\"He is busy, call later.\"","\"One moment please, I'll see if he's available.\"","\"Why do you want to speak to him?\"","\"He doesn't want to talk to you.\""],c:1,d:"Hard",ok:"This response is polite, professional, and offers to check availability rather than refusing outright.",no:"The other options are abrupt, intrusive, or rude — none reflect professional phone etiquette."},
 {q:"Which sentence correctly uses a stative verb?",opts:["\"I am not understanding your question.\"","\"I do not understand your question.\"","\"I not understand your question.\"","\"I am not understand your question.\""],c:1,d:"Hard",ok:"\"Understand\" is a stative verb (describes a mental state), so it is not normally used in the continuous (-ing) form.",no:"Stative verbs like \"understand,\" \"know,\" and \"believe\" are not typically used with \"-ing.\" The correct simple present negative is \"I do not understand.\""},
 {q:"\"The technician is fixing the printer ___ right now, without any assistant.\"",opts:["himself","him","his","he"],c:0,d:"Hard",ok:"\"Himself\" emphasizes that he is doing the repair alone, without help.",no:"Only the reflexive form \"himself\" can add this emphasis to the subject; the other pronoun forms cannot."},
 {q:"Which is the most professional way to end a business phone call?",opts:["\"Bye.\"","\"OK, bye bye.\"","\"Thank you for calling. Have a good day.\"","\"I'm hanging up now.\""],c:2,d:"Hard",ok:"This closing is warm, professional, and appropriate for business contexts.",no:"The other options are too casual (\"bye bye\") or abrupt (\"I'm hanging up now\") for a professional setting."},
 {q:"\"I'm calling to follow up on our conversation ___ Monday.\"",opts:["on","in","at","since"],c:0,d:"Hard",ok:"\"On\" is the correct preposition used with specific days of the week.",no:"\"In\" is used with months/years, \"at\" with clock times, and \"since\" with a starting point in time — none fit a specific day like \"Monday.\""},
 {q:"\"Could you give me his ___ number so I can call him directly?\"",opts:["extension","extend","extended","extending"],c:0,d:"Easy",ok:"\"Extension\" is the noun for an internal phone number within an office system.",no:"\"Extend/extended/extending\" are verb forms and don't fit as the noun before \"number.\""},
 {q:"\"I'm sorry, the line is ___. Can you try again in a few minutes?\"",opts:["busy","full","close","open"],c:0,d:"Easy",ok:"\"Busy\" (or \"engaged\") is the standard word describing a phone line already in use.",no:"\"Full/close/open\" don't describe a phone line being in use — the fixed term is \"busy.\""},
 {q:"\"Please leave your name and number after the ___, and I will call you back.\"",opts:["tone","bell","sound","ring"],c:0,d:"Easy",ok:"\"Tone\" refers to the beep signaling when to leave a voicemail message.",no:"\"Bell/sound/ring\" don't describe the voicemail beep — the standard term is \"tone.\""},
 {q:"\"We need to set up a ___ call so all three offices can join at once.\"",opts:["conference","group","team","multi"],c:0,d:"Easy",ok:"\"Conference call\" is the fixed business term for a call with multiple participants.",no:"\"Group/team/multi call\" are not standard English collocations — the correct term is \"conference call.\""},
 {q:"\"Could you please dial ___ 105 to reach the HR department?\"",opts:["extension","number","line","code"],c:0,d:"Medium",ok:"\"Dial extension 105\" is the natural phrasing for reaching an internal office number.",no:"\"Number/line/code\" don't collocate naturally with \"dial\" in this internal-phone context — \"extension\" is standard."},
 {q:"\"The manager asked me to call the client ___ this afternoon.\"",opts:["back","again","over","through"],c:0,d:"Medium",ok:"\"Call someone back\" is the fixed phrase for returning a call.",no:"\"Call again/over/through\" are not the correct collocation — the standard phrase is \"call back.\""},
 {q:"\"The new employees introduced ___ to the whole department.\"",opts:["them","themselves","their","they"],c:1,d:"Medium",ok:"\"Themselves\" is the reflexive pronoun needed because the subject and object refer to the same people.",no:"\"Them\" is a simple object pronoun (would imply introducing other people), and \"their/they\" are not object forms."},
 {q:"\"Each department must submit ___ own budget report.\"",opts:["their","they","them","theirs"],c:0,d:"Medium",ok:"\"Their\" is the possessive adjective placed directly before the noun phrase \"own budget report.\"",no:"\"They/them\" are not possessive, and \"theirs\" cannot be followed directly by a noun."},
 {q:"\"This desk is not mine, it belongs to ___.\"",opts:["they","them","theirs","their"],c:2,d:"Medium",ok:"\"Theirs\" is a possessive pronoun that stands alone after \"belongs to.\"",no:"\"They\" is a subject pronoun, \"them\" is an object pronoun, and \"their\" needs a noun directly after it — none fit standing alone here."},
 {q:"Caller: \"I've been on hold for 10 minutes!\" — Which is the best receptionist response?",opts:["\"That's not my problem.\"","\"I'm very sorry for the wait. Let me check on that for you right away.\"","\"You should have called earlier.\"","\"Well, we're busy.\""],c:1,d:"Hard",ok:"This response apologizes sincerely and immediately offers to help, which is the professional standard.",no:"The other options are dismissive or blame the caller, which damages the company's professional image."},
 {q:"\"By next week, the new phone system ___ installed in every office.\"",opts:["will be","will","is","was"],c:0,d:"Hard",ok:"\"Will be installed\" correctly forms the future passive, describing an action that will be completed by a future point.",no:"\"Will\" alone is incomplete, \"is\" is present tense, and \"was\" is past tense — none fit a plan for \"next week.\""},
 {q:"Identify the grammatically correct sentence.",opts:["\"She don't answer calls after 5 PM.\"","\"She doesn't answer calls after 5 PM.\"","\"She not answer calls after 5 PM.\"","\"She isn't answering calls after 5 PM never.\""],c:1,d:"Hard",ok:"\"Doesn't\" is the correct third-person singular negative auxiliary for the simple present tense.",no:"\"Don't\" doesn't agree with \"she,\" and the other options are grammatically incomplete or contain a double negative."},
 {q:"\"Could I leave a message ___ Mr. Tanaka, please?\"",opts:["for","to","at","with"],c:0,d:"Hard",ok:"\"Leave a message for someone\" is the correct fixed preposition pairing.",no:"\"To/at/with\" don't collocate correctly with \"leave a message\" in this context — the standard preposition is \"for.\""},
 {q:"\"The technician said the printer ___ fixed by tomorrow.\"",opts:["will","would be","will be","is being"],c:2,d:"Hard",ok:"\"Will be fixed\" correctly forms the future passive, matching a promise about a future outcome.",no:"\"Will\" alone is incomplete, \"would be\" shifts to a conditional/reported-speech tense not needed here, and \"is being fixed\" describes an ongoing present action, not a future one."},
 {q:"\"I'll ___ you an email with the meeting details right after this call.\"",opts:["send","put","give","make"],c:0,d:"Medium",ok:"\"Send an email\" is the correct, natural verb-object collocation.",no:"\"Put/give/make an email\" are not natural English collocations — the standard verb is \"send.\""}
],
2:[
 {q:"Which greeting is most appropriate for a first email to a new client, Mr. Hendra?",opts:["Hey Hendra,","Yo Hendra!","Dear Mr. Hendra,","Yo!"],c:2,d:"Easy",ok:"\"Dear Mr. + last name\" is the standard formal greeting for someone you haven't met before.",no:"\"Hey/Yo\" are too casual for a first professional contact and could damage your credibility."},
 {q:"Which sign-off suits a formal email to a company representative you don't know personally?",opts:["Cheers,","Later,","Sincerely,","Bye!"],c:2,d:"Easy",ok:"\"Sincerely\" is a standard formal closing appropriate for professional, unfamiliar contacts.",no:"\"Cheers/Later/Bye\" are informal and better suited to close colleagues or friends."},
 {q:"You want a colleague to see a copy of your email, and it's fine for the client to see they were copied. Which field should you use?",opts:["To","CC","BCC","Subject"],c:1,d:"Easy",ok:"CC (carbon copy) is used when the recipient's involvement is visible to everyone on the email.",no:"\"To\" is for main recipients, \"BCC\" hides the recipient, and \"Subject\" isn't a recipient field at all."},
 {q:"You want your manager to receive a copy secretly, without the client knowing. Which field?",opts:["To","CC","BCC","Reply-All"],c:2,d:"Easy",ok:"BCC (blind carbon copy) hides the recipient from everyone else on the email.",no:"CC would reveal the manager's involvement to the client, and \"To/Reply-All\" don't provide that privacy."},
 {q:"Which subject line is best for a business email?",opts:["hi","important!!!","Project Update – Q3 Marketing Report","question"],c:2,d:"Medium",ok:"This subject is specific, informative, and professional — it tells the reader exactly what the email is about.",no:"Vague subjects (\"hi,\" \"question\") or exaggerated punctuation (\"important!!!\") are unprofessional and unhelpful for the reader's inbox."},
 {q:"Which sentence uses correct capitalization?",opts:["the report is due on friday, january 5th.","The Report Is Due On Friday, January 5th.","The report is due on Friday, January 5th.","the meeting Is on wednesday in jakarta."],c:2,d:"Medium",ok:"Only the first word, proper nouns (Friday, January), and place names are capitalized — this option follows standard rules.",no:"Option A has no capitalization at all, and option B over-capitalizes every word (title case is not used mid-sentence)."},
 {q:"Which sentence uses the most professional punctuation?",opts:["When is the deadline???","I need the file ASAP!!!","Could you please send the report by 5 PM?","PLEASE send the report today!"],c:2,d:"Medium",ok:"A single question mark and polite phrasing is the professional standard for business requests.",no:"Multiple exclamation/question marks and all-caps text read as aggressive or unprofessional in business writing."},
 {q:"Which closing line is most appropriate before the sign-off in a formal request email?",opts:["\"Give it to me now.\"","\"Thank you for your time and consideration.\"","\"Whatever, just reply soon.\"","\"Hurry up please.\""],c:1,d:"Medium",ok:"This phrase politely closes the request while showing appreciation for the reader's time.",no:"The other options sound demanding or dismissive, which is inappropriate in professional correspondence."},
 {q:"Which is the most professional way to refer to an attached file?",opts:["\"check attachment\"","\"Please find the attached report for your review.\"","\"file inside, look\"","\"attachment!!\""],c:1,d:"Medium",ok:"This is a complete, polite sentence that clearly directs the reader to the attachment.",no:"The other options are sentence fragments or too abrupt for professional writing."},
 {q:"Which is the best opening line when replying to a client's earlier message?",opts:["\"What do you want now?\"","\"Thank you for your email regarding...\"","\"Received, ok.\"","\"Got your msg\""],c:1,d:"Hard",ok:"This opening acknowledges the client's message politely and professionally before continuing.",no:"The other options are rude, overly terse, or use text-message abbreviations unsuitable for business email."},
 {q:"Which sentence has the correct level of formality for an email to a senior director you've never met?",opts:["\"Hey boss, quick q for u\"","\"Hi, wanted to ask something real quick lol\"","\"Dear Sir/Madam, I would like to ask about...\"","\"Sup, got a sec?\""],c:2,d:"Hard",ok:"This greeting and phrasing matches the formality expected for a first contact with a senior, unfamiliar recipient.",no:"The other options use texting abbreviations and slang, which are inappropriate for formal, unfamiliar business contacts."},
 {q:"Which is the best professional way to ask for something quickly without sounding rude?",opts:["\"I need this now.\"","\"Could you please send this at your earliest convenience?\"","\"Hurry up, I'm waiting.\"","\"Why is this taking so long?\""],c:1,d:"Hard",ok:"This phrasing politely conveys urgency while remaining respectful.",no:"The other options sound demanding or accusatory, which can damage a professional relationship."},
 {q:"Which email best follows the \"one topic per email\" etiquette principle?",opts:["An email requesting a meeting, complaining about IT, and asking about holidays, all mixed together.","An email focused only on scheduling the meeting, with related details in a clear paragraph.","An email covering ten unrelated topics.","An email with no clear focus but many attachments."],c:1,d:"Hard",ok:"Keeping one clear topic per email makes it easier for the recipient to read, respond, and act on it.",no:"Mixing many unrelated topics in one email makes it confusing and increases the chance something gets missed."},
 {q:"A colleague CC's you on an email that doesn't require your input. What's the best etiquette?",opts:["Reply-all with unrelated comments.","No action needed unless you're specifically asked to respond.","Forward it to everyone in the company.","Ignore and delete without reading."],c:1,d:"Hard",ok:"Being CC'd means \"for your information\" — a response is only expected if you're directly asked.",no:"Replying unnecessarily or forwarding widely creates email clutter; simply ignoring it entirely isn't ideal either, as you may still need the information later."},
 {q:"Which sentence correctly uses a colon to introduce a list in a business email?",opts:["\"Please bring, your laptop, notes and pen.\"","\"Please bring: your laptop, notes, and pen.\"","\"Please bring the following: your laptop, notes, and pen.\"","\"Please bring; laptop notes pen.\""],c:2,d:"Hard",ok:"A colon should follow a complete introductory clause (\"the following\") before listing items — this is the correct standard form.",no:"A colon shouldn't directly follow a verb like \"bring\" without a proper lead-in phrase, and semicolons/commas are not used to introduce lists this way."},
 {q:"Which is appropriate for an automatic out-of-office reply?",opts:["\"I'm out, whatever.\"","\"I am currently out of the office and will respond upon my return on [date].\"","\"gone, back later\"","\"not here\""],c:1,d:"Easy",ok:"This is a complete, professional sentence stating the sender's status and expected return.",no:"The other options are sentence fragments too casual for an automatic professional reply."},
 {q:"Which email signature is most professional?",opts:["\"Bye, Rian 😎\"","\"[Your Name]\\n[Job Title]\\n[Company Name]\"","\"sent from my phone lol\"","\"- R\""],c:1,d:"Easy",ok:"A signature with full name, title, and company is the professional standard.",no:"Emojis, casual sign-offs, and single-initial signatures are inappropriate for business correspondence."},
 {q:"Which is the best way to address an email sent to several people at once?",opts:["\"Hey guys,\"","\"Dear All,\"","\"Yo everyone\"","\"Hi hi hi\""],c:1,d:"Easy",ok:"\"Dear All,\" is a standard, professional way to greet multiple recipients.",no:"The other options are too casual or nonsensical for a group business email."},
 {q:"Which phrase correctly introduces an attached file?",opts:["\"Please find attached the requested document.\"","\"attachment below check\"","\"doc is here\"","\"see file plz\""],c:0,d:"Easy",ok:"This is a complete, professional sentence commonly used to reference attachments.",no:"The other options are sentence fragments or use informal abbreviations unsuitable for business writing."},
 {q:"Which is the most polite way to follow up on an unanswered email?",opts:["\"Why haven't you replied yet?\"","\"Just following up on my previous email — please let me know if you need any more information.\"","\"This is my 3rd email, reply now.\"","\"Hello???\""],c:1,d:"Medium",ok:"This phrasing follows up politely without pressuring or blaming the recipient.",no:"The other options sound impatient or accusatory, which can strain a professional relationship."},
 {q:"Which sentence correctly uses \"please\" to soften a request?",opts:["\"Send the file.\"","\"Please send the file at your convenience.\"","\"SEND THE FILE NOW.\"","\"send file pls\""],c:1,d:"Medium",ok:"Adding \"please\" and \"at your convenience\" makes the request polite rather than a blunt command.",no:"The other options are commands, shouted text, or overly casual abbreviations."},
 {q:"What is the best etiquette when a message doesn't need a reply from everyone on the thread?",opts:["Reply-all to say thanks.","Reply only to the sender, unless others truly need to see your response.","Ignore the whole thread.","Forward it to your personal email."],c:1,d:"Medium",ok:"Replying only to the relevant person avoids cluttering everyone else's inbox unnecessarily.",no:"Reply-all for unnecessary responses creates inbox clutter, while ignoring or forwarding elsewhere isn't proper etiquette either."},
 {q:"Which sentence uses correct date formatting for a formal business email?",opts:["\"the meeting is on 5/6.\"","\"The meeting is on June 5, 2026.\"","\"meeting: 5th of the sixth\"","\"The meeting is on 5-6.\""],c:1,d:"Medium",ok:"Writing the month by name avoids the date-format ambiguity that numeric formats like \"5/6\" can create internationally.",no:"Numeric-only date formats are ambiguous across regions, and the other options are incomplete or unclear."},
 {q:"Which is the best way to politely request a read confirmation?",opts:["\"Reply so I know you got this.\"","\"Could you kindly confirm you've received this email?\"","\"Answer now.\"","\"Did you even read this?\""],c:1,d:"Medium",ok:"This phrasing is polite and clearly states what confirmation is being requested.",no:"The other options are demanding or accusatory in tone."},
 {q:"Which is the most professional way to end an email with a clear next step?",opts:["\"Bye.\"","\"Let me know if you have any questions, and I look forward to your response.\"","\"Whatever you decide.\"","\"K thx.\""],c:1,d:"Hard",ok:"This closing invites further questions and clearly signals what happens next.",no:"The other options are too brief, vague, or informal for a professional closing."},
 {q:"Which sentence avoids using ALL CAPS unnecessarily?",opts:["\"This is VERY IMPORTANT, please READ carefully.\"","\"This is very important — please read it carefully.\"","\"THIS IS IMPORTANT!!!\"","\"important!! READ!!\""],c:1,d:"Hard",ok:"Using normal capitalization with an em dash for emphasis is the professional way to highlight importance.",no:"ALL CAPS reads as shouting in written communication and should be avoided in professional emails."},
 {q:"Which is the correct way to forward an email with context for the new recipient?",opts:["Forwarding with no message at all.","\"FYI — please review the attached thread; let me know if you have questions.\"","\"look at this\"","Forwarding silently with a vague one-word title."],c:1,d:"Hard",ok:"Adding a short note explaining why you're forwarding helps the new recipient understand the context immediately.",no:"Forwarding without any explanation forces the recipient to guess the purpose, which wastes their time."},
 {q:"Which sentence uses numbers correctly in formal business writing?",opts:["\"We need 5 copies of the report by 3pm.\"","\"We need five copies of the report by 3 PM.\"","\"we need 5 copy of report by 3 p m\"","\"Five copies needed, 3PM.\""],c:1,d:"Hard",ok:"Formal writing typically spells out small numbers and uses standard time formatting (\"3 PM\").",no:"The other options mix numeral styles inconsistently or use lowercase/incomplete formatting."},
 {q:"Which is the most appropriate way to express mild disagreement politely in an email?",opts:["\"That's wrong.\"","\"I see your point, but I think there might be another way to approach this.\"","\"No, that's a bad idea.\"","\"Whatever you think is fine I guess.\""],c:1,d:"Hard",ok:"This phrasing acknowledges the other person's view before offering an alternative, which is diplomatic and professional.",no:"The other options are blunt, dismissive, or passive rather than constructively diplomatic."},
 {q:"Which best follows the etiquette of avoiding emojis and informal symbols in formal business email?",opts:["\"Thanks!! 😊👍\"","\"Thank you for your assistance.\"","\"thanks!!!\"","\"ty :)\""],c:1,d:"Hard",ok:"A plain, complete sentence without emojis or symbols is appropriate for formal business correspondence.",no:"Emojis, excessive punctuation, and chat abbreviations like \"ty\" are too casual for professional email."}
],
3:[
 {q:"\"Please review the ___ before the meeting so we know what will be discussed.\"",opts:["agenda","minutes","venue","invoice"],c:0,d:"Easy",ok:"An \"agenda\" is the planned list of topics to be discussed in a meeting.",no:"\"Minutes\" are the record written after a meeting, \"venue\" is the location, and \"invoice\" is unrelated to meeting planning."},
 {q:"\"After the meeting, someone needs to write the ___ to record what was decided.\"",opts:["agenda","minutes","schedule","notice"],c:1,d:"Easy",ok:"\"Minutes\" are the official written record of what was discussed and decided in a meeting.",no:"\"Agenda\" is the plan before the meeting, not the record after it; \"schedule/notice\" don't fit this specific meaning."},
 {q:"\"Since the client is sick, we need to ___ the meeting to another day.\"",opts:["attend","postpone","confirm","join"],c:1,d:"Easy",ok:"\"Postpone\" means to move an event to a later date, which fits the context of the client being sick.",no:"\"Attend/confirm/join\" don't convey the idea of delaying an event to a later time."},
 {q:"\"Due to low registration, the organizer decided to ___ the seminar entirely.\"",opts:["cancel","postpone","confirm","hold"],c:0,d:"Easy",ok:"\"Cancel\" means to call off an event completely, which fits \"entirely\" not happening.",no:"\"Postpone\" only delays an event rather than stopping it, and \"confirm/hold\" mean the opposite of stopping it."},
 {q:"\"Could you please ___ your attendance by replying to this email?\"",opts:["confirm","postpone","cancel","agenda"],c:0,d:"Medium",ok:"\"Confirm\" means to verify or officially state that something is certain, fitting a request to verify attendance.",no:"\"Postpone/cancel\" involve changing plans, not verifying them, and \"agenda\" is a noun, not a verb."},
 {q:"A: \"Have you already booked the flights?\" B: \"Yes, we ___ leave on Monday.\" (a plan already arranged)",opts:["will","are going to","go","going"],c:1,d:"Medium",ok:"\"Are going to\" is used for future plans already arranged, matching the fact that flights are booked.",no:"\"Will\" is typically for spontaneous decisions or promises, not pre-arranged plans with evidence (booked tickets)."},
 {q:"B: \"The phone is ringing!\" A: \"I ___ get it.\" (a decision made at the moment of speaking)",opts:["am going to","will","go","answers"],c:1,d:"Medium",ok:"\"Will\" is used for spontaneous decisions made at the moment of speaking, like reacting to a ringing phone.",no:"\"Am going to\" implies a plan made beforehand, which doesn't fit a sudden, in-the-moment reaction."},
 {q:"\"Don't worry about the deadline. I promise I ___ finish the report by tonight.\"",opts:["am going to","will","would","finish"],c:1,d:"Medium",ok:"\"Will\" is used to express a promise or firm commitment.",no:"\"Am going to\" expresses a plan rather than a promise, \"would\" is conditional, and \"finish\" alone isn't a complete future form."},
 {q:"\"Look at those dark clouds! It ___ rain soon.\" (prediction based on visible evidence)",opts:["will","is going to","would","going"],c:1,d:"Medium",ok:"\"Is going to\" is used for predictions based on present evidence, such as dark clouds.",no:"\"Will\" is used for predictions based on opinion rather than visible evidence; the clouds are physical proof supporting \"is going to.\""},
 {q:"Which is the most professional way to inform a client that a meeting must be moved?",opts:["\"We can't do it, sorry.\"","\"We need to postpone our meeting scheduled for Monday to Wednesday due to a scheduling conflict. We apologize for any inconvenience.\"","\"Meeting cancelled, no reason.\"","\"Change of plan lol\""],c:1,d:"Hard",ok:"This response is clear, gives a reason, states the new plan, and apologizes professionally.",no:"The other options are vague, lack detail, or are far too casual for informing a client of a schedule change."},
 {q:"\"The board members ___ their decision at the end of the quarterly meeting.\" (planned formal future action)",opts:["will announce","announces","announced","announcing"],c:0,d:"Hard",ok:"\"Will announce\" correctly forms the future tense for a planned formal action.",no:"\"Announces\" is present tense, \"announced\" is past tense, and \"announcing\" alone is not a complete verb form."},
 {q:"Which sentence correctly reports a decision in a formal \"minutes\" style?",opts:["\"We should buy new laptop.\"","\"It was agreed that the department would purchase new laptops next month.\"","\"buy laptop next month\"","\"New laptops!!\""],c:1,d:"Hard",ok:"Formal minutes use complete, past-tense reporting structures like \"It was agreed that...\"",no:"The other options are grammatically incomplete or too informal for an official meeting record."},
 {q:"\"Due to the manager's illness, today's meeting has been ___ until further notice.\"",opts:["confirmed","postponed","attended","scheduled"],c:1,d:"Hard",ok:"\"Postponed\" fits the context of delaying a meeting due to an unexpected circumstance.",no:"\"Confirmed/attended/scheduled\" don't convey the idea of an existing plan being delayed."},
 {q:"Choose the sentence with the correct verb form.",opts:["\"The meeting start at 9 AM tomorrow.\"","\"The meeting starts at 9 AM tomorrow.\"","\"The meeting starting at 9 AM tomorrow.\"","\"The meeting started at 9 AM tomorrow, ok?\""],c:1,d:"Hard",ok:"\"Starts\" correctly matches the singular subject \"meeting\" for a scheduled future event using present simple.",no:"\"Start\" lacks subject-verb agreement, \"starting\" alone isn't a complete verb, and \"started\" is past tense, which contradicts \"tomorrow.\""},
 {q:"\"We ___ already arranged the venue, so please don't worry about that.\"",opts:["have","has","had","having"],c:0,d:"Hard",ok:"\"Have\" is correct because the subject \"we\" requires the plural present-perfect auxiliary.",no:"\"Has\" is for singular subjects (he/she/it), \"had\" is past perfect (wrong tense here), and \"having\" isn't a complete auxiliary form."},
 {q:"\"Please ___ by Friday whether you can attend the workshop.\"",opts:["RSVP","RSPV","reply back","answer up"],c:0,d:"Easy",ok:"\"RSVP\" is the standard business abbreviation requesting confirmation of attendance.",no:"\"RSPV\" is a misspelling, and \"reply back / answer up\" are not standard invitation phrases."},
 {q:"\"The meeting room is already ___ for 10 AM, please choose another slot.\"",opts:["booked","bought","hold","taken"],c:0,d:"Easy",ok:"\"Booked\" is the standard word for reserving a meeting room.",no:"\"Bought\" doesn't apply to reserving a room, and \"hold/taken\" aren't the natural collocation with a meeting room."},
 {q:"\"Please ___ your microphone when you are not speaking.\"",opts:["mute","silence","close","off"],c:0,d:"Easy",ok:"\"Mute\" is the standard verb for turning off a microphone's sound during virtual meetings.",no:"\"Silence/close/off\" are not the natural verb used for microphones in virtual meeting software."},
 {q:"\"I'll send everyone the meeting ___ so you can join online.\"",opts:["link","road","way","route"],c:0,d:"Easy",ok:"\"Link\" is the correct term for the URL used to join an online meeting.",no:"\"Road/way/route\" don't apply to joining a virtual meeting — the correct term is \"link.\""},
 {q:"\"Let's schedule a follow-up meeting to review the ___ from today's discussion.\"",opts:["action items","action point","act items","actions item"],c:0,d:"Medium",ok:"\"Action items\" is the standard business term for tasks assigned during a meeting.",no:"The other options are incorrect or non-standard forms of this fixed business phrase."},
 {q:"\"This is a ___ meeting, so we meet every Monday at the same time.\"",opts:["recurring","repeating","returning","reoccurring"],c:0,d:"Medium",ok:"\"Recurring meeting\" is the standard business term for a meeting that happens on a regular schedule.",no:"\"Repeating/returning/reoccurring\" are not the natural collocation used in scheduling software and business speech."},
 {q:"\"I apologize for being late; I got stuck in traffic ___ way here.\"",opts:["on my","at my","in my","for my"],c:0,d:"Medium",ok:"\"On my way\" is the fixed expression describing being in transit somewhere.",no:"\"At my / in my / for my way\" are not correct — the standard phrase is \"on my way.\""},
 {q:"\"Since our teams are in different time zones, let's find a time that ___ for everyone.\"",opts:["works","work","working","worked"],c:0,d:"Medium",ok:"\"Works\" agrees with the singular subject \"a time\" in the present simple tense.",no:"\"Work\" doesn't match the singular subject, and \"working/worked\" don't fit this structure grammatically."},
 {q:"\"Before we wrap up, does anyone have any ___ questions?\"",opts:["last-minute","lastly","at last","finally"],c:0,d:"Medium",ok:"\"Last-minute\" is an adjective correctly describing questions raised just before ending.",no:"\"Lastly/at last/finally\" are transition words, not adjectives that can describe \"questions\" this way."},
 {q:"\"The deadline for submitting the proposal is ___ the end of this week.\"",opts:["by","until","on","at"],c:0,d:"Medium",ok:"\"By\" is used to indicate a deadline — an action must be completed at or before that time.",no:"\"Until\" implies a continuous action stopping at that point, and \"on/at\" don't fit \"the end of this week\" as a deadline expression."},
 {q:"Which is the most professional way to ask someone to speak up in a meeting?",opts:["\"Speak louder, I can't hear you.\"","\"Sorry, could you speak up a little? I'm having trouble hearing you.\"","\"What? Louder!\"","\"You're too quiet.\""],c:1,d:"Hard",ok:"This phrasing is polite, apologizes first, and clearly explains the issue.",no:"The other options are blunt commands or critical remarks unsuitable for a professional meeting."},
 {q:"Which sentence correctly assigns an action item?",opts:["\"John do the report.\"","\"John will be responsible for preparing the report by Friday.\"","\"report - john - friday\"","\"Someone do the report I guess.\""],c:1,d:"Hard",ok:"This is a complete, clear sentence assigning responsibility and a deadline.",no:"The other options are grammatically incomplete or too vague to serve as a clear action item."},
 {q:"Which is the best way to end a meeting professionally?",opts:["\"OK bye everyone.\"","\"Thank you all for your time; I'll send the minutes by tomorrow.\"","\"That's all, leave now.\"","\"Meeting over.\""],c:1,d:"Hard",ok:"This closing thanks participants and states a clear next step (sending the minutes).",no:"The other options are abrupt or lack a professional close."},
 {q:"Which sentence uses the correct verb tense to describe an ongoing agenda item?",opts:["\"We currently discuss the budget.\"","\"We are currently discussing the budget.\"","\"We currently discussing the budget.\"","\"We discuss currently the budget.\""],c:1,d:"Hard",ok:"The present continuous (\"are currently discussing\") correctly describes an action happening right now.",no:"The other options either use the wrong tense for an ongoing action or place the adverb incorrectly."},
 {q:"\"The client asked us to ___ the meeting until they finish their internal review.\"",opts:["postpone","postponement","postponed","postponing"],c:0,d:"Medium",ok:"\"Postpone\" is the correct base verb form needed directly after \"to.\"",no:"\"Postponement\" is a noun, and \"postponed/postponing\" don't fit the infinitive structure \"to + base verb.\""}
],
4:[
 {q:"\"Before starting the project, the supplier sent us a ___ showing the estimated cost.\"",opts:["quotation","invoice","receipt","agenda"],c:0,d:"Easy",ok:"A \"quotation\" is a document estimating the cost of goods or services before work begins.",no:"An \"invoice\" is sent after work is done requesting payment, a \"receipt\" proves payment was made, and \"agenda\" is unrelated to pricing."},
 {q:"\"After the work is completed, we will send you an ___ so you can make the payment.\"",opts:["quotation","invoice","receipt","purchase order"],c:1,d:"Easy",ok:"An \"invoice\" is a bill requesting payment after goods or services are delivered.",no:"A \"quotation\" comes before the work starts, a \"receipt\" comes after payment is made, and a \"purchase order\" is issued by the buyer, not the seller."},
 {q:"\"Thank you for your payment. Please find attached your ___ as proof of purchase.\"",opts:["invoice","quotation","receipt","agenda"],c:2,d:"Easy",ok:"A \"receipt\" is proof that a payment has already been made.",no:"An \"invoice\" requests payment (before it's made), a \"quotation\" is a price estimate, and \"agenda\" is unrelated to payments."},
 {q:"Buyer: \"Excuse me, ___ is this printer?\" Seller: \"It's Rp 1,500,000.\"",opts:["how many","how much","what price","how cost"],c:1,d:"Easy",ok:"\"How much\" is the correct phrase for asking about price (an uncountable concept).",no:"\"How many\" is for countable items, and \"what price / how cost\" are not natural English phrasings."},
 {q:"\"If you order more than 100 units, we can offer you a 15% ___.\"",opts:["discount","tax","subtotal","total"],c:0,d:"Medium",ok:"A \"discount\" is a price reduction, which fits the context of a bulk-order incentive.",no:"\"Tax\" adds to the price rather than reducing it, and \"subtotal/total\" refer to calculated amounts, not a price reduction."},
 {q:"\"We need to buy some new office ___.\"",opts:["furnitures","furniture's","furniture","a furniture"],c:2,d:"Medium",ok:"\"Furniture\" is an uncountable noun in English and has no plural form.",no:"\"Furnitures,\" the possessive \"furniture's,\" and \"a furniture\" are all incorrect — uncountable nouns don't take \"-s\" or the article \"a.\""},
 {q:"\"Could you send me some ___ about your new product line?\"",opts:["an information","informations","information","many information"],c:2,d:"Medium",ok:"\"Information\" is uncountable and has no plural form; \"some\" correctly precedes it.",no:"\"An information,\" \"informations,\" and \"many information\" all incorrectly treat \"information\" as countable."},
 {q:"\"We don't have ___ budget left for this quarter.\" (uncountable, negative sentence)",opts:["many","much","some","a"],c:1,d:"Medium",ok:"\"Much\" is used with uncountable nouns in negative sentences, matching \"budget.\"",no:"\"Many\" is for countable nouns, \"some\" is typically for positive statements or offers, and \"a\" doesn't fit uncountable nouns."},
 {q:"\"Do you have ___ samples available for testing?\" (countable noun, question)",opts:["much","many","any","a"],c:2,d:"Medium",ok:"\"Any\" is the standard choice for countable nouns in questions, especially when the quantity is unknown.",no:"\"Much\" is for uncountable nouns, \"many\" is more common in statements about a large quantity, and \"a\" doesn't fit a plural noun like \"samples.\""},
 {q:"\"Before we can confirm the order, please send us a formal ___.\"",opts:["Purchase Order","Receipt","Invoice","Agenda"],c:0,d:"Hard",ok:"A \"Purchase Order\" is the buyer's formal document requesting goods, needed before an order is confirmed.",no:"A \"Receipt\" and \"Invoice\" relate to payment stages after ordering, and \"Agenda\" is unrelated to purchasing."},
 {q:"Which is the most professional way to negotiate a lower price?",opts:["\"Give me discount now!\"","\"Is there any possibility of a discount for a bulk order?\"","\"Too expensive, reduce it.\"","\"I won't buy if you don't lower it.\""],c:1,d:"Hard",ok:"This phrasing is polite and frames the request as a reasonable question rather than a demand.",no:"The other options sound demanding or like a threat, which can damage a business relationship."},
 {q:"Which sentence correctly uses \"much\" or \"many\"?",opts:["\"How much boxes do you need?\"","\"How many boxes do you need?\"","\"How much box do you need?\"","\"How many box do you need?\""],c:1,d:"Hard",ok:"\"Many\" is used with plural countable nouns like \"boxes.\"",no:"\"Much\" is for uncountable nouns, and \"box\" (singular) doesn't match a quantity question expecting more than one."},
 {q:"\"We need to buy three new ___ for the meeting room.\"",opts:["furniture","furnitures","piece of furniture","pieces of furniture"],c:3,d:"Hard",ok:"\"Pieces of furniture\" is the correct way to count the uncountable noun \"furniture\" using a counting unit, matching \"three.\"",no:"\"Furniture/furnitures\" cannot take a number directly, and \"piece of furniture\" (singular) doesn't match \"three.\""},
 {q:"Which sentence best confirms acceptance of a price quotation?",opts:["\"ok we take it\"","\"We are pleased to accept your quotation and would like to proceed with the order.\"","\"yes good price go ahead\"","\"Accept. Send now.\""],c:1,d:"Hard",ok:"This is a complete, professional sentence clearly confirming acceptance and next steps.",no:"The other options are informal fragments unsuitable for a formal business confirmation."},
 {q:"\"The client asked for a ___ before agreeing to place a large order.\"",opts:["sample","samples","some sample","a samples"],c:0,d:"Hard",ok:"\"A sample\" (singular, countable) is correct after the article \"a.\"",no:"\"Samples\" is plural (doesn't match \"a\"), \"some sample\" mismatches quantity word and noun form, and \"a samples\" incorrectly pairs \"a\" with a plural noun."},
 {q:"\"Payment is due within 30 days ___ receiving the invoice.\"",opts:["of","after","from","on"],c:0,d:"Easy",ok:"\"Within 30 days of\" is the standard fixed phrase for stating a payment deadline.",no:"\"After/from/on\" don't fit this fixed business collocation as naturally as \"of.\""},
 {q:"\"This product comes with a one-year ___ against manufacturing defects.\"",opts:["warranty","guarantee","insurance","policy"],c:0,d:"Easy",ok:"\"Warranty\" is the standard business term for a manufacturer's promise to repair or replace defective goods.",no:"\"Guarantee\" is a near-synonym but less standard in this specific product context, and \"insurance/policy\" don't fit manufacturing defects."},
 {q:"\"I'm sorry, this item is currently ___; we expect new stock next week.\"",opts:["out of stock","out of order","out of date","out of place"],c:0,d:"Easy",ok:"\"Out of stock\" means an item is temporarily unavailable for purchase.",no:"\"Out of order\" describes broken equipment, \"out of date\" means expired/outdated, and \"out of place\" means misplaced — none fit unavailable inventory."},
 {q:"\"If you're not satisfied, we offer a full ___ within 14 days.\"",opts:["refund","return","change","exchange"],c:0,d:"Easy",ok:"\"Refund\" refers to money being returned to the customer, matching \"full\" before it.",no:"\"Return/change/exchange\" describe the action of sending an item back, not the money given back — \"refund\" is correct here."},
 {q:"\"We usually offer better prices for ___ orders rather than single items.\"",opts:["wholesale","retail","single","small"],c:0,d:"Medium",ok:"\"Wholesale\" refers to buying in bulk at a lower per-unit price, contrasting with buying single items.",no:"\"Retail\" refers to selling individual items to consumers, and \"single/small\" don't convey the bulk-buying concept."},
 {q:"\"Could we discuss extending the ___ date for this project?\"",opts:["deadline","dateline","timeline","lastline"],c:0,d:"Medium",ok:"\"Deadline\" is the standard business term for the date by which something must be completed.",no:"\"Dateline/lastline\" aren't standard English words in this context, and \"timeline\" refers to a schedule, not a single cutoff date."},
 {q:"\"We require a 30% ___ before we begin production.\"",opts:["deposit","discount","refund","receipt"],c:0,d:"Medium",ok:"\"Deposit\" is an upfront partial payment made before work begins.",no:"\"Discount\" reduces a price, \"refund\" returns money, and \"receipt\" proves payment — none describe an upfront partial payment."},
 {q:"\"All prices listed are exclusive of ___, which will be added at checkout.\"",opts:["tax","discount","refund","deposit"],c:0,d:"Medium",ok:"\"Tax\" is commonly added to a listed price at checkout, matching \"exclusive of\" and \"added.\"",no:"\"Discount/refund/deposit\" don't fit the context of something added on top of a listed price."},
 {q:"\"Please review the ___ and conditions before signing the contract.\"",opts:["terms","rules","agenda","policy"],c:0,d:"Medium",ok:"\"Terms and conditions\" is the standard fixed phrase used in contracts.",no:"\"Rules/agenda/policy\" don't pair with \"and conditions\" as the standard legal/business phrase."},
 {q:"\"We received the shipment, but two items arrived ___.\"",opts:["damage","damaged","damaging","damages"],c:1,d:"Medium",ok:"\"Damaged\" is the correct past-participle adjective describing the condition of the items.",no:"\"Damage/damaging/damages\" are not the correct adjective form needed after \"arrived.\""},
 {q:"Which is the most professional way to report a defective item?",opts:["\"Your product is trash, fix it.\"","\"We received the shipment today, but two units appear to be defective. Could you advise on the return process?\"","\"broken items, angry, refund now\"","\"Bad product, again!\""],c:1,d:"Hard",ok:"This response states the facts clearly and requests guidance politely.",no:"The other options are rude, vague, or unprofessional in tone."},
 {q:"Which sentence correctly requests an update on order tracking?",opts:["\"where package\"","\"Could you please provide a tracking number for our shipment?\"","\"package now?\"","\"send tracking\""],c:1,d:"Hard",ok:"This is a complete, polite sentence clearly requesting the specific information needed.",no:"The other options are sentence fragments too informal for a business inquiry."},
 {q:"Which sentence correctly uses \"deposit\" and \"balance\" together?",opts:["\"Please pay full deposit at delivery.\"","\"Please pay a 30% deposit now, with the remaining balance due upon delivery.\"","\"deposit balance pay now full\"","\"Balance first, then deposit later maybe.\""],c:1,d:"Hard",ok:"This sentence correctly explains the payment structure: partial deposit now, remaining balance later.",no:"The other options are grammatically incorrect or reverse the logical order of deposit and balance."},
 {q:"\"The exchange rate today means the total in USD ___ higher than last month.\"",opts:["is","are","was","were"],c:0,d:"Hard",ok:"\"Is\" agrees with the singular subject \"the total\" in the present tense, matching \"today.\"",no:"\"Are\" doesn't match the singular subject, and \"was/were\" are past tense, which contradicts \"today.\""},
 {q:"\"Could you confirm the ___ method — bank transfer, credit card, or cash?\"",opts:["payment","paying","pay","paid"],c:0,d:"Medium",ok:"\"Payment method\" is the correct noun form used before \"method.\"",no:"\"Paying/pay/paid\" are verb forms and don't fit directly before the noun \"method\" — the correct compound noun is \"payment method.\""}
],
5:[
 {q:"\"The new intern forgot ___ badge at home today.\"",opts:["he","his","him","himself"],c:1,d:"Easy",ok:"\"His\" is a possessive adjective used directly before the noun \"badge.\"",no:"\"He\" is a subject pronoun, \"him\" an object pronoun, and \"himself\" a reflexive pronoun — none can directly precede a noun like \"badge.\""},
 {q:"\"This report is not mine, it's ___.\"",opts:["they","their","theirs","them"],c:2,d:"Easy",ok:"\"Theirs\" is a possessive pronoun that stands alone without a following noun.",no:"\"They/them\" are not possessive forms, and \"their\" requires a noun directly after it (e.g., \"their report\")."},
 {q:"\"The manager checked the numbers ___ before submitting the report.\"",opts:["he","him","his","himself"],c:3,d:"Easy",ok:"\"Himself\" is a reflexive pronoun showing he checked the numbers personally, without help.",no:"\"He/him/his\" cannot add this reflexive emphasis to the subject performing the action alone."},
 {q:"\"Could you give this file to ___? He is waiting outside.\"",opts:["he","him","his","himself"],c:1,d:"Easy",ok:"\"Him\" is correct as the object of the preposition \"to.\"",no:"\"He\" is a subject pronoun, \"his\" is possessive, and \"himself\" is reflexive — none fit as the object of \"to\" here."},
 {q:"\"I'm sorry, I ___ what you're asking. Could you rephrase it?\"",opts:["don't understand","am not understanding","not understand","didn't understanding"],c:0,d:"Medium",ok:"\"Understand\" is a stative verb, so the correct negative form is simple present: \"don't understand.\"",no:"Stative verbs aren't normally used with \"-ing,\" and the other options are grammatically incomplete or incorrect."},
 {q:"\"She ___ three companies in different cities.\" (a fact/state)",opts:["is owning","owns","own","owning"],c:1,d:"Medium",ok:"\"Owns\" is correct — third-person singular present tense for a stative verb describing a fact.",no:"\"Is owning\" incorrectly uses continuous form with a stative verb, \"own\" lacks subject agreement, and \"owning\" alone isn't a complete verb."},
 {q:"\"We don't have ___ time to finish this today.\"",opts:["many","much","some","a"],c:1,d:"Medium",ok:"\"Much\" is used with the uncountable noun \"time\" in a negative sentence.",no:"\"Many\" is for countable nouns, and \"some/a\" don't fit this negative structure with an uncountable noun."},
 {q:"\"Would you like ___ coffee before the meeting starts?\" (an offer)",opts:["any","some","many","a"],c:1,d:"Medium",ok:"\"Some\" is used in offers, even though the sentence is a question — this is a common exception to the \"any in questions\" rule.",no:"\"Any\" is typical for negatives/most questions, but polite offers conventionally use \"some\"; \"many/a\" don't fit an uncountable noun like coffee."},
 {q:"\"There aren't ___ empty seats left in the conference room.\"",opts:["much","many","some","a"],c:1,d:"Medium",ok:"\"Many\" is used with the plural countable noun \"seats\" in a negative sentence.",no:"\"Much\" is for uncountable nouns, and \"some/a\" don't fit this negative structure with a plural countable noun."},
 {q:"Which sentence has correct subject-verb agreement?",opts:["\"The team of managers meet every Monday.\"","\"The team of managers meets every Monday.\"","\"The team of managers meeting every Monday.\"","\"The team of managers met every Monday, always.\""],c:1,d:"Hard",ok:"\"Team\" (singular collective noun) takes the singular verb \"meets,\" even though \"managers\" is plural.",no:"The verb must agree with \"team,\" the singular head noun, not with \"managers\" inside the prepositional phrase."},
 {q:"\"By the time you arrive, we ___ already finished the presentation.\"",opts:["will","have","will have","had"],c:2,d:"Hard",ok:"\"Will have\" forms the future perfect, correctly describing an action completed before a future point in time.",no:"\"Will\" alone and \"have\" alone are incomplete forms, and \"had\" (past perfect) doesn't fit a future time reference (\"by the time you arrive\")."},
 {q:"Which sentence uses the article correctly?",opts:["\"She is an unique employee.\"","\"She is a unique employee.\"","\"She is the unique employee.\"","\"She is unique employee.\""],c:1,d:"Hard",ok:"\"Unique\" begins with a consonant sound (\"yu-\"), so it takes \"a,\" not \"an.\"",no:"\"An\" is used before vowel sounds, but \"unique\" sounds like it starts with \"y,\" a consonant sound, so \"a unique\" is correct; omitting the article entirely is also wrong."},
 {q:"\"Neither the manager nor the staff ___ available today.\"",opts:["is","are","was","were"],c:0,d:"Hard",ok:"With \"neither...nor,\" the verb agrees with the noun closest to it — \"staff\" (treated as singular here) takes \"is.\"",no:"\"Are/were\" don't match the singular treatment of \"staff\" nearest the verb, and \"was\" is past tense, which doesn't fit \"today.\""},
 {q:"Which sentence is correctly punctuated?",opts:["\"Although he was late, he still finished the report.\"","\"Although he was late he still finished the report\"","\"Although, he was late, he still finished the report.\"","\"Although he was late; he still finished the report.\""],c:0,d:"Hard",ok:"A comma correctly separates the introductory subordinate clause (\"Although he was late\") from the main clause.",no:"Option B is missing the required comma, option C wrongly places a comma after \"Although,\" and option D misuses a semicolon where a comma is needed."},
 {q:"Which is the most natural, professional sentence?",opts:["\"I would like to inquire about the status of my application.\"","\"Where is my application status??\"","\"Tell me my application now.\"","\"Application status pls.\""],c:0,d:"Hard",ok:"This is a complete, polite, professional sentence appropriate for formal inquiries.",no:"The other options are demanding, incomplete, or use informal abbreviations unsuitable for professional writing."},
 {q:"\"The report ___ by the finance team every month.\"",opts:["prepares","is prepared","prepare","preparing"],c:1,d:"Easy",ok:"\"Is prepared\" is the correct passive form, since the report receives the action rather than performing it.",no:"\"Prepares/prepare\" are active forms that don't fit (the report doesn't prepare itself), and \"preparing\" alone isn't a complete verb."},
 {q:"\"If the client ___ available tomorrow, we will reschedule the call.\"",opts:["isn't","wasn't","hasn't","won't"],c:0,d:"Easy",ok:"\"Isn't\" (present simple) is correct in the \"if\" clause of a first conditional sentence about a future possibility.",no:"\"Wasn't\" is past tense, \"hasn't\" doesn't fit with \"available,\" and \"won't\" can't follow \"if\" directly in this structure."},
 {q:"\"This proposal is much ___ than the previous one.\"",opts:["good","better","best","well"],c:1,d:"Easy",ok:"\"Better\" is the correct comparative form of \"good,\" matching \"than\" in the sentence.",no:"\"Good\" is the base form, \"best\" is superlative (no \"than\" needed), and \"well\" is an adverb, not fitting this adjective comparison."},
 {q:"\"This is the ___ presentation I've seen all year.\"",opts:["best","better","good","well"],c:0,d:"Easy",ok:"\"Best\" is the superlative form of \"good,\" correctly used with \"the\" to describe the top of a group (\"all year\").",no:"\"Better\" is comparative (needs \"than\"), and \"good/well\" don't fit the superlative structure with \"the.\""},
 {q:"\"The report is due ___ Friday afternoon.\"",opts:["by","on","at","in"],c:0,d:"Medium",ok:"\"Due by\" is the correct collocation for a deadline that must be met at or before a certain time.",no:"\"On/at/in\" don't convey the deadline meaning as naturally as \"by\" does in this context."},
 {q:"\"The document ___ you sent me yesterday had an error.\"",opts:["who","which","whom","whose"],c:1,d:"Medium",ok:"\"Which\" is the correct relative pronoun for referring to a thing (the document), not a person.",no:"\"Who/whom\" are used for people, and \"whose\" indicates possession — none fit referring to \"the document.\""},
 {q:"\"You ___ submit the form before the deadline, or your application won't be considered.\"",opts:["must","might","could","would"],c:0,d:"Medium",ok:"\"Must\" expresses a strong obligation, matching the serious consequence stated afterward.",no:"\"Might/could/would\" express possibility or hypothetical situations, not the strict requirement implied here."},
 {q:"\"She said that she ___ send the report the next day.\" (reported speech)",opts:["will","would","is going to","going"],c:1,d:"Medium",ok:"\"Would\" is the correct backshifted form of \"will\" used in reported speech about a past statement.",no:"\"Will\" is not backshifted for reported speech, and \"is going to / going\" don't follow the reported-speech pattern correctly here."},
 {q:"\"He avoided ___ the client until the report was ready.\"",opts:["to contact","contacting","contact","contacted"],c:1,d:"Medium",ok:"\"Avoid\" is followed by a gerund (\"contacting\"), not an infinitive.",no:"\"To contact\" incorrectly uses the infinitive after \"avoid,\" and \"contact/contacted\" aren't the correct verb forms in this structure."},
 {q:"\"We look forward to ___ from you soon.\"",opts:["hear","hearing","heard","to hear"],c:1,d:"Hard",ok:"\"Look forward to\" is followed by a gerund (\"hearing\"), since \"to\" here is a preposition, not part of an infinitive.",no:"\"Hear/heard/to hear\" incorrectly treat \"to\" as part of an infinitive verb form, which is a common mistake with this fixed phrase."},
 {q:"Choose the sentence with correct passive voice.",opts:["\"The invoice sent yesterday.\"","\"The invoice was sent yesterday.\"","\"The invoice is sending yesterday.\"","\"The invoice sends yesterday.\""],c:1,d:"Hard",ok:"\"Was sent\" correctly forms the past passive, since the invoice received the action.",no:"The other options are missing the auxiliary verb or use an incorrect tense/aspect for a completed past action."},
 {q:"Which sentence correctly uses a conditional for a business policy?",opts:["\"If you cancel within 24 hours, you gets a full refund.\"","\"If you cancel within 24 hours, you will get a full refund.\"","\"If you cancel within 24 hours, you got a full refund.\"","\"If you cancel within 24 hours, you getting a full refund.\""],c:1,d:"Hard",ok:"This is a correctly formed first conditional: present simple in the \"if\" clause, \"will\" + base verb in the result clause.",no:"The other options have incorrect subject-verb agreement or tense in the result clause."},
 {q:"Which sentence uses the correct business collocation?",opts:["\"make a decision\"","\"do a decision\"","\"take a decision\"","\"have a decision\""],c:0,d:"Hard",ok:"\"Make a decision\" is the standard English collocation.",no:"\"Do/take/have a decision\" are not the natural pairing in standard business English — the correct verb is \"make.\""},
 {q:"Which sentence best uses \"despite\" correctly?",opts:["\"Despite of the delay, we finished on time.\"","\"Despite the delay, we finished on time.\"","\"Despite the delay, but we finished on time.\"","\"Although the delay, we finished on time.\""],c:1,d:"Hard",ok:"\"Despite\" is directly followed by a noun phrase, with no \"of\" and no \"but\" needed afterward.",no:"\"Despite of\" incorrectly adds \"of,\" the \"but\" is redundant after \"despite,\" and \"although\" must be followed by a full clause, not just a noun phrase."},
 {q:"\"The client has ___ concerns about the new pricing model.\"",opts:["some","much","many","a"],c:0,d:"Medium",ok:"\"Some\" is used with the plural countable noun \"concerns\" in a general positive statement.",no:"\"Much\" is for uncountable nouns, \"many\" usually pairs with negatives/questions rather than a plain positive statement, and \"a\" doesn't fit a plural noun."}
],
6:[
 {q:"\"Let's ___ base next week to check on the project's progress.\"",opts:["touch","hit","reach","get"],c:0,d:"Easy",ok:"\"Touch base\" is a fixed idiom meaning to make brief contact with someone.",no:"\"Hit/reach/get base\" are not the correct idiom — the fixed expression is \"touch base.\""},
 {q:"\"I think we're finally ___ the same page about the budget.\"",opts:["on","in","at","with"],c:0,d:"Easy",ok:"\"On the same page\" is a fixed idiom meaning to be in agreement or have the same understanding.",no:"\"In/at/with the same page\" are not correct — the standard idiom uses \"on.\""},
 {q:"\"Can you give me a ___ figure for the total cost?\"",opts:["ballpark","baseball","football","round"],c:0,d:"Easy",ok:"\"Ballpark figure\" is a fixed idiom meaning a rough estimate.",no:"\"Baseball/football/round figure\" are not the correct idiom — the standard phrase is \"ballpark figure.\""},
 {q:"\"The ___ line is, we need to cut costs this quarter.\"",opts:["bottom","top","main","final"],c:0,d:"Easy",ok:"\"Bottom line\" is a fixed idiom meaning the most essential point or conclusion.",no:"\"Top/main/final line\" are not correct — the standard idiom is \"bottom line.\""},
 {q:"\"The project's future is still ___ in the air; nothing is confirmed yet.\"",opts:["up","down","out","over"],c:0,d:"Easy",ok:"\"Up in the air\" is a fixed idiom meaning uncertain or undecided.",no:"\"Down/out/over in the air\" are not correct — the standard idiom is \"up in the air.\""},
 {q:"\"After the plan failed, we had to go back to the ___ board.\"",opts:["drawing","writing","planning","design"],c:0,d:"Medium",ok:"\"Back to the drawing board\" is a fixed idiom meaning to start planning again from the beginning.",no:"\"Writing/planning/design board\" are not correct — the standard idiom uses \"drawing.\""},
 {q:"\"Let's get the ___ rolling on this new campaign.\"",opts:["ball","wheel","car","train"],c:0,d:"Medium",ok:"\"Get the ball rolling\" is a fixed idiom meaning to start a process or activity.",no:"\"Wheel/car/train rolling\" are not the correct idiom — the standard expression is \"get the ball rolling.\""},
 {q:"\"We shouldn't ___ corners just to save time on this project.\"",opts:["cut","skip","miss","turn"],c:0,d:"Medium",ok:"\"Cut corners\" is a fixed idiom meaning to do something poorly or incompletely to save time or money.",no:"\"Skip/miss/turn corners\" are not correct — the standard idiom is \"cut corners.\""},
 {q:"\"Please keep me in the ___ about any updates on this deal.\"",opts:["loop","circle","group","team"],c:0,d:"Medium",ok:"\"Keep someone in the loop\" is a fixed idiom meaning to keep someone informed.",no:"\"Circle/group/team\" are not correct — the standard idiom uses \"loop.\""},
 {q:"\"Our new product could be a real game ___ for the industry.\"",opts:["changer","maker","breaker","winner"],c:0,d:"Medium",ok:"\"Game changer\" is a fixed idiom meaning something that significantly alters a situation.",no:"\"Maker/breaker/winner\" are not correct — the standard idiom is \"game changer.\""},
 {q:"\"She always goes the extra ___ to make sure clients are happy.\"",opts:["mile","step","kilometer","distance"],c:0,d:"Medium",ok:"\"Go the extra mile\" is a fixed idiom meaning to make a special additional effort.",no:"\"Step/kilometer/distance\" are not correct — the standard idiom uses \"mile.\""},
 {q:"\"There's a steep learning ___ with this new software.\"",opts:["curve","hill","slope","climb"],c:0,d:"Medium",ok:"\"Learning curve\" is a fixed idiom describing the rate at which someone gains new skills or knowledge.",no:"\"Hill/slope/climb\" are not correct — the standard idiom is \"learning curve.\""},
 {q:"\"Getting approval took forever because of all the red ___.\"",opts:["tape","paper","line","string"],c:0,d:"Medium",ok:"\"Red tape\" is a fixed idiom referring to excessive bureaucracy or official rules that slow things down.",no:"\"Paper/line/string\" are not correct — the standard idiom is \"red tape.\""},
 {q:"\"I'll keep you ___ on how the negotiation goes.\"",opts:["posted","informed","updated","aware"],c:0,d:"Medium",ok:"\"Keep someone posted\" is the fixed idiomatic phrase meaning to give someone regular updates.",no:"While \"informed/updated/aware\" are related in meaning, the fixed idiomatic collocation with \"keep you\" is specifically \"posted.\""},
 {q:"\"The new manager really hit the ground ___ in her first week.\"",opts:["running","walking","moving","working"],c:0,d:"Medium",ok:"\"Hit the ground running\" is a fixed idiom meaning to start something with energy and enthusiasm right away.",no:"\"Walking/moving/working\" are not correct — the standard idiom uses \"running.\""},
 {q:"\"No one wanted to mention the budget cuts — it was the elephant in the ___.\"",opts:["room","office","meeting","building"],c:0,d:"Hard",ok:"\"Elephant in the room\" is a fixed idiom for an obvious problem everyone avoids discussing.",no:"\"Office/meeting/building\" are not correct — the standard idiom is \"elephant in the room.\""},
 {q:"\"That's an interesting idea — definitely food for ___.\"",opts:["thought","mind","brain","idea"],c:0,d:"Hard",ok:"\"Food for thought\" is a fixed idiom meaning something worth thinking about carefully.",no:"\"Mind/brain/idea\" are not correct — the standard idiom uses \"thought.\""},
 {q:"\"Their new technology helped them ___ the market in that region.\"",opts:["corner","win","take","own"],c:0,d:"Hard",ok:"\"Corner the market\" is a fixed idiom meaning to gain a dominant, controlling position in a market.",no:"\"Win/take/own the market\" are plausible-sounding but not the fixed business idiom — the standard phrase is \"corner the market.\""},
 {q:"\"After months of negotiation, they finally ___ the deal.\"",opts:["closed","finished","ended","completed"],c:0,d:"Hard",ok:"\"Close the deal\" is the fixed business idiom meaning to successfully finalize an agreement.",no:"\"Finished/ended/completed\" are understandable but not the standard fixed collocation — the idiom is \"close the deal.\""},
 {q:"\"Switching to digital invoices was a ___ decision — it saved us so much time.\"",opts:["no-brainer","easy-brain","quick-mind","simple-choice"],c:0,d:"Hard",ok:"\"No-brainer\" is a fixed idiom meaning an obviously correct or easy decision.",no:"\"Easy-brain/quick-mind/simple-choice\" are not real English idioms — the correct term is \"no-brainer.\""},
 {q:"\"This factory uses ___ technology to reduce waste.\"",opts:["state-of-the-art","state of art","state-of-art","high-state"],c:0,d:"Hard",ok:"\"State-of-the-art\" is the correctly hyphenated fixed idiom meaning the most advanced available technology.",no:"The other options are incorrect or incomplete versions of this fixed compound adjective."},
 {q:"\"We're trying to ___ the approval process so it takes less time.\"",opts:["streamline","widen","lengthen","complicate"],c:0,d:"Hard",ok:"\"Streamline\" means to make a process more efficient by removing unnecessary steps.",no:"\"Widen/lengthen/complicate\" have the opposite or unrelated meaning to making a process simpler and faster."},
 {q:"\"The company had to ___ after losing several major clients.\"",opts:["downsize","upsize","resize","oversize"],c:0,d:"Hard",ok:"\"Downsize\" means to reduce the size of a company, often by cutting staff.",no:"\"Upsize/resize/oversize\" don't convey the meaning of reducing a company's workforce or scale."},
 {q:"\"It's time to raise the ___ — our competitors are catching up.\"",opts:["bar","flag","level","standard"],c:0,d:"Medium",ok:"\"Raise the bar\" is a fixed idiom meaning to set a higher standard of performance.",no:"\"Flag/level/standard\" are not correct — the standard idiom uses \"bar.\""},
 {q:"\"This partnership is a ___ situation for both companies.\"",opts:["win-win","lose-lose","give-take","all-win"],c:0,d:"Medium",ok:"\"Win-win\" is a fixed idiom describing a situation that benefits everyone involved.",no:"\"Lose-lose/give-take/all-win\" are either opposite in meaning or not standard English idioms."},
 {q:"\"She's always on the ___ — nothing gets past her.\"",opts:["ball","point","edge","mark"],c:0,d:"Easy",ok:"\"On the ball\" is a fixed idiom meaning alert, competent, and attentive.",no:"\"Point/edge/mark\" are not correct — the standard idiom is \"on the ball.\""},
 {q:"\"Let's call it a ___; we can continue tomorrow.\"",opts:["day","night","end","stop"],c:0,d:"Easy",ok:"\"Call it a day\" is a fixed idiom meaning to stop working for the day.",no:"\"Night/end/stop\" are not correct — the standard idiom is \"call it a day.\""},
 {q:"Which idiom means \"to think creatively, beyond usual methods\"?",opts:["\"think outside the box\"","\"think inside the lines\"","\"think around the corner\"","\"think beyond the wall\""],c:0,d:"Hard",ok:"\"Think outside the box\" is the standard idiom for creative, unconventional thinking.",no:"The other options are not real English idioms."},
 {q:"Which idiom best describes cutting unnecessary steps to make a process faster?",opts:["\"streamline the process\"","\"widen the process\"","\"lengthen the process\"","\"complicate the process\""],c:0,d:"Hard",ok:"\"Streamline the process\" correctly describes making something more efficient by removing unnecessary steps.",no:"The other options describe the opposite of making a process more efficient."},
 {q:"\"We need everyone ___ before we launch, so let's have a quick alignment meeting.\"",opts:["on the same page","on the same table","on the same line","on the same book"],c:0,d:"Medium",ok:"\"On the same page\" is the fixed idiom meaning everyone shares the same understanding.",no:"\"Table/line/book\" are not correct — the standard idiom uses \"page.\""}
],
7:[
 {q:"\"Thank you for calling. How may I ___ you today?\"",opts:["assist","hear","answer","service"],c:0,d:"Easy",ok:"\"May I assist you\" is the standard polite phrase used to open a customer service interaction.",no:"\"Hear/answer/service\" don't fit this fixed opening phrase — the standard verb is \"assist.\""},
 {q:"\"I completely understand your frustration, and I ___ for the inconvenience.\"",opts:["apologize","sorry","regret","excuse"],c:0,d:"Easy",ok:"\"Apologize\" is the correct verb form following the subject \"I.\"",no:"\"Sorry\" is an adjective (needs \"am sorry\"), \"regret\" changes the intended meaning slightly, and \"excuse\" doesn't fit this structure."},
 {q:"\"Let me ___ your issue and find the best solution.\"",opts:["look into","look for","look at","look up"],c:0,d:"Easy",ok:"\"Look into\" means to investigate, which fits the context of resolving a customer's issue.",no:"\"Look for\" means to search, \"look at\" is less formal for investigating, and \"look up\" means to search for information — none fit as precisely as \"look into.\""},
 {q:"\"Could you please provide your order ___ so I can check the details?\"",opts:["number","name","code","id"],c:0,d:"Easy",ok:"\"Order number\" is the standard term used to identify a specific purchase.",no:"\"Name/code/id\" are less standard in this specific customer-service context — the fixed term is \"order number.\""},
 {q:"\"I'm sorry for the delay. Let me ___ this up for you right away.\"",opts:["speed","fast","quick","rush"],c:0,d:"Easy",ok:"\"Speed this up\" is the fixed phrasal verb meaning to make a process faster.",no:"\"Fast/quick/rush this up\" are not correct — the standard phrasal verb is \"speed up.\""},
 {q:"\"We value your feedback and will use it to ___ our service.\"",opts:["improve","increase","impress","inform"],c:0,d:"Medium",ok:"\"Improve\" fits the context of making service better based on feedback.",no:"\"Increase/impress/inform\" don't convey the idea of making something better in quality."},
 {q:"\"I understand this is frustrating, and I want to help resolve it as quickly as possible.\" — This is an example of which kind of customer-service phrase?",opts:["Empathy statement","Apology","Complaint","Warning"],c:0,d:"Medium",ok:"This phrase acknowledges the customer's feelings, which is the defining feature of an empathy statement.",no:"It's not an apology (no \"sorry\"), a complaint, or a warning — its purpose is to show understanding."},
 {q:"Which response best shows empathy to an angry customer?",opts:["\"Calm down, it's not a big deal.\"","\"I understand this is frustrating, and I want to help resolve it as quickly as possible.\"","\"That's not my department.\"","\"You should have read the instructions.\""],c:1,d:"Medium",ok:"This response acknowledges the customer's feelings and offers help, which is the professional standard.",no:"The other options are dismissive or blame the customer, which can escalate frustration."},
 {q:"\"If the issue cannot be resolved, I will ___ this to my supervisor.\"",opts:["escalate","elevate","upgrade","upload"],c:0,d:"Medium",ok:"\"Escalate\" is the standard customer-service term for passing an issue to a higher authority.",no:"\"Elevate/upgrade/upload\" are not the standard term used in this customer-service context."},
 {q:"\"We'd like to offer you a ___ on your next purchase as an apology for the inconvenience.\"",opts:["discount","refund","bill","charge"],c:0,d:"Medium",ok:"\"Discount\" fits the context of a goodwill gesture applied to a future purchase.",no:"\"Refund\" would apply to the current purchase, not a future one, and \"bill/charge\" don't convey a goodwill gesture."},
 {q:"\"Could you please hold while I ___ this information?\"",opts:["verify","occupy","fill","hold"],c:0,d:"Medium",ok:"\"Verify\" means to check that information is correct, which fits this customer-service context.",no:"\"Occupy/fill/hold\" don't convey the meaning of checking information for accuracy."},
 {q:"\"We appreciate your patience while we ___ this matter.\"",opts:["resolve","solve","fix","end"],c:0,d:"Medium",ok:"\"Resolve\" is the standard, more formal customer-service term for settling an issue.",no:"\"Solve/fix/end\" are understandable but less formal or precise in this professional customer-service context."},
 {q:"\"I'm going to transfer you to our ___ team, who can assist further.\"",opts:["technical","technic","technique","technically"],c:0,d:"Medium",ok:"\"Technical\" is the correct adjective form used before \"team.\"",no:"\"Technic/technique/technically\" are incorrect word forms — the adjective needed here is \"technical.\""},
 {q:"\"Your satisfaction is our top ___.\"",opts:["priority","target","goal","mission"],c:0,d:"Medium",ok:"\"Top priority\" is the standard fixed collocation used in customer-service language.",no:"\"Target/goal/mission\" are related in meaning but not the standard fixed phrase used here."},
