<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Quiz Prep — Sesi 11–15</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#16213e; --muted:#5d6a85; --line:#dfe4ef;
  --accent:#3651d4; --accent-soft:#e7ebfc;
  --ok:#17845c; --ok-soft:#e2f5ec; --bad:#c93a52; --bad-soft:#fce8ec;
  --hard:#c93a52; --mid:#b8790a; --easy:#17845c;
  --shadow:0 1px 2px rgba(22,33,62,.06),0 6px 20px rgba(22,33,62,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1526; --card:#182038; --ink:#e8ecf8; --muted:#9aa7c7; --line:#2a3453;
    --accent:#7d93ff; --accent-soft:#232d55;
    --ok:#4cc794; --ok-soft:#143a2d; --bad:#ff7a8f; --bad-soft:#40202a;
    --hard:#ff7a8f; --mid:#f0b34a; --easy:#4cc794;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.55;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.nav button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.nav button[aria-selected="true"]{background:var(--accent);color:#fff}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}

h1{font-size:26px;letter-spacing:-.02em;margin:6px 0 4px}
h2{font-size:20px;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:16px;margin:18px 0 8px}
.lead{color:var(--muted);margin:0 0 18px}

.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg-label{font-size:14px;color:var(--muted);margin-right:10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sess{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.sess:hover{border-color:var(--accent);transform:translateY(-2px)}
.sess .n{font-size:13px;color:var(--muted)}
.sess .t{font-weight:700;font-size:17px;line-height:1.3}
.sess .s{font-size:13.5px;color:var(--muted);flex:1}
.sess .b{font-size:13px;font-weight:600;color:var(--accent);margin-top:4px}
.sess.sim{border-style:dashed;background:var(--accent-soft)}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:14px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.badge{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:10px;border:1px solid currentColor}
.badge.h{color:var(--hard)} .badge.m{color:var(--mid)} .badge.e{color:var(--easy)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 16px;white-space:pre-line}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;border:1.5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb strong{display:block;margin-bottom:4px}
.fb p{margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;background:var(--accent);color:#fff;font-weight:700;padding:11px 20px;border-radius:12px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px}

.score{text-align:center;padding:10px 0 4px}
.score .big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.score .msg{color:var(--muted);margin-top:6px}
.dif{display:grid;gap:8px;margin:18px 0}
.dif div{display:grid;grid-template-columns:90px 1fr 56px;align-items:center;gap:10px;font-size:14px}
.dif .tr{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.dif .tr i{display:block;height:100%;border-radius:99px}
.wrong{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.wrong .wq{font-weight:600;margin-bottom:6px;white-space:pre-line}
.wrong .you{color:var(--bad)} .wrong .right{color:var(--ok)}
.wrong p{margin:4px 0;font-size:14.5px}

.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtabs button{border:1.5px solid var(--line);background:var(--card);padding:7px 13px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cs h2{margin-top:4px}
.cs h3{color:var(--accent)}
.cs table{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cs th,.cs td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cs th{background:var(--accent-soft);font-weight:700}
.cs tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.cs ul{margin:6px 0 10px;padding-left:20px}
.cs li{margin:3px 0}
.tip{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14.5px}
.warn{background:var(--bad-soft);border-left:4px solid var(--bad);padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14.5px}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.wc{columns:2 220px;column-gap:24px}
.wc div{break-inside:avoid;padding:2px 0;font-size:14.5px}

@media print{
  .top,.subtabs,.actions{display:none}
  body{background:#fff;color:#000}
  .cs table{font-size:11pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){
  .q{font-size:17.5px}
  .dif div{grid-template-columns:70px 1fr 50px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">English Quiz Prep<small>General Business English · Sesi 11–15</small></div>
    <div class="nav" role="tablist" aria-label="Menu">
      <button role="tab" id="tab-quiz" aria-selected="true" onclick="go('quiz')">Quiz</button>
      <button role="tab" id="tab-cheat" aria-selected="false" onclick="go('cheat')">Cheat sheet</button>
    </div>
  </div>
</header>
<main id="app"></main>

<script>
/* ============ DATA ============ */
// Q(difficulty, question, correctAnswer, [3 wrong answers], explanation)  d: h=sulit, m=sedang, e=mudah
const Q=(d,q,a,w,e)=>({d,q,a,w,e});

const S1=[
Q("h","Which sentence is grammatically CORRECT?","I suggest attending the seminar.",["I suggest you to attend the seminar.","I suggest to attend the seminar.","I suggest you attending the seminar."],"'Suggest' diikuti gerund (V-ing) atau that-clause ('I suggest that you attend'). TIDAK pernah diikuti infinitive (to + V)."),
Q("h","You write a formal email to a client. Which sentence is the MOST appropriate?","Kindly confirm your attendance at your earliest convenience.",["Confirm your attendance.","Don't forget to confirm your attendance!","You must confirm now."],"'Kindly' adalah bentuk paling formal, cocok untuk email/surat resmi. Imperative telanjang ('Confirm...') terdengar kasar."),
Q("h","Which version is best for a FORMAL compliance document?","Do not share this information with external parties.",["Don't share this info with outsiders.","No sharing!","Not share this information."],"Di dokumen formal pakai bentuk lengkap 'Do not', bukan singkatan 'Don't'."),
Q("h","You want to give advice to a senior manager. Which sounds the MOST respectful?","It might be worth reconsidering the strategy.",["You should reconsider your strategy.","Reconsider your strategy.","You must reconsider your strategy."],"Dengan atasan, hindari 'should/must' yang langsung. Pakai framing lebih lembut seperti 'It might be worth...'."),
Q("h","Which sentence is an IMPERATIVE (a command), NOT advice?","Submit the expense report.",["We should hire a new IT consultant.","How about offering them a 10% discount?","I highly recommend postponing the launch."],"Imperative = base verb di awal, subjek 'you' tidak disebut. Tiga pilihan lain adalah bentuk saran (advice)."),
Q("h","I strongly advise ___ the legal team first.","you to consult",["you consult","consulting you","to you consult"],"Pola: I strongly advise + [subject] + to + base verb."),
Q("h","How about ___ them a 10% discount?","offering",["offer","to offer","offered"],"Pola: How about + V-ing. Sedangkan 'Why don't we + base verb' (contoh: Why don't we offer them a discount?)."),
Q("h","Which sentence has an ERROR?","Please to submit the form.",["Please review the attached document.","Kindly sign at the bottom.","Do not forward this email."],"Setelah Please / Kindly langsung base verb, TANPA 'to'. Yang benar: 'Please submit the form.'"),
Q("h","Which statement about advice vs. imperatives is TRUE?","Advice leaves the listener free to accept or decline; an imperative expects compliance.",["Imperatives always need a stated subject like I or We.","Advice is used mainly in SOPs and safety warnings.","Imperatives are the softest way to give an instruction."],"Imperative = perintah langsung (pendengar diharapkan patuh). Advice = saran (pendengar bebas menerima atau menolak)."),
Q("h","Which form suggests SHARED ownership of a task?","Let's finalize the file before end of day.",["Please finalize the file before end of day.","Kindly finalize the file before end of day.","Finalize the file before end of day."],"'Let's' = inclusive imperative. Pembicara ikut terlibat, jadi terasa kerja sama tim."),

Q("m","Which form is the MOST suitable for a written SOP or technical manual?","Affirmative imperative: 'Click the Save button.'",["Advice: 'You might want to click Save.'","Question: 'Why don't you click Save?'","Inclusive: 'Let's maybe click Save.'"],"SOP butuh instruksi jelas dan langsung, jadi pakai affirmative imperative."),
Q("m","Which sentence uses the sequence connector with correct punctuation?","After that, close the cover.",["After that close the cover.","After, that close the cover.","After that; close the cover."],"Selalu pakai koma (,) setelah sequence connector: First, / Next, / Then, / After that, / Finally,"),
Q("m","In an imperative sentence, the subject is...","the implied 'you' (not spoken or written)",["'I' (always spoken)","'we' (always spoken)","'they' (always written)"],"Subjek imperative adalah 'you' yang tersirat sehingga tidak diucapkan atau ditulis."),
Q("m","What is the main RISK of using imperatives without care?","They can sound blunt or rude.",["They sound weak and indecisive.","They are grammatically wrong.","They cannot be used in emails."],"Imperative yang salah tempat terdengar kasar. Sebaliknya, advice yang salah tempat bisa terdengar lemah/ragu."),
Q("m","Complete: 'Why don't we ___ a follow-up call?'","schedule",["scheduling","to schedule","scheduled"],"Why don't we/you + base verb."),
Q("m","Which is a NEGATIVE imperative?","Do not access restricted files.",["Please access the files.","Let's access the files.","You should access the files."],"Negative imperative: Do not / Don't + base verb."),
Q("m","Manager: 'We need a new strategy for next month.'  Staff: '___ brainstorm some ideas together after lunch.'","Let's",["Please","You","We"],"'Let's' = ajakan inklusif ('mari kita'). Staff mengajak tim, bukan memerintah atasan."),
Q("m","Which is the MOST blunt form?","Send the file.",["Please send the file.","Kindly send the file at your earliest convenience.","Let's send the file together."],"Urutan sopan: blunt < Please < Kindly. 'Let's' bersifat kolaboratif."),
Q("m","In the 'Instant-Leave Notebook' SOP, why must you NOT use a pencil?","HR will reject the magic.",["The manager will notice.","A random employee will go to Bali.","The notebook will explode."],"Dari warning SOP: 'Do not use a pencil, or HR will reject the magic.' (Misspell nama yang bikin karyawan lain ke Bali.)"),
Q("m","Which is the correct order to print a document?","First, open the file. Next, click the print icon. Finally, press OK.",["Finally, open the file. Next, click the print icon. First, press OK.","Next, open the file. First, click the print icon. Finally, press OK.","Then, press OK. First, click the print icon. Finally, open the file."],"First = awal, Next/Then/After that = tengah, Finally = langkah terakhir."),

Q("e","___ the computer. (start the power)","Turn on",["Unplug","Sign","Submit"],"Turn on / Switch on = menyalakan."),
Q("e","___ your password. (write it on the keyboard)","Enter",["Unplug","Switch off","Plug in"],"Enter / Type = mengetik/memasukkan."),
Q("e","___ the cable. (disconnect from electricity)","Unplug",["Plug in","Enter","Press"],"Unplug = mencabut dari listrik. Plug in = mencolokkan."),
Q("e","'Fill out the leave form' means...","Complete the form.",["Sign the form.","Delete the form.","Print the form."],"Fill out / fill in = melengkapi/mengisi formulir."),
Q("e","'Sign' means...","Write your signature.",["Give the document to the boss.","Look for errors.","Connect to electricity."],"Sign = tanda tangan. Submit = menyerahkan. Check = memeriksa."),
Q("e","'Submit the report' means...","Give the report to the boss.",["Write your signature on it.","Look for spelling errors.","Turn it off."],"Submit / Turn in = menyerahkan dokumen."),
Q("e","Mary: '___ touch it! Unplug the cable now.'","Don't",["Not","No","Doesn't"],"Negative imperative: Don't + base verb."),
Q("e","___, turn on the machine. (the start of a process)","First",["Finally","Next","After that"],"First = langkah pertama."),
Q("e","___, press the green button. (the last step)","Finally",["First","Next","Then"],"Finally = langkah terakhir."),
Q("e","Which word makes a request polite?","Please",["Now","Must","Don't"],"Please / Kindly melembutkan perintah.")
];

const S2=[
Q("h","I am working ___ 5 PM. (I work now, later, and stop at 5.)","until",["by","in","from"],"UNTIL = durasi, melakukan sesuatu terus-menerus sampai waktu tersebut."),
Q("h","Please submit the report ___ Friday. (Wed, Thu or Fri is OK, but NOT Saturday.)","by",["until","in","from"],"BY = tenggat (deadline): paling lambat pada waktu itu. Bisa selesai lebih awal."),
Q("h","Yesterday, I ___ leave early.","had to",["must","musted","have to"],"'Must' tidak punya bentuk past. Untuk kewajiban di masa lalu pakai 'had to'."),
Q("h","Tomorrow is Sunday. I ___ wake up early. I can sleep in.","don't have to",["mustn't","must","had to"],"Don't have to = tidak wajib (bebas memilih). Mustn't = dilarang. Keduanya berlawanan!"),
Q("h","You ___ touch that wire. It is dangerous!","mustn't",["don't have to","don't need to","have to"],"Mustn't = larangan keras (prohibited)."),
Q("h","Laboratory rule: Safety gloves ___ be worn by all personnel at all times.","must",["should","might","don't need to"],"Aturan tertulis resmi memakai 'must'. 'Should' hanya saran."),
Q("h","You cheated in the exam and an innocent student was blamed. You ___ confess to the principal.","ought to",["don't need to","mustn't","can't"],"Ought to = kewajiban moral / norma etika."),
Q("h","In England, tourists ___ drive on the left because it is the national traffic law.","have to",["should","don't have to","might"],"Have to = kewajiban dari pihak luar (hukum, aturan orang lain)."),
Q("h","Which sentence has an INCORRECT form?","She musted finish the report yesterday.",["I had to leave early yesterday.","She doesn't have to cook tonight.","You mustn't smoke in the hospital."],"Tidak ada 'musted'. Past dari must / have to adalah 'had to'."),
Q("h","Manager: 'I need it by Monday.'  Which is the most POLITE negotiation reply?","I'm sorry, I have 3 meetings today. Can I submit it by Wednesday?",["No. I can't do Monday.","Later.","That deadline is unfair."],"Formula sopan: minta maaf + alasan singkat + tawarkan deadline baru yang spesifik."),

Q("m","'EOW' means...","by Friday afternoon (end of week)",["by the end of the day","as soon as the workday starts","exactly at that time"],"EOD = end of day. EOW = end of week."),
Q("m","'First thing in the morning' means...","as soon as the workday starts",["at midnight","after lunch","exactly at 9 PM"],"Contoh: 'Send it first thing tomorrow.'"),
Q("m","The meeting starts at 9 ___. (exactly)","on the dot",["ahead of schedule","running behind","overdue"],"On the dot = tepat pada waktu itu."),
Q("m","Project Manager: 'We finished the task faster than planned. We are ___.'","ahead of schedule",["behind schedule","running behind","overdue"],"Ahead of schedule = lebih cepat dari rencana."),
Q("m","Please send the email ___ the meeting. (earlier than the meeting)","before",["until","during","after"],"BEFORE = lebih awal dari suatu titik waktu."),
Q("m","'Should' and 'ought to' are used for...","advice and moral guidance",["strict written rules","prohibitions","no obligation"],"Should/ought to = saran & moral. Aturan tegas = must / have to."),
Q("m","'Need to' expresses...","necessity to reach a goal",["prohibition","past obligation","no choice at all"],"Need to = perlu dilakukan untuk mencapai tujuan (kekuatan sekitar 80%)."),
Q("m","'This Friday' means...","the Friday of the current week",["the Friday of next week","every Friday","last Friday"],"This + hari = hari itu di minggu berjalan."),
Q("m","Which sentence uses a future time marker correctly?","I will finish in 2 days.",["I will finish at 2 days.","I will finish next 2 days.","I will finish after 2 day."],"In + angka + satuan waktu = berapa lama dari sekarang."),
Q("m","Which is NOT a way to ASK about the deadline?","I need it by Monday.",["When is it due?","What is the deadline?","By when should I submit this?"],"'I need it by Monday' adalah menetapkan deadline (dilakukan bos)."),

Q("e","A 'deadline' is...","the last time you can finish a task",["extra time","a reminder message","a late report"],"Deadline = batas waktu terakhir."),
Q("e","An 'extension' is...","extra time given beyond the deadline",["the final time","a message to remember","a finished task"],"Contoh: 'Can I ask for an extension?'"),
Q("e","'Overdue' means...","late; the deadline has already passed",["very important","finished on time","not yet started"],"Contoh: 'This bill is overdue.'"),
Q("e","'ASAP' stands for...","As Soon As Possible",["At Six A.M. Please","All Staff At Present","As Simple As Possible"],"ASAP = secepat mungkin."),
Q("e","Do NOT say 'next day'. For the day after today, say...","tomorrow",["yesterday","this week","last day"],"Hari setelah hari ini = tomorrow."),
Q("e","The shop is open ___ 9 PM.","until",["by","in","on"],"Until = durasi terus-menerus sampai jam 9."),
Q("e","Can you complete this ___ next week?","by",["until","at","on"],"By = deadline (paling lambat minggu depan)."),
Q("e","Staff A: 'I feel very dizzy today.'  Staff B: 'You ___ go to the clinic and rest.'","should",["shouldn't","had to","mustn't"],"Should = saran."),
Q("e","'Pending' means...","not yet finished",["finished","late","urgent"],"Status kantor: Pending = belum selesai, In progress = sedang dikerjakan, Completed = selesai."),
Q("e","Manager: 'Tomorrow is a national holiday. You ___ come to the office.'","don't have to",["mustn't","shouldn't","didn't"],"Don't have to = tidak wajib (boleh libur).")
];

const S3=[
Q("h","What is the past simple of 'refer'?","referred",["refered","referd","referrd"],"Aturan 4: vokal pendek + konsonan → konsonan digandakan + -ed (stop→stopped, plan→planned, refer→referred)."),
Q("h","What is the past simple of 'carry'?","carried",["carryed","carrid","carryd"],"Aturan 3: konsonan + Y → ubah Y jadi I lalu tambah -ed (copy→copied, reply→replied)."),
Q("h","Which regular verb does NOT end with an extra syllable (/id/ sound)?","Persuaded",["Submitted","Guided","Ricocheted"],"/id/ hanya muncul jika kata dasar berakhir bunyi T atau D. 'Persuade' berakhir bunyi vokal, jadi persuaded = /d/."),
Q("h","Which regular verb ends with a /t/ sound?","Fixed",["Closed","Filed","Answered"],"Fix berakhir bunyi /s/ (unvoiced) → /t/. Closed (/z/), filed (/l/), answered (/r/) → /d/."),
Q("h","Which sentence is correct?","She did not check the document.",["She did not checked the document.","She not checked the document.","She didn't checking the document."],"Negatif: did not + base verb. Hanya 'did' yang menunjukkan past."),
Q("h","Which is the correct question?","Did she check the document?",["Did she checked the document?","Does she checked the document?","Did she checking the document?"],"Question: Did + subject + base verb."),
Q("h","According to the module, My Chemical Romance was formed as a direct psychological response to...","The September 11 attacks",["The Vietnam War","The 2008 Financial Crisis","The Bali bombing"],"Gerard Way menyaksikan langsung serangan 9/11. Band dibentuk sebagai coping mechanism dan misi membuat seni yang 'menyelamatkan nyawa'."),
Q("h","In 'Welcome to the Black Parade', the marching band plays the role of a ___ (a guide of souls to the afterlife).","psychopomp",["mentor","patient","volta"],"Psychopomp = pemandu jiwa. Parade menyamarkan kematian dalam wujud parade masa kecil. Sang ayah adalah Mentor."),

1:`<h2>Session 1 · SOP, imperatives & advice</h2>
<h3>Verbs for equipment & documents</h3>
<div class="tw"><table><tr><th>Verb</th><th>Meaning</th><th>Example</th></tr>
<tr><td>Turn on / Switch on</td><td>Start the power</td><td>Turn on the computer.</td></tr>
<tr><td>Turn off / Switch off</td><td>Stop the power</td><td>Turn off the lights.</td></tr>
<tr><td>Press / Push</td><td>Use finger on a button</td><td>Press the red button.</td></tr>
<tr><td>Click</td><td>Use the mouse</td><td>Click the Start icon.</td></tr>
<tr><td>Enter / Type</td><td>Write on keyboard</td><td>Enter your password.</td></tr>
<tr><td>Plug in / Unplug</td><td>Connect / disconnect electricity</td><td>Unplug the cable.</td></tr>
<tr><td>Select / Choose</td><td>Pick an option</td><td>Select Print.</td></tr>
<tr><td>Fill out / Fill in</td><td>Complete a form</td><td>Fill out the leave form.</td></tr>
<tr><td>Sign</td><td>Write your signature</td><td>Sign at the bottom.</td></tr>
<tr><td>Submit / Turn in</td><td>Give the document to the boss</td><td>Submit the report.</td></tr>
<tr><td>Check</td><td>Look for errors</td><td>Check the spelling.</td></tr></table></div>
<h3>4 imperative patterns</h3>
<div class="tw"><table><tr><th>Type</th><th>Pattern</th><th>Example</th></tr>
<tr><td>Affirmative</td><td>Base verb + object</td><td>Submit the expense report.</td></tr>
<tr><td>Negative</td><td>Do not / Don't + base verb</td><td>Do not forward this email.</td></tr>
<tr><td>Polite</td><td>Please / Kindly + base verb</td><td>Please review the document.</td></tr>
<tr><td>Inclusive</td><td>Let's + base verb</td><td>Let's brainstorm ideas.</td></tr></table></div>
<div class="tip"><b>Politeness ladder:</b> Send the file. (blunt) → Please send the file. → Kindly send the file at your earliest convenience. (formal). <b>Let's</b> = kolaboratif.</div>
<div class="tip">Subjek imperative = <b>you</b> (tidak disebut). Formal writing: pakai <b>Do not</b>, bukan Don't.</div>
<h3>Sequence connectors (selalu diikuti koma)</h3>
<p><b>First,</b> (awal) → <b>Next, / Then, / After that,</b> (tengah) → <b>Finally,</b> (akhir)</p>
<h3>Giving advice</h3>
<div class="tw"><table><tr><th>Level</th><th>Pattern</th><th>Example</th></tr>
<tr><td>Standard</td><td>should / ought to + base verb</td><td>We should hire a consultant.</td></tr>
<tr><td>Soft</td><td>could / might want to + base verb; It would be a good idea to + base verb</td><td>You might want to double-check the figures.</td></tr>
<tr><td>Strong</td><td>I (highly) recommend / suggest + V-ing; I strongly advise + person + to + base verb</td><td>I highly recommend postponing the launch.</td></tr>
<tr><td>Question</td><td>Why don't we + base verb? / How about + V-ing?</td><td>How about offering a 10% discount?</td></tr></table></div>
<div class="warn"><b>Jebakan:</b> ❌ I suggest you <u>to</u> attend → ✅ I suggest attending / I suggest that you attend. ❌ Please <u>to</u> send → ✅ Please send. Dengan atasan, hindari You should…; pakai It might be worth…</div>
<div class="tip"><b>Imperative vs advice:</b> Imperative = perintah, pendengar diharapkan patuh (SOP, delegasi, peringatan). Advice = saran, pendengar bebas menerima/menolak (rapat, review, konsultasi).</div>`,

2:`<h2>Session 2 · Deadlines & modals</h2>
<h3>Vocabulary</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>Deadline / Due date</td><td>Batas waktu terakhir</td></tr>
<tr><td>Submit / Turn in</td><td>Menyerahkan pekerjaan</td></tr>
<tr><td>Delay</td><td>Membuat terlambat</td></tr>
<tr><td>Extension</td><td>Tambahan waktu setelah deadline</td></tr>
<tr><td>Reminder</td><td>Pesan pengingat</td></tr>
<tr><td>Urgent / ASAP</td><td>Sangat penting / As Soon As Possible</td></tr>
<tr><td>Overdue / On time</td><td>Terlambat (deadline lewat) / tepat waktu</td></tr>
<tr><td>Pending / In progress / Completed</td><td>Belum dikerjakan / sedang dikerjakan / selesai</td></tr>
<tr><td>EOD / EOW</td><td>End of day / End of week (Jumat sore)</td></tr>
<tr><td>First thing in the morning</td><td>Begitu jam kerja dimulai</td></tr>
<tr><td>On the dot</td><td>Tepat pada waktu itu</td></tr>
<tr><td>Running behind / Behind schedule</td><td>Terlambat dari rencana</td></tr>
<tr><td>Ahead of schedule</td><td>Lebih cepat dari rencana</td></tr></table></div>
<h3>Future time markers</h3>
<ul><li><b>tomorrow</b> (bukan ‘next day’)</li><li><b>next</b> + week / Monday / month / year</li><li><b>this</b> + day = hari itu di minggu ini</li><li><b>in</b> + number + unit: in 10 minutes, in 2 days</li></ul>
<h3>BY vs UNTIL vs BEFORE</h3>
<div class="tw"><table><tr><th></th><th>Meaning</th><th>Use</th><th>Example</th></tr>
<tr><td><b>BY</b></td><td>Paling lambat pada waktu itu</td><td>Deadline</td><td>Submit the report by Friday.</td></tr>
<tr><td><b>UNTIL</b></td><td>Terus-menerus sampai waktu itu</td><td>Duration</td><td>I work until 5 PM.</td></tr>
<tr><td><b>BEFORE</b></td><td>Lebih awal dari</td><td>Ahead of a point</td><td>Finish before lunch.</td></tr></table></div>
<h3>Modals of obligation</h3>
<div class="tw"><table><tr><th>Modal</th><th>Meaning</th><th>Example</th></tr>
<tr><td>must</td><td>Wajib: dari diri sendiri / aturan tertulis resmi (100%)</td><td>Passengers must fasten seatbelts.</td></tr>
<tr><td>have to / has to</td><td>Wajib: dari luar (aturan orang lain, keadaan)</td><td>I have to wear a uniform.</td></tr>
<tr><td>had to</td><td>Past dari must DAN have to</td><td>I had to leave early.</td></tr>
<tr><td>need to</td><td>Perlu untuk mencapai tujuan (~80%)</td><td>We need to buy groceries.</td></tr>
<tr><td>should / ought to</td><td>Saran / kewajiban moral (50–70%)</td><td>You should apologize.</td></tr>
<tr><td>mustn't</td><td>DILARANG</td><td>You mustn't touch the wire.</td></tr>
<tr><td>don't have to / don't need to</td><td>TIDAK WAJIB (bebas)</td><td>You don't have to come.</td></tr></table></div>
<div class="warn"><b>Jebakan besar:</b> mustn't ≠ don't have to (artinya berlawanan). Tidak ada ‘musted’ → pakai <b>had to</b>. Aturan tertulis/K3 → must. Saran → should. Moral → ought to.</div>
<h3>Negotiating a deadline politely</h3>
<p>Minta maaf → beri alasan singkat → tawarkan deadline baru → ucapkan terima kasih.<br>“I'm sorry, but I have 3 meetings today. Can I submit it by Wednesday? Thank you for understanding.”</p>
<p><b>Ask:</b> When is it due? · What is the deadline? · By when should I submit this?<br><b>Set:</b> I need it by Monday. · Please submit ASAP.<br><b>Negotiate:</b> Can I have more time? · Is Tuesday okay?</p>`,

<h3>4 spelling rules for -ed</h3>
<div class="tw"><table><tr><th>Rule</th><th>What to do</th><th>Examples</th></tr>
<tr><td>1. Most verbs</td><td>+ ed</td><td>check → checked, work → worked</td></tr>
<tr><td>2. Ends in -e</td><td>+ d</td><td>file → filed, use → used, decide → decided</td></tr>
<tr><td>3. Consonant + y</td><td>y → ied</td><td>copy → copied, reply → replied, carry → carried, study → studied</td></tr>
<tr><td>4. Short vowel + consonant</td><td>double consonant + ed</td><td>stop → stopped, plan → planned, refer → referred, commit → committed</td></tr></table></div>
<h3>Past time markers</h3>
<p>yesterday · last night/week/month/year · 5 minutes ago · in 2021</p>
<h3>Negative & question</h3>
<p>Positive: She checked the document.<br>Negative: She <b>did not check</b> the document.<br>Question: <b>Did</b> she <b>check</b> the document?<br>❌ Did she checked? → ✅ Did she check? (hanya <b>did</b> yang menandai past)</p>
<h3>Pronunciation of -ed</h3>
<div class="tw"><table><tr><th>Sound</th><th>When</th><th>Examples</th></tr>
<tr><td><b>/t/</b></td><td>Setelah unvoiced: /k/ /p/ /s/ /ʃ/ /tʃ/ /f/</td><td>worked, checked, finished, asked, stopped, locked, fixed</td></tr>
<tr><td><b>/d/</b></td><td>Setelah voiced (getar): /l/ /n/ /r/ /g/ /v/ /z/ dan vokal</td><td>called, signed, filed, answered, used, persuaded</td></tr>
<tr><td><b>/id/</b></td><td>Kata dasar berakhir T atau D (suku kata tambahan)</td><td>started, waited, needed, decided, visited, ended, printed, submitted</td></tr></table></div>
<div class="tip"><b>Cek cepat:</b> berakhir T/D → /id/. Tenggorokan bergetar → /d/. Tidak bergetar → /t/. (Slide menaruh ‘printed’ di kolom /t/, itu keliru; yang benar /id/.)</div>
<h3>My Chemical Romance: fakta penting</h3>
<ul>
<li><b>Asal:</b> dibentuk Gerard Way sebagai respon psikologis atas serangan <b>9/11</b>, sebagai coping mechanism dan misi ‘save lives’.</li>
<li><b>Label ‘Emo’:</b> ditolak MCR (dianggap reduktif). Mereka band alternative/punk rock tentang <b>survival</b>.</li>
<li><b>Voice of the marginalized (subaltern):</b> ‘the broken, the beaten, and the damned’.</li>
<li><b>Three Cheers for Sweet Revenge (2004):</b> album konsep, pria terpisah dari kekasihnya oleh kematian; tema duka & katarsis.</li>
<li><b>Welcome to the Black Parade:</b> tokoh <b>The Patient</b> (pasien terminal); kematian hadir sebagai prosesi/parade dari kenangan masa kecil terindah. Struktur: Prologue (piano) → The Memory → The Crossing → The Defiance.</li>
<li><b>Arketipe:</b> ayah = <b>Mentor</b> (Jungian); parade = <b>Psychopomp</b> (pemandu jiwa).</li>
<li><b>Metafora:</b> black/shadows = sedih & tak dikenal; ‘scars’ = trauma jadi tanda ketangguhan; ‘We'll carry on’ = anthem kolektif.</li>
<li><b>Musik:</b> intro piano <b>11 nada</b> (lonceng duka); modulasi <b>G major → A major</b> (dari refleksi sedih ke perlawanan).</li>
<li><b>Danger Days (2010):</b> perlawanan sosial melawan <b>Better Living Industries</b> (keserakahan korporasi, konsumerisme, konformitas).</li>
<li><b>Dampak sosial:</b> mendestigmatisasi kesehatan mental (Gerard Way terbuka & mendorong fans mencari bantuan); fanbase <b>MCRmy</b> = ‘chosen family’; teatrikal: makeup, androgini, world building.</li>
<li><b>Warm-up songs:</b> I'm Not Okay (I Promise) · Welcome to the Black Parade · Disenchanted.</li>
</ul>`,

4:`<h2>Session 4 · Irregular verbs, negative, questions & history</h2>
<h3>Office 12</h3>
<div class="tw"><table><tr><th>V1</th><th>V2</th><th>V1</th><th>V2</th><th>V1</th><th>V2</th></tr>
<tr><td>go</td><td>went</td><td>do</td><td>did</td><td>have</td><td>had</td></tr>
<tr><td>send</td><td>sent</td><td>meet</td><td>met</td><td>buy</td><td>bought</td></tr>
<tr><td>write</td><td>wrote</td><td>take</td><td>took</td><td>come</td><td>came</td></tr>
<tr><td>get</td><td>got</td><td>see</td><td>saw</td><td>pay</td><td>paid</td></tr></table></div>
<h3>Patterns</h3>
<ul><li>Vokal berubah: write → wrote, give → gave, take → took</li><li>-ought / -aught: buy → bought, bring → brought, think → thought, catch → caught, seek → sought</li><li>V1 = V2: put, cut, set, hit, hurt, cost, quit, spread, burst, split, cast</li><li>Beda total: go → went, be → was/were</li></ul>
<h3>Error-hunt verbs (hafalkan!)</h3>
<div class="wc">
<div>come → came</div><div>bring → brought</div><div>drink → drank</div><div>feel → felt</div><div>run → ran</div><div>leave → left</div><div>know → knew</div><div>throw → threw</div>
<div>fly → flew</div><div>find → found</div><div>sleep → slept</div><div>wake → woke</div><div>eat → ate</div><div>spend → spent</div><div>lose → lost</div><div>weep → wept</div>
<div>hear → heard</div><div>tell → told</div><div>lead → led</div><div>forgive → forgave</div><div>shake → shook</div><div>mean → meant</div><div>make → made</div><div>blow → blew</div>
<div>draw → drew</div><div>fall → fell</div><div>break → broke</div><div>sweep → swept</div><div>rise → rose</div><div>build → built</div><div>creep → crept</div><div>strike → struck</div>
<div>hide → hid</div><div>lend → lent</div><div>say → said</div><div>give → gave</div><div>withdraw → withdrew</div><div>speak → spoke</div><div>choose → chose</div><div>bite → bit</div>
<div>lay → laid</div><div>sing → sang</div><div>hold → held</div><div>grow → grew</div><div>bleed → bled</div><div>swing → swung</div><div>hang → hung</div><div>stick → stuck</div>
<div>sell → sold</div><div>steal → stole</div><div>forbid → forbade</div><div>spin → spun</div><div>bend → bent</div><div>sink → sank</div><div>swim → swam</div><div>win → won</div>
<div>fight → fought</div><div>swear → swore</div><div>drive → drove</div><div>begin → began</div><div>freeze → froze</div><div>overcome → overcame</div><div>spring → sprang</div><div>catch → caught</div>
</div>
<div class="warn"><b>Jebakan:</b> hang → hung (benda), <b>hanged</b> hanya untuk hukuman gantung. ‘Stay’ → stayed (bukan staied). Stolen, gone, done, seen, written = past participle (bukan V2).</div>
<h3>Negative & question</h3>
<p><b>Negative:</b> Subject + didn't + <b>V1</b> → I didn't go. (❌ I didn't went)<br><b>Yes/No:</b> Did + subject + V1? → Did you go? Yes, I did. / No, I didn't.<br><b>WH:</b> What / Where / When / Who + did + subject + V1? → Where did you go? (❌ Where did you went?)</p>
<h3>History of English (timeline)</h3>
<div class="tw"><table><tr><th>Period</th><th>Key facts</th></tr>
<tr><td>5th century</td><td>Tiga suku Jermanik: <b>Angles</b>, <b>Saxons</b>, <b>Jutes</b>. ‘England’ ← ‘Engla land’ (tanah Angles). Celts terdesak ke Wales & Skotlandia.</td></tr>
<tr><td>Old English (450–1100)</td><td>Kosakata dasar Jermanik (water, strong, be). Epik <b>Beowulf</b>. Awalnya tulisan runik, lalu alfabet Latin karena pengaruh agama Kristen.</td></tr>
<tr><td>1066</td><td><b>Norman Conquest</b>, William the Conqueror. Prancis = bahasa kerajaan/hukum. &gt;10.000 kata Prancis (crown, castle, beef, army).</td></tr>
<tr><td>Middle English (1100–1500)</td><td>Infleksi hilang, tata bahasa lebih sederhana, urutan kata S-V-O. <b>Chaucer</b> (Canterbury Tales) = ‘Father of English Literature’, dialek London.</td></tr>
<tr><td>15th century</td><td>Mesin cetak <b>William Caxton</b> menyeragamkan ejaan & grammar.</td></tr>
<tr><td>Early Modern (1500–1800)</td><td><b>Great Vowel Shift</b>. <b>Shakespeare</b>: ≥1.700 kata baru (lonely, swagger, manager). 1604: kamus Inggris pertama.</td></tr>
<tr><td>18th century</td><td>Revolusi Industri → ribuan kosakata teknis & sains.</td></tr>
<tr><td>19th–20th century</td><td>Imperium Britania menyebarkan Inggris ke Amerika, Australia, India, Afrika → bahasa global.</td></tr></table></div>
<div class="tip">Kenapa irregular verbs ada: kata yang paling sering dipakai (go, do, have, see, get) mempertahankan bentuk lama Old English. Sekitar 180–200 irregular verbs umum dipakai.</div>`,

5:`<h2>Session 5 · Recount text & text types</h2>
<h3>Recount text</h3>
<p>Menceritakan kembali kejadian/pengalaman masa lalu <b>secara berurutan</b>. Di bisnis: memberi tahu atasan tentang perjalanan, mendokumentasikan site visit, melaporkan progres harian (logbook).</p>
<div class="tw"><table><tr><th>Part</th><th>Isi</th><th>Contoh</th></tr>
<tr><td>1. Orientation</td><td>Pengantar: <b>who, when, where</b></td><td>Last month, my colleague Sarah and I went on a business trip to Karawang.</td></tr>
<tr><td>2. Series of events</td><td>Isi: kejadian berurutan, <b>V2</b>, connector First / Then / Next / After that / Finally</td><td>We arrived early. Then we did a survey. Finally, we paid the vendor.</td></tr>
<tr><td>3. Re-orientation</td><td>Penutup: kesimpulan + komentar pribadi</td><td>Overall, the trip was successful. I felt satisfied.</td></tr></table></div>
<ul><li>Past tense secara konsisten</li><li>Fokus pada partisipan tertentu (I, We)</li><li><b>Recount vs Narrative:</b> recount = urutan kejadian natural, tanpa konflik rumit. Narrative = ada <b>konflik + resolusi</b>, tujuan menghibur.</li></ul>
<h3>Text types</h3>
<div class="tw"><table><tr><th>Type</th><th>Purpose</th><th>Language features</th></tr>
<tr><td>Narrative</td><td>Menghibur, kisah dengan konflik</td><td>Past tense, action verbs, Once upon a time / One day, konflik + resolusi</td></tr>
<tr><td>Descriptive</td><td>Menggambarkan satu subjek spesifik (my pet cat)</td><td>Simple present, banyak adjective</td></tr>
<tr><td>Report</td><td>Informasi umum & faktual (jenis kucing pada umumnya)</td><td>Simple present, istilah ilmiah, objektif</td></tr>
<tr><td>Recount</td><td>Menceritakan kembali pengalaman lampau</td><td>Past tense, temporal sequence, I / We</td></tr>
<tr><td>Procedure</td><td>Langkah demi langkah</td><td>Imperative, present tense, action verbs (cut, boil, mix), first/second/finally</td></tr>
<tr><td>Analytical exposition</td><td>Meyakinkan bahwa topik penting</td><td>Present tense, argumen logis, ditutup <b>reiteration</b></td></tr>
<tr><td>Hortatory exposition</td><td>Membujuk bahwa sesuatu seharusnya/tidak dilakukan</td><td>Present tense, opini, ditutup <b>recommendation (should)</b></td></tr>
<tr><td>Explanation</td><td>Menjelaskan why & how suatu fenomena terjadi</td><td>Present tense, <b>passive voice</b>, causal conjunctions, chronological connectives</td></tr>
<tr><td>Discussion</td><td>Isu dari dua sudut pandang (pro & kontra), objektif</td><td>Argumen dua sisi + kesimpulan</td></tr>
<tr><td>News item</td><td>Peristiwa hari itu yang <i>newsworthy</i></td><td>Berita ringkas & faktual</td></tr>
<tr><td>Review</td><td>Evaluasi buku, film, produk, layanan</td><td>Opini + kritik</td></tr></table></div>
<h3>Teks hibrida</h3>
<div class="tip">Teks otentik jarang 100% satu jenis (rhetorical modes / macrogenre). Jenis ditentukan oleh <b>tujuan dominan</b>. Text types diajarkan satu per satu sebagai <b>scaffolding</b>, alat bukan sangkar.</div>
<h3>Contoh verba dari cerita camping</h3>
<p>joined · went · poked · looked · did not recognize · said · opened · screamed · woke · told · had · dreamt/dreamed</p>
<h3>Koreksi kesalahan yang sering muncul</h3>
<div class="tw"><table><tr><th>Salah</th><th>Benar</th></tr>
<tr><td>lended, spended, buyed, costed, selled</td><td>lent, spent, bought, cost, sold</td></tr>
<tr><td>say (past), claimt, sended</td><td>said, claimed, sent</td></tr>
<tr><td>withdrawn, spoken (sebagai V2)</td><td>withdrew, spoke</td></tr>
<tr><td>choosed, bitten, hided, eaten</td><td>chose, bit, hid, ate</td></tr>
<tr><td>layed, sung, holded, growed, swum, sleeped</td><td>laid, sang, held, grew, swam, slept</td></tr>
<tr><td>I thought it <u>were</u> a bear</td><td>I thought it <u>was</u> a bear</td></tr></table></div>`,

6:`<h2>Jebakan yang paling sering</h2>
<div class="warn"><b>1. mustn't vs don't have to:</b> mustn't = dilarang; don't have to = tidak wajib.</div>
<div class="warn"><b>2. by vs until:</b> by = deadline; until = durasi terus-menerus.</div>
<div class="warn"><b>3. Setelah did / didn't:</b> pakai V1. ❌ Did she checked? ❌ I didn't went.</div>
<div class="warn"><b>4. Tidak ada ‘musted’:</b> past dari must / have to = had to.</div>
<div class="warn"><b>5. suggest:</b> I suggest attending / that you attend. Bukan ‘suggest you to’.</div>
<div class="warn"><b>6. Please / Kindly + base verb:</b> tanpa ‘to’.</div>
<div class="warn"><b>7. Sequence connector:</b> selalu diikuti koma (First, Next, Then, After that, Finally,).</div>
<div class="warn"><b>8. -ed sound:</b> berakhir T/D → /id/ (printed, submitted, needed). Berakhir /s/ (fixed) → /t/.</div>
<div class="warn"><b>9. Persuaded / closed / filed:</b> tidak ada suku kata tambahan (/d/).</div>
<div class="warn"><b>10. hang → hung;</b> hanged hanya untuk hukuman gantung. <b>Stay → stayed</b> (bukan staied).</div>
<div class="warn"><b>11. Recount vs Narrative:</b> recount tanpa konflik rumit; narrative punya konflik + resolusi.</div>
<div class="warn"><b>12. Re-orientation</b> = kesimpulan + komentar pribadi (bukan Orientation).</div>
<div class="tip"><b>Pola jawaban modal:</b> aturan tertulis / K3 / pengumuman resmi → <b>must</b>. Hukum atau bos → <b>have to</b>. Butuh untuk tujuan → <b>need to</b>. Saran → <b>should</b>. Moral → <b>ought to</b>.</div>`
};

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DL={h:'Sulit',m:'Sedang',e:'Mudah'}, DI={h:'🔥',m:'⚡',e:'🌱'};
const store={
  get(){try{return JSON.parse(localStorage.getItem('enq_v1'))||{}}catch(e){return {}}},
  set(o){try{localStorage.setItem('enq_v1',JSON.stringify(o))}catch(e){}}
};
let state={tab:'quiz',order:'hard',cheat:1,quiz:null};

function go(tab){
  state.tab=tab;
  $('#tab-quiz').setAttribute('aria-selected',tab==='quiz');
  $('#tab-cheat').setAttribute('aria-selected',tab==='cheat');
  if(tab==='quiz'){const z=state.quiz;if(!z)renderHome();else if(z.ans.length===z.items.length)finish();else renderQuiz()} else renderCheat();
  window.scrollTo(0,0);
}

/* ============ HOME ============ */
function renderHome(){
  state.quiz=null;
  const st=store.get();
  const cards=SESSIONS.map(s=>{
    const b=st['s'+s.id];
    return `<button class="sess" onclick="start(${s.id})">
      <span class="n">${s.emoji} ${s.q.length} soal</span>
      <span class="t">${esc(s.title)}</span>
      <span class="s">${esc(s.sub)}</span>
      <span class="b">${b?`Skor terbaik: ${b.score}/${b.total}`:'Belum dicoba'}</span></button>`;
  }).join('');
  const sb=st.sim;
  app.innerHTML=`
    <h1>Pilih sesi</h1>
    <p class="lead">Tiap sesi berisi 30 soal dengan campuran tingkat kesulitan. Jika salah, penjelasan langsung muncul.</p>
    <div><span class="seg-label">Urutan soal:</span>
      <span class="seg" role="group" aria-label="Urutan soal">
        <button aria-pressed="${state.order==='hard'}" onclick="setOrder('hard')">Sulit → mudah</button>
        <button aria-pressed="${state.order==='shuffle'}" onclick="setOrder('shuffle')">Acak</button>
      </span></div>
    <div class="grid">${cards}
      <button class="sess sim" onclick="start('sim')">
        <span class="n">🎯 30 soal acak</span>
        <span class="t">Simulasi quiz</span>
        <span class="s">10 sulit + 10 sedang + 10 mudah dari semua sesi.</span>
        <span class="b">${sb?`Skor terbaik: ${sb.score}/${sb.total}`:'Belum dicoba'}</span></button>
    </div>
    <p class="hint">Tips: tekan 1–4 atau A–D untuk memilih jawaban, Enter untuk lanjut. Skor terbaik disimpan di browser.</p>`;
}
function setOrder(o){state.order=o;renderHome()}

/* ============ QUIZ ============ */
function prepare(pool,order){
  const items=pool.map(x=>{const opts=shuffle([x.a,...x.w]);return {src:x,d:x.d,q:x.q,e:x.e,a:x.a,opts,ai:opts.indexOf(x.a)}});
  if(order==='shuffle')return shuffle(items);
  const g={h:[],m:[],e:[]};items.forEach(i=>g[i.d].push(i));
  return [...shuffle(g.h),...shuffle(g.m),...shuffle(g.e)];
}
function start(id){
  let pool,title,key;
  if(id==='sim'){
    const all=SESSIONS.flatMap(s=>s.q);
    pool=['h','m','e'].flatMap(d=>shuffle(all.filter(x=>x.d===d)).slice(0,10));
    title='Simulasi quiz';key='sim';
  }else{
    const s=SESSIONS.find(x=>x.id===id);pool=s.q;title=s.title+' · '+s.sub;key='s'+id;
  }
  state.quiz={key,title,pool,items:prepare(pool,state.order),i:0,ans:[],locked:false,order:state.order};
  renderQuiz();window.scrollTo(0,0);
}
function renderQuiz(){
  const z=state.quiz,it=z.items[z.i],n=z.items.length;
  const score=z.ans.filter(a=>a.ok).length;
  const opts=it.opts.map((o,k)=>`<button class="opt" data-k="${k}" onclick="pick(${k})"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('');
  app.innerHTML=`
    <div class="qhead"><span>${esc(z.title)}</span><span>Soal ${z.i+1}/${n} · Benar ${score}</span></div>
    <div class="bar"><i style="width:${(z.i/n)*100}%"></i></div>
    <div class="card">
      <span class="badge ${it.d}">${DI[it.d]} ${DL[it.d]}</span>
      <p class="q">${esc(it.q)}</p>
      <div class="opts" id="opts">${opts}</div>
      <div id="fb"></div>
      <div class="actions" id="act"></div>
    </div>
    <p class="hint"><button class="btn ghost" style="padding:6px 12px;font-size:13px" onclick="quit()">Keluar</button></p>`;
  z.locked=false;
  if(z.ans.length>z.i)showFeedback(z.ans[z.i]);
}
function pick(k){
  const z=state.quiz;if(z.locked)return;z.locked=true;
  const it=z.items[z.i];
  z.ans.push({it,k,ok:k===it.ai});
  showFeedback(z.ans[z.i]);
}
function showFeedback(r){
  const z=state.quiz,it=r.it,k=r.k,ok=r.ok;
  z.locked=true;
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(j===it.ai)b.classList.add('ok');
    else if(j===k)b.classList.add('bad');
    else b.classList.add('dim');
  });
  $('#fb').innerHTML=ok
    ?`<div class="fb ok"><strong>✅ Benar!</strong><p>${esc(it.e)}</p></div>`
    :`<div class="fb bad"><strong>❌ Kurang tepat. Jawaban benar: ${esc(it.a)}</strong><p>${esc(it.e)}</p></div>`;
  const last=z.i===z.items.length-1;
  $('#act').innerHTML=`<button class="btn" id="nextBtn" onclick="next()">${last?'Lihat hasil':'Soal berikutnya'}</button>`;
  $('#nextBtn').focus({preventScroll:true});
}
function next(){
  const z=state.quiz;
  if(z.i<z.items.length-1){z.i++;renderQuiz();window.scrollTo(0,0)}else finish();
}
function quit(){if(confirm('Keluar dari quiz? Progres soal ini tidak disimpan.')){state.quiz=null;renderHome()}}

function finish(){
  const z=state.quiz,total=z.ans.length,score=z.ans.filter(a=>a.ok).length;
  if(!z.retry){const st=store.get();if(!st[z.key]||score>st[z.key].score){st[z.key]={score,total,date:Date.now()};store.set(st)}}
  const pct=Math.round(score/total*100);
  const msg=pct>=90?'Luar biasa! Siap untuk quiz.':pct>=75?'Bagus! Tinggal rapikan beberapa poin.':pct>=60?'Lumayan. Baca cheat sheet lalu ulangi soal yang salah.':'Ayo ulangi. Fokus pada penjelasan di bawah.';
  const dif=['h','m','e'].map(d=>{
    const a=z.ans.filter(x=>x.it.d===d),c=a.filter(x=>x.ok).length;
    if(!a.length)return '';
    const col={h:'var(--hard)',m:'var(--mid)',e:'var(--easy)'}[d];
    return `<div><span>${DI[d]} ${DL[d]}</span><span class="tr"><i style="width:${c/a.length*100}%;background:${col}"></i></span><span>${c}/${a.length}</span></div>`;
  }).join('');
  const wrong=z.ans.filter(a=>!a.ok);
  const wlist=wrong.length?wrong.map(a=>`<div class="wrong">
      <div class="wq">${DI[a.it.d]} ${esc(a.it.q)}</div>
      <p class="you">Jawabanmu: ${esc(a.it.opts[a.k])}</p>
      <p class="right">Jawaban benar: ${esc(a.it.a)}</p>
      <p>${esc(a.it.e)}</p></div>`).join(''):'<p>Semua benar. Mantap! 🎉</p>';
  app.innerHTML=`
    <div class="card">
      <div class="score"><div class="big">${score}<span style="font-size:28px;color:var(--muted)">/${total}</span></div>
      <div class="msg">${pct}% · ${msg}</div></div>
      <div class="dif">${dif}</div>
      <div class="actions">
        ${wrong.length?`<button class="btn" onclick="retryWrong()">Ulangi ${wrong.length} soal yang salah</button>`:''}
        <button class="btn ghost" onclick="restart()">Ulangi dari awal</button>
        <button class="btn ghost" onclick="go('cheat')">Buka cheat sheet</button>
        <button class="btn ghost" onclick="state.quiz=null;renderHome()">Menu utama</button>
      </div>
    </div>
    <h2 style="margin-top:24px">Soal yang salah (${wrong.length})</h2>${wlist}`;
  window.scrollTo(0,0);
}
function restart(){
  const z=state.quiz;
  state.quiz={key:z.key,title:z.title,pool:z.pool,items:prepare(z.pool,state.order),i:0,ans:[],locked:false,retry:z.retry};
  renderQuiz();window.scrollTo(0,0);
}
function retryWrong(){
  const z=state.quiz,pool=z.ans.filter(a=>!a.ok).map(a=>a.it.src);
  state.quiz={key:z.key,title:z.title+' (ulang soal salah)',pool,items:prepare(pool,'shuffle'),i:0,ans:[],locked:false,retry:true};
  renderQuiz();window.scrollTo(0,0);
}

/* ============ CHEAT SHEET ============ */
function renderCheat(){
  const names={1:'S1 SOP & advice',2:'S2 Deadlines & modals',3:'S3 Past regular & MCR',4:'S4 Irregular & history',5:'S5 Recount & text types',6:'Jebakan'};
  const tabs=Object.keys(names).map(k=>`<button role="tab" aria-selected="${state.cheat==k}" onclick="state.cheat=${k};renderCheat()">${names[k]}</button>`).join('');
  app.innerHTML=`<div class="subtabs" role="tablist">${tabs}</div>
    <div class="cs">${CHEAT[state.cheat]}</div>
    <div class="actions"><button class="btn ghost" onclick="window.print()">Cetak / simpan PDF</button></div>`;
}

/* ============ KEYBOARD ============ */
document.addEventListener('keydown',e=>{
  const z=state.quiz;
  if(state.tab!=='quiz'||!z||!document.getElementById('opts'))return;
  const k='1234abcd'.indexOf(e.key.toLowerCase());
  if(!z.locked&&k>-1){pick(k%4);return}
  if(z.locked&&(e.key==='ArrowRight')){next()}
});

renderHome();
</script>
