 {q:"\"We're sorry to hear that the product didn't meet your ___.\"",opts:["expectations","hopes","wishes","dreams"],c:0,d:"Medium",ok:"\"Expectations\" is the standard business term used when discussing product performance versus customer standards.",no:"\"Hopes/wishes/dreams\" are too emotional or informal for this professional customer-service context."},
 {q:"Which is the best way to de-escalate an angry customer on the phone?",opts:["\"Sir, please stop shouting.\"","\"I hear how upsetting this is, and I want to make it right — let's go through this together.\"","\"There's nothing I can do.\"","\"You need to calm down first.\""],c:1,d:"Hard",ok:"This response acknowledges the customer's emotions and offers collaborative help, which is the professional de-escalation standard.",no:"The other options are commanding, dismissive, or unhelpful, which tend to escalate anger rather than calm it."},
 {q:"Which sentence professionally declines a refund request while offering an alternative?",opts:["\"No refunds, sorry.\"","\"I'm unable to offer a refund in this case, but I'd be happy to offer a replacement or store credit instead.\"","\"That's against policy, can't help.\"","\"Ask someone else.\""],c:1,d:"Hard",ok:"This response clearly explains the limitation while offering a constructive alternative.",no:"The other options are abrupt or unhelpful, leaving the customer without any path forward."},
 {q:"Which is the most professional way to ask a customer to repeat information?",opts:["\"What did you say?\"","\"I'm sorry, could you please repeat that for me?\"","\"Huh?\"","\"Say again.\""],c:1,d:"Hard",ok:"This phrasing is polite and apologizes before making the request.",no:"The other options are too blunt or casual for a professional customer-service interaction."},
 {q:"Which sentence best closes a customer service call professionally?",opts:["\"OK bye.\"","\"Thank you for your patience today. Is there anything else I can help you with?\"","\"That's all, goodbye.\"","\"Done, next.\""],c:1,d:"Hard",ok:"This closing thanks the customer and offers further assistance before ending the call.",no:"The other options are abrupt and don't leave room for any final questions."},
 {q:"Which phrase is appropriate for informing a customer about a follow-up survey?",opts:["\"Please rate us or else.\"","\"We'd appreciate it if you could take a moment to complete our feedback survey.\"","\"Fill this out now.\"","\"Survey, please, thanks.\""],c:1,d:"Hard",ok:"This phrasing politely invites participation without pressuring the customer.",no:"The other options are demanding or too abrupt for a polite request."},
 {q:"\"We take all complaints ___ and will investigate this thoroughly.\"",opts:["seriously","serious","severely","heavily"],c:0,d:"Medium",ok:"\"Seriously\" is the correct adverb modifying the verb \"take\" in this fixed phrase.",no:"\"Serious\" is an adjective (wrong word form here), and \"severely/heavily\" don't fit this standard customer-service collocation."},
 {q:"\"Please accept our sincere apologies for any ___ this may have caused.\"",opts:["inconvenience","inconvenient","convenience","convenient"],c:0,d:"Medium",ok:"\"Inconvenience\" is the correct noun form needed after \"any.\"",no:"\"Inconvenient\" is an adjective, and \"convenience/convenient\" have the opposite meaning — the correct noun is \"inconvenience.\""},
 {q:"\"Our team is currently ___ into the issue and will update you shortly.\"",opts:["looking","looked","look","looks"],c:0,d:"Medium",ok:"\"Looking\" correctly completes the present continuous tense (\"is currently looking\").",no:"\"Looked/look/looks\" don't fit the present continuous structure required with \"is currently.\""},
 {q:"\"We aim to respond to all inquiries ___ 24 hours.\"",opts:["within","inside","by","on"],c:0,d:"Medium",ok:"\"Within 24 hours\" is the standard fixed phrase for stating a response-time commitment.",no:"\"Inside/by/on\" are not the natural collocation used for this type of time-frame commitment."},
 {q:"\"Is there anything else I can ___ with today?\"",opts:["help","assist","aid","support"],c:0,d:"Medium",ok:"\"Help you with\" is the standard closing phrase in customer service, matching the preposition \"with.\"",no:"\"Assist/aid/support with\" are less natural in this specific fixed closing phrase — the standard verb is \"help.\""},
 {q:"Which sentence correctly reports a customer complaint to a manager?",opts:["\"customer angry, bad product\"","\"A customer reported that the product arrived damaged and has requested a replacement.\"","\"someone mad about box\"","\"complaint, box broke, fix\""],c:1,d:"Hard",ok:"This is a complete, professional sentence clearly stating the issue and the customer's request.",no:"The other options are sentence fragments too informal for reporting to a manager."},
 {q:"Which response best handles a customer who is repeating the same complaint?",opts:["\"I already told you the answer.\"","\"I understand you've raised this before — let me review it again to make sure we resolve it properly this time.\"","\"You already asked this.\"","\"Nothing has changed.\""],c:1,d:"Hard",ok:"This response acknowledges the repetition without blaming the customer and commits to resolving it properly.",no:"The other options sound dismissive or blame the customer for repeating their concern."},
 {q:"Which is the most professional way to thank a customer for their loyalty?",opts:["\"Thanks for buying stuff.\"","\"We truly appreciate your continued support and loyalty as a valued customer.\"","\"Nice, you bought again.\"","\"Good customer, thanks.\""],c:1,d:"Hard",ok:"This is a complete, warm, and professional expression of appreciation.",no:"The other options are too casual or awkwardly phrased for professional customer communication."},
 {q:"Which sentence uses \"regret\" correctly and formally?",opts:["\"We regret to inform you that your order has been delayed.\"","\"We regret you that your order late.\"","\"Regret, order delay, sorry.\"","\"We are regret for the delay.\""],c:0,d:"Hard",ok:"\"We regret to inform you that...\" is the correct, standard formal structure for delivering unwelcome news.",no:"The other options misuse the grammar of \"regret\" or are sentence fragments."},
 {q:"\"Could you please confirm your ___ address so we can send the replacement?\"",opts:["shipping","sending","mail-out","post-out"],c:0,d:"Medium",ok:"\"Shipping address\" is the standard business term for the delivery address.",no:"\"Sending/mail-out/post-out address\" are not standard fixed terms — the correct phrase is \"shipping address.\""}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildSessionForPart(part){
  const base = QUESTION_BANK[part];
  const shuffledQs = shuffle(base.map((q,origIdx)=>({...q, origIdx})));
  const withShuffledOpts = shuffledQs.map(q=>{
    const optObjs = q.opts.map((text,i)=>({text, isCorrect:i===q.c}));
    const shuffledOpts = shuffle(optObjs);
    return {...q, shuffledOpts};
  });
  sessionOrder[part] = withShuffledOpts;
}

  const modes = [
    {key:'mc', label:'📝 Pilihan Ganda'},
    {key:'email', label:'✉️ Latihan Email'},
    {key:'cheatsheet', label:'📘 Cheatsheet'}
  ];
  modes.forEach(m=>{
    const btn = document.createElement('button');
    btn.textContent = m.label;
    if(currentView===m.key) btn.classList.add('active');
    btn.onclick = ()=>{
      currentView=m.key;
      if(m.key==='email' && currentPart>EMAIL_PART_COUNT) currentPart = 1;
      render();
    };
    modeRow.appendChild(btn);
  });
  nav.appendChild(modeRow);

  if(currentView==='mc' || currentView==='email'){
    const partRow = document.createElement('div');
    partRow.className = 'nav-row part-row';
    const maxPart = currentView==='email' ? EMAIL_PART_COUNT : MC_PART_COUNT;
    for(let p=1;p<=maxPart;p++){
      const btn = document.createElement('button');
      btn.textContent = 'Part ' + p;
      if(currentPart===p) btn.classList.add('active');
      btn.onclick = ()=>{ currentPart=p; render(); };
      partRow.appendChild(btn);
    }
    nav.appendChild(partRow);
  }
}

/* ============ MC QUESTION RENDER ============ */
function renderQuestion(part, q, displayIdx){
  const card = document.createElement('div');
  card.className = 'q-card';
  const key = `${part}-${q.origIdx}`;

  const head = document.createElement('div');
  head.className = 'q-head';
  head.innerHTML = `<span class="q-num">Soal ${displayIdx+1} / 30</span><span class="badge ${q.d.toLowerCase()}">${q.d}</span>`;
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'q-text';
  qtext.textContent = q.q;
  card.appendChild(qtext);

  const explainDiv = document.createElement('div');

  q.shuffledOpts.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt.text;
    b.onclick = ()=>{
      if(answered[key]) return;
      answered[key] = true;
      score.total++;
      const allBtns = card.querySelectorAll('.opt');
      allBtns.forEach(ob=>ob.classList.add('disabled'));
      q.shuffledOpts.forEach((o,i)=>{
        if(o.isCorrect) allBtns[i].classList.add('correct');
      });
      if(opt.isCorrect){
        score.correct++;
        b.classList.add('correct');
        explainDiv.className = 'explain show ok';
        explainDiv.innerHTML = '<b>Benar!</b> ' + q.ok;
      } else {
        b.classList.add('wrong');
        explainDiv.className = 'explain show no';
        explainDiv.innerHTML = '<b>Kurang tepat.</b> ' + q.no;
      }
      updateScoreboard();
    };
    card.appendChild(b);
  });

  card.appendChild(explainDiv);
  return card;
}

/* ============ EMAIL EXERCISE RENDER ============ */
function renderEmail(part, ex, displayIdx){
  const card = document.createElement('div');
  card.className = 'email-card';
  card.innerHTML = `
    <div class="q-head"><span class="q-num">Latihan Email ${displayIdx+1} / 3</span></div>
    <p style="font-family:Arial,sans-serif;font-size:0.9rem;margin:4px 0 0;">Email di bawah ini memiliki beberapa kesalahan (tata bahasa, kelengkapan, kesopanan, penggunaan To/Cc, dan format). Tuliskan versi email bisnis yang benar dan profesional, lengkap dengan header To/Cc/Subject.</p>
    <div class="email-draft">To: ${ex.to}\nCc: ${ex.cc}\nSubject: ${ex.subject}\n\n${ex.body}</div>
    <textarea placeholder="Tulis versi perbaikan email Anda di sini..."></textarea>
    <div>
      <button class="btn">Lihat Petunjuk Kesalahan</button>
      <button class="btn secondary">Tampilkan Contoh Jawaban</button>
    </div>
    <ul class="checklist hidden"></ul>
    <div class="model-answer"></div>
  `;
  const [hintBtn, modelBtn] = card.querySelectorAll('.btn');
  const checklist = card.querySelector('.checklist');
  const modelDiv = card.querySelector('.model-answer');

  hintBtn.onclick = ()=>{
    checklist.classList.toggle('hidden');
    checklist.innerHTML = ex.issues.map(i=>`<li>${i}</li>`).join('');
  };
  modelBtn.onclick = ()=>{
    modelDiv.classList.toggle('show');
    modelDiv.textContent = ex.model;
  };
  return card;
}

/* ============ SCOREBOARD ============ */
function updateScoreboard(){
  const el = document.getElementById('scoreboardText');
  if(el) el.innerHTML = `Skor sesi ini: <b>${score.correct} / ${score.total}</b> benar`;
}

/* ============ MC VIEW (Pilihan Ganda only) ============ */
function renderMCView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  if(!sessionOrder[currentPart]) buildSessionForPart(currentPart);

  const titleEl = document.createElement('h2');
  titleEl.className = 'section-title';
  titleEl.textContent = '📝 ' + PART_TITLES[currentPart] + ' — Pilihan Ganda';
  main.appendChild(titleEl);

  const scoreboard = document.createElement('div');
  scoreboard.className = 'scoreboard';
  scoreboard.innerHTML = `<span id="scoreboardText">Skor sesi ini: <b>${score.correct} / ${score.total}</b> benar</span><span>🔀 Urutan soal &amp; pilihan diacak setiap kali Anda membuka part ini</span>`;
  main.appendChild(scoreboard);

  sessionOrder[currentPart].forEach((q,i)=>{
    main.appendChild(renderQuestion(currentPart, q, i));
  });

  const finishBox = document.createElement('div');
  finishBox.className = 'finish-box';
  const nextPart = currentPart < MC_PART_COUNT ? currentPart+1 : null;
  finishBox.innerHTML = `<h3>Selesai dengan Pilihan Ganda Part ${currentPart}?</h3><p style="font-family:Arial,sans-serif;font-size:0.85rem;">${nextPart? 'Lanjutkan ke Part berikutnya, atau acak ulang part ini untuk latihan tambahan.':'Anda sudah menyelesaikan Pilihan Ganda di semua '+MC_PART_COUNT+' Part!'}</p>`;
  const btnRow = document.createElement('div');
  const shuffleBtn = document.createElement('button');
  shuffleBtn.className = 'btn secondary';
  shuffleBtn.textContent = '🔀 Acak Ulang Part Ini';
  shuffleBtn.onclick = ()=>{ buildSessionForPart(currentPart); render(); };
  btnRow.appendChild(shuffleBtn);
  if(nextPart){
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn';
    nextBtn.textContent = 'Lanjut ke Part ' + nextPart + ' →';
    nextBtn.onclick = ()=>{ currentPart = nextPart; render(); };
    btnRow.appendChild(nextBtn);
  }
  finishBox.appendChild(btnRow);
  main.appendChild(finishBox);
}

/* ============ CHEATSHEET VIEW ============ */
function renderCheatsheetView(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  const titleEl = document.createElement('h2');
  titleEl.className = 'section-title';
  titleEl.textContent = '📘 Cheatsheet';
  main.appendChild(titleEl);

  const tabs = document.createElement('div');
  tabs.className = 'cheat-tabs';
  tabs.innerHTML = `<button id="tabMC" class="active">Pilihan Ganda</button><button id="tabEmail">Penulisan Email Bisnis</button>`;
  main.appendChild(tabs);

  const mcPanel = document.createElement('div');
  mcPanel.className = 'cheat-panel show';
  mcPanel.id = 'panelMC';
  mcPanel.innerHTML = `
  <details open><summary>📞 Frasa Telepon (Telephone Phrases)</summary><ul>
    <li><b>hold on</b> — tunggu sebentar di telepon</li>
    <li><b>put (someone) through</b> — menyambungkan telepon ke orang/departemen lain</li>
    <li><b>breaking up</b> — sinyal telepon tidak jelas/putus-putus</li>
    <li><b>leave a message</b> — meninggalkan pesan</li>
    <li><b>wrong number</b> — salah sambung</li>
    <li><b>on the line</b> — sedang menelepon/dalam panggilan</li>
  </ul></details>
  <details><summary>👤 Pronoun (Kata Ganti)</summary><ul>
    <li><b>Subject</b>: he, she, they, we, I — sebagai subjek kalimat</li>
    <li><b>Object</b>: him, her, them, us, me — setelah kata kerja/preposisi (for him, give it to her)</li>
    <li><b>Possessive adjective</b>: his, her, their, our, my — sebelum kata benda (his badge)</li>
    <li><b>Possessive pronoun</b>: his, hers, theirs, ours, mine — berdiri sendiri tanpa kata benda (it's theirs)</li>
    <li><b>Reflexive</b>: himself, herself, themselves — menekankan subjek melakukan sendiri (he did it himself)</li>
  </ul></details>
  <details><summary>✉️ Etika Email</summary><ul>
    <li><b>To</b> — penerima utama</li>
    <li><b>CC</b> — tembusan yang terlihat oleh semua penerima</li>
    <li><b>BCC</b> — tembusan tersembunyi, tidak terlihat penerima lain</li>
    <li>Sapaan formal: <i>Dear Mr./Ms. [Nama],</i> — hindari "Hey/Yo" untuk kontak formal</li>
    <li>Penutup formal: <i>Sincerely,</i> / <i>Best regards,</i></li>
    <li>Subject line harus spesifik dan informatif, hindari huruf kapital semua atau tanda seru berlebihan</li>
  </ul></details>
  <details><summary>📅 Kosakata Rapat & Jadwal</summary><ul>
    <li><b>agenda</b> — daftar topik sebelum rapat</li>
    <li><b>minutes</b> — notulen/catatan hasil rapat</li>
    <li><b>postpone</b> — menunda ke waktu lain</li>
    <li><b>cancel</b> — membatalkan sepenuhnya</li>
    <li><b>confirm</b> — memastikan/mengonfirmasi kehadiran</li>
  </ul></details>
  <details><summary>⏳ Will vs Going to</summary><ul>
    <li><b>will</b> — keputusan spontan ("The phone is ringing, I will answer it") atau janji ("I promise I will finish it")</li>
    <li><b>going to</b> — rencana yang sudah diatur sebelumnya ("We are going to leave on Monday" — tiket sudah dipesan) atau prediksi berdasarkan bukti nyata ("Look at the clouds, it's going to rain")</li>
  </ul></details>
  <details><summary>🔢 Quantifiers (some/any/much/many)</summary><ul>
    <li><b>much</b> — untuk uncountable noun, biasanya di kalimat negatif/pertanyaan (much time, much information)</li>
    <li><b>many</b> — untuk countable noun jamak, di kalimat negatif/pertanyaan (many seats, many samples)</li>
    <li><b>some</b> — biasanya di kalimat positif atau penawaran (some coffee?, some information)</li>
    <li><b>any</b> — biasanya di kalimat negatif atau pertanyaan (do you have any samples?)</li>
  </ul></details>
  <details><summary>💰 Kosakata Transaksi Bisnis</summary><ul>
    <li><b>quotation</b> — perkiraan harga sebelum pekerjaan dimulai</li>
    <li><b>purchase order (PO)</b> — dokumen resmi pembeli untuk memesan barang</li>
    <li><b>invoice</b> — tagihan setelah pekerjaan/barang selesai, meminta pembayaran</li>
    <li><b>receipt</b> — bukti bahwa pembayaran sudah dilakukan</li>
    <li><b>discount</b> — potongan harga</li>
  </ul></details>
  <details><summary>📖 Countable vs Uncountable Nouns</summary><ul>
    <li><b>Uncountable (tidak bisa dijamakkan)</b>: furniture, information, time, money, advice</li>
    <li>Untuk menghitung uncountable noun, gunakan satuan: <i>a piece of furniture</i>, <i>three pieces of furniture</i></li>
  </ul></details>`;
  main.appendChild(mcPanel);

  const emailPanel = document.createElement('div');
  emailPanel.className = 'cheat-panel';
  emailPanel.id = 'panelEmail';
  emailPanel.innerHTML = `
  <details open><summary>🏗️ Struktur Email Bisnis</summary><ul>
    <li><b>Subject line</b> — jelas dan spesifik (contoh: "Meeting Request – Tuesday 10 AM")</li>
    <li><b>Salam pembuka (Greeting)</b> — "Dear Mr./Ms. [Nama]," untuk kontak formal/baru</li>
    <li><b>Kalimat pembuka</b> — sapaan singkat atau referensi ke email sebelumnya ("I hope this email finds you well.")</li>
    <li><b>Isi pesan (Body)</b> — sampaikan tujuan dengan jelas, satu topik utama per email, sertakan detail penting (tanggal, jumlah, nomor pesanan)</li>
    <li><b>Permintaan tindakan (Call to action)</b> — apa yang Anda butuhkan dari penerima dan kapan</li>
    <li><b>Penutup (Closing line)</b> — ucapan terima kasih ("Thank you for your time and consideration.")</li>
    <li><b>Sign-off + nama</b> — "Best regards," / "Sincerely," diikuti nama lengkap</li>
  </ul></details>
  <details><summary>🎩 Etika Komunikasi Bisnis</summary><ul>
    <li>Hindari singkatan gaya chat (u, pls, tmr, im) — gunakan kata lengkap</li>
    <li>Hindari huruf kapital semua (ALL CAPS) dan tanda seru berlebihan (!!!)</li>
    <li>Gunakan nada sopan meski menyampaikan keluhan atau tenggat mendesak</li>
    <li>Sertakan detail spesifik (nomor pesanan, tanggal, jumlah) agar penerima mudah menindaklanjuti</li>
    <li>Satu topik utama per email — jangan mencampur banyak permintaan berbeda</li>
    <li>CC hanya untuk pihak yang relevan; BCC untuk tembusan yang tidak perlu diketahui penerima utama</li>
  </ul></details>
  <details><summary>🔧 Kesalahan Umum yang Harus Dihindari</summary><ul>
    <li>Sapaan terlalu santai ("Hi bro", "Hey") untuk kontak formal/baru</li>
    <li>Tidak ada sign-off atau nama pengirim</li>
    <li>Nada mengancam atau menuntut, bukan meminta dengan sopan</li>
    <li>Grammar dasar: "the meeting is cancel" → "has been cancelled"; "yesterday meeting" → "yesterday's meeting"</li>
    <li>Subject line kosong atau terlalu umum ("hi", "doc", "help")</li>
  </ul></details>`;
  main.appendChild(emailPanel);

  document.getElementById('tabMC').onclick = ()=>{
    document.getElementById('tabMC').classList.add('active');
    document.getElementById('tabEmail').classList.remove('active');
    mcPanel.classList.add('show');
    emailPanel.classList.remove('show');
  };
  document.getElementById('tabEmail').onclick = ()=>{
    document.getElementById('tabEmail').classList.add('active');
    document.getElementById('tabMC').classList.remove('active');
    emailPanel.classList.add('show');
    mcPanel.classList.remove('show');
  };
}

/* ============ MAIN RENDER ============ */
function render(){
  renderNav();
  if(currentView==='cheatsheet') renderCheatsheetView();
  else if(currentView==='email') renderEmailView();
  else renderMCView();
  window.scrollTo(0,0);
}

render();
</script>
